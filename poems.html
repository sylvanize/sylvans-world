<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>haiku · sylvan's world</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #E1DEDB;
      color: #282828;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    ::selection { background: #282828; color: #E1DEDB; }

    /* ===== 顶部导航 ===== */
    .poem-nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 50;
      display: flex; justify-content: space-between; align-items: center;
      padding: 24px 48px;
      background: linear-gradient(to bottom, #E1DEDB 70%, transparent);
    }
    .poem-nav a {
      color: #282828; text-decoration: none;
      font-size: 15px; letter-spacing: .04em;
      opacity: .75; transition: opacity .2s;
    }
    .poem-nav a:hover { opacity: 1; }
    .poem-nav .brand {
      font-family: 'Playfair Display', Georgia, serif;
      font-style: italic; font-size: 22px; opacity: .85; letter-spacing: 0;
    }

    /* ===== 标题 ===== */
    .poem-head {
      padding: 110px 8vw 10px;
      display: flex; align-items: baseline; justify-content: space-between;
    }
    .poem-head h1 {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-weight: 400;
      font-size: clamp(40px, 6vw, 72px);
      letter-spacing: -0.02em;
    }
    .poem-head .count { font-size: 13px; letter-spacing: .2em; opacity: .5; text-transform: uppercase; }

    /* ===== 俳句列表 ===== */
    .poem-list {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px 8vw 80px;
    }
    .poem-card {
      border-bottom: 1px solid rgba(40,40,40,.12);
      padding: 26px 4px;
      cursor: pointer;
      transition: opacity .2s, transform .2s;
      -webkit-tap-highlight-color: transparent;
    }
    .poem-card:hover { opacity: .65; }
    .poem-card:active { transform: scale(.995); }
    .poem-card .lines {
      font-size: clamp(16px, 2vw, 20px);
      font-weight: 300;
      line-height: 1.9;
      letter-spacing: .04em;
      white-space: pre-line;
    }
    .poem-card .date {
      margin-top: 10px;
      font-size: 12px; letter-spacing: .22em;
      opacity: .45; text-transform: uppercase;
    }

    /* ===== 详情弹层 ===== */
    .poem-overlay {
      position: fixed; inset: 0; z-index: 100;
      background: #E1DEDB;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 12vw;
      opacity: 0; pointer-events: none;
      transition: opacity .3s ease;
    }
    .poem-overlay.open { opacity: 1; pointer-events: auto; }
    .poem-overlay .big-lines {
      font-size: clamp(24px, 4vw, 44px);
      font-weight: 300;
      line-height: 2;
      letter-spacing: .05em;
      text-align: center;
      white-space: pre-line;
      animation: fadeUp .5s ease;
    }
    .poem-overlay .big-date {
      margin-top: 2.2em;
      font-size: 13px; letter-spacing: .25em;
      opacity: .5; text-transform: uppercase;
      animation: fadeUp .5s ease .12s both;
    }
    .poem-close {
      position: fixed; top: 24px; right: 40px; z-index: 101;
      background: none; border: none;
      font-size: 26px; color: #282828; opacity: .7;
      cursor: pointer; padding: 8px;
    }
    .poem-close:hover { opacity: 1; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: none; }
    }

    /* ===== 写俳句入口（右下角浮动） ===== */
    .write-btn {
      position: fixed; bottom: 28px; right: 28px; z-index: 60;
      width: 56px; height: 56px; border-radius: 50%;
      background: #282828; color: #E1DEDB;
      border: none; font-size: 26px; font-weight: 300;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 6px 20px rgba(40,40,40,.25);
      transition: transform .2s, opacity .2s;
      text-decoration: none;
    }
    .write-btn:hover { transform: scale(1.08); }
    .write-btn:active { transform: scale(.95); }

    @media (max-width: 768px) {
      .poem-nav { padding: 16px 20px; }
      .poem-head { padding: 90px 6vw 0; }
      .poem-list { padding: 10px 6vw 100px; }
      .poem-card { padding: 20px 2px; }
      .poem-overlay { padding: 16vw; }
      .poem-close { right: 20px; }
      .write-btn { bottom: 22px; right: 22px; width: 52px; height: 52px; }
    }
  </style>
</head>
<body>

  <nav class="poem-nav">
    <a href="home.html" class="brand">sylvan</a>
    <div style="display:flex;gap:1.5rem;">
      <a href="notes.html">日常</a>
      <a href="home.html">← back</a>
    </div>
  </nav>

  <div class="poem-head">
    <h1>haiku</h1>
    <span class="count" id="poemCount">0 首</span>
  </div>

  <div class="poem-list" id="poemList"></div>

  <!-- 详情弹层 -->
  <div class="poem-overlay" id="poemOverlay">
    <button class="poem-close" id="poemClose" aria-label="关闭">✕</button>
    <div class="big-lines" id="bigLines"></div>
    <div class="big-date" id="bigDate"></div>
  </div>

  <a class="write-btn" id="writeBtn" title="写俳句">＋</a>

  <script src="js/poems.js"></script>
  <script src="js/cursor.js"></script>
</body>
</html>
