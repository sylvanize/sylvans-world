"time": "Sat Mar 21 12:20:20 +0800 2026", "text": "无法解决的有太多 面对别人的烦恼我有时竟说不出一句安慰的话 终究还是知识面太窄，要继续学习。", "source": "微博", "tags": ["被抛", "他人", "荒谬与反抗", "表达与语言", "自由与束缚"]}, {"time": "Wed Mar 18 21:10:24 +0800 2026", "text": "等待一个好运气", "source": "微博", "tags": ["被抛"]}, {"time": "Sun Mar 01 18:11:25 +0800 2026", "text": "peace and love", "source": "微博", "tags": ["杂多"]}, {"time": "Thu Nov 27 16:54:14 +0800 2025", "text": "发现自己可能才从hi7情绪中走出来。在之前的与人沟通畏畏缩缩，发每条信息都要思虑再三，这种无处不在的很坏的纠结情绪仿佛已经离开我了。我又更自由了点，虽然花了很长很长很长很长时间，长到我可能都以为自己已经被改变了。11.27，去年这个时间是不是刚同她第一次断联呢，真是感慨。那种每天偷偷打开抖音看她的感受我似乎还能够记得一点呢", "source": "微博", "tags": ["被抛", "他人", "自由", "向死而生", "身体", "表达与语言", "成为自己"]}, {"time": "Tue Oct 28 12:03:11 +0800 2025", "text": "我发现朋友真的是一个很浪漫的词。 友在字典上的意思是“ 关系密切、有交情的人”；在日常使用中，我们经常也把“一起做….事”的人成为x友，就比如饭友，笔友。而“朋”为月月，如此一来，朋友就是一起“从一个月亮走向另一个月亮”的人。", "source": "微博", "tags": ["他人", "身体与活着"]}, {"time": "Tue Oct 28 00:23:58 +0800 2025", "text": "我合上眼睛，世界倒地死去。我抬起眼帘，一切重获新生。", "source": "微博", "tags": ["被抛", "向死而生", "身体与活着"]}, {"time": "Tue Sep 23 00:16:14 +0800 2025", "text": "小学的饮水机流出来的水喝起来有着一股特别特别浓的怪味，感觉类似于消毒水的味道，我有点想回去喝", "source": "微博", "tags": ["被抛", "身体"]}, {"time": "Mon Sep 22 01:09:07 +0800 2025", "text": "就这样慢慢的淡出我的脑子里吧～", "source": "微博", "tags": ["向死而生", "成为自己"]}, {"time": "Thu Sep 18 22:53:09 +0800 2025", "text": "我没有任何理由要因为你不喜欢而改变我与他人的相处模式", "source": "微博", "tags": ["他人", "自由"]}, {"time": "Thu Sep 18 07:34:13 +0800 2025", "text": "泯然众人矣", "source": "微博", "tags": ["他人"]}, {"time": "Thu Sep 18 01:50:26 +0800 2025", "text": "哎！影响我心情的人赶快离开我的生活吧！", "source": "微博", "tags": ["他人", "身体", "身体与活着"]}, {"time": "Thu Sep 18 01:04:56 +0800 2025", "text": "焦虑，一开学一股焦虑就席卷我全身。我完全可以确定我根本不爱学习，我是被推着走的。我被逼迫着产生的，微小的动力显然不足以支撑我全速前进，但与周围人的差距却明明白白的摆在我的面前，我事事不如人。这种既懒惰又想要进步的矛盾心理催生了无数的焦虑。我讨厌自己不能够完完全全的不顾周围人所作所为的摆烂。\n其实参杂着的还有害怕。害怕回到上学期每天从早八点起床学到晚上十点，发现怎么学都学不完学不会时崩溃的精神状态。我现在依然深刻的记得某天早上开始学习之前坐在沙发上突然就哭了出来，想找朋友倾诉但发现无论找谁帮忙都无法加快我的学习进度那种孤立无援的感觉。我太害怕了。\n哎！希望明天能够鼓起勇气开始进入学习状态", "source": "微博", "tags": ["日记", "被抛", "畏", "他人", "自由", "向死而生", "身体", "自由与束缚", "成为自己"]}, {"time": "Wed Sep 17 20:21:50 +0800 2025", "text": "哎 我不明白", "source": "微博", "tags": ["杂多"]}, {"time": "Wed Sep 17 01:40:56 +0800 2025", "text": "回想起年幼时脑海里浮现的第一个画面是爸爸妈妈牵着我，在小区的隧道里三个人并排走着。现在回到家能跟爸妈聊上天的时刻不多，争吵倒是从来没有停过，到底是什么东西让我们的关系变成了这样，是因为我变了吗。我时常觉得很孤独，感觉自己没有被爱，但小时候的我好像确实是被父母爱着的", "source": "微博", "tags": ["被抛", "他人", "身体", "成为自己"]}, {"time": "Sun Sep 07 01:08:34 +0800 2025", "text": "不可否认的是我的心情的确会不受控的受到别人的影响 希望我可以改善🥹", "source": "微博", "tags": ["他人", "自由", "身体"]}, {"time": "Mon Aug 18 19:05:45 +0800 2025", "text": "俺不中了心选姐你怎么可以做到这么萌", "source": "微博", "tags": ["他人", "自由"]}, {"time": "Wed Jul 30 18:11:00 +0800 2025", "text": "我不断在重新审视这段关系", "source": "微博", "tags": ["他人"]}, {"time": "Tue Jul 29 18:56:39 +0800 2025", "text": "希望可以利用这次机会学会与人告别", "source": "微博", "tags": ["他人", "自由"]}, {"time": "Sat Jul 26 00:59:18 +0800 2025", "text": "虽然经常梦见你 还是毫无头绪～", "source": "微博", "tags": ["他人"]}, {"time": "Fri Jul 25 07:45:22 +0800 2025", "text": "怎么会梦到你", "source": "微博", "tags": ["他人"]}, {"time": "Thu Jul 24 23:36:58 +0800 2025", "text": "不喜欢高高在上的人", "source": "微博", "tags": ["他人"]}, {"time": "Wed Jul 16 20:35:38 +0800 2025", "text": "我其实恨我自己变成了这样", "source": "微博", "tags": ["他人", "成为自己"]}, {"time": "Wed Jul 16 20:35:26 +0800 2025", "text": "我恨我自己居然已经开始畏惧表达，畏惧沟通", "source": "微博", "tags": ["他人", "表达与语言", "成为自己"]}, {"time": "Wed Jul 16 20:34:28 +0800 2025", "text": "我恨我自己终日郁郁寡欢", "source": "微博", "tags": ["他人", "成为自己"]}, {"time": "Wed Jul 16 20:33:00 +0800 2025", "text": "我恨我自己逃避思考", "source": "微博", "tags": ["他人", "成为自己"]}, {"time": "Wed Jul 16 20:32:38 +0800 2025", "text": "我恨我自己不能接受现状 哎 我恨", "source": "微博", "tags": ["他人", "荒谬与反抗", "成为自己"]}, {"time": "Wed Jul 16 20:30:52 +0800 2025", "text": "其实我也恨我自己逃避，恨我自己讨厌妈妈，恨我自己不想说话。", "source": "微博", "tags": ["他人", "表达与语言", "成为自己"]}, {"time": "Wed Jul 16 20:27:43 +0800 2025", "text": "我恨我自己口无遮拦，我恨我总是晚一步才想开口解释，恨我自己畏畏缩缩，恨我自己敏感脆弱脆弱，恨我自己不能接受自己。", "source": "微博", "tags": ["他人", "荒谬与反抗", "成为自己"]}, {"time": "Wed Jul 16 20:25:23 +0800 2025", "text": "如果沟通就要受骂我到底为什么不能逃避", "source": "微博", "tags": ["被抛", "表达与语言"]}, {"time": "Wed Jul 16 20:24:47 +0800 2025", "text": "吵架，说话就吵架。沟通就吵架。只要我表达自己的想法就吵架。为什么要说话，你们不是只要我服从吗。你们不累吗，爸爸妈妈。", "source": "微博", "tags": ["被抛", "畏", "他人", "表达与语言", "成为自己"]}, {"time": "Wed Jul 16 20:23:05 +0800 2025", "text": "为什么一定要逼我说话。到底要干什么。", "source": "微博", "tags": ["被抛", "表达与语言"]}, {"time": "Wed Jul 16 20:22:05 +0800 2025", "text": "唉 我累了", "source": "微博", "tags": ["畏"]}, {"time": "Wed Jul 16 20:21:14 +0800 2025", "text": "唉 我烦我自己", "source": "微博", "tags": ["成为自己"]}, {"time": "Mon Jul 14 00:15:18 +0800 2025", "text": "不知道你会不会来看我的小号 其实是这样的 我认为有好感在我这里并不必然等同于喜欢 它更倾向于我感觉你是一个很有趣的人 所以我想要了解你 我想要跟你做朋友 所以不要", "source": "微博", "tags": ["他人", "自由", "身体"]}, {"time": "Fri Jul 11 14:06:19 +0800 2025", "text": "我惹你了？", "source": "微博", "tags": ["他人"]}, {"time": "Thu Jul 10 13:36:21 +0800 2025", "text": "人生这本书要靠自己来读", "source": "微博", "tags": ["他人", "身体与活着", "成为自己"]}, {"time": "Thu Jul 10 13:29:44 +0800 2025", "text": "人类复杂的，多变的，矛盾的情感是最让人着迷的。", "source": "微博", "tags": ["他人"]}, {"time": "Mon Jul 07 02:41:43 +0800 2025", "text": "本以为过去的事情已经过去，但没想到居然也潜移默化对我造成了影响。最近一直感觉自己处于一个很矛盾的状态，做的事情好像又是自己心里不想让自己做的。今天终于思考出来了一个结果，原来是我怕了，也许是因为恐惧所以才会想要逃避，所以才会做出这一连串我自己都不能理解的事情。因为害怕对方不接话索性不发，因为害怕对方对我的负面情绪毫无反应所以也选择闭嘴。无论是对有好感的女生还是对朋友我似乎都有这样的想法。\n就这样吧，反正我也很难改变，感觉直面这个问题反而会让我变得更加别扭。", "source": "微博", "tags": ["日记", "畏", "他人", "自由", "荒谬与反抗", "向死而生", "身体", "成为自己"]}, {"time": "Mon Jul 07 02:34:38 +0800 2025", "text": "我要上进我要上进我要", "source": "微博", "tags": ["自由"]}, {"time": "Mon Jul 07 00:52:31 +0800 2025", "text": "我已经麻了", "source": "微博", "tags": ["畏"]}, {"time": "Sun Jul 06 22:36:31 +0800 2025", "text": "唉我去全世界毁灭吧", "source": "微博", "tags": ["被抛", "身体与活着"]}, {"time": "Thu Jul 03 02:33:33 +0800 2025", "text": "愿我能够一直有勇气", "source": "微博", "tags": ["自由"]}, {"time": "Wed Jun 18 00:36:01 +0800 2025", "text": "最近一直都在输出自己的观点以及和朋友聊天 很开心", "source": "微博", "tags": ["他人", "表达与语言", "成为自己"]}, {"time": "Mon Jun 16 13:20:48 +0800 2025", "text": "相遇和离开都是缘分", "source": "微博", "tags": ["他人"]}, {"time": "Sat Jun 14 11:09:09 +0800 2025", "text": "每天的情绪都像是地狱 原来跟期末周根本没关系", "source": "微博", "tags": ["他人", "身体"]}, {"time": "Sat Jun 14 09:34:04 +0800 2025", "text": "妈妈 感受是上天给我最好的礼物 不应该被忽略", "source": "微博", "tags": ["被抛", "他人"]}, {"time": "Sat Jun 14 01:25:41 +0800 2025", "text": "为什么早上看一部电影能难过到现在", "source": "微博", "tags": ["被抛", "畏", "荒谬与反抗"]}, {"time": "Fri Jun 13 22:04:09 +0800 2025", "text": "怎么会有人可以有这么幸福的家庭环境 好羡慕 感觉跟我底子里完完全全是两种人 我要跑路我要跑路", "source": "微博", "tags": ["他人", "自由", "身体"]}, {"time": "Fri Jun 13 13:48:03 +0800 2025", "text": "我也应该尊重雪糕，把雪糕视为一只独立的猫来看待，而不是我的猫", "source": "微博", "tags": ["他人"]}, {"time": "Fri Jun 13 01:34:25 +0800 2025", "text": "思考以及摄取知识真的是能让人走出不好情绪的好方法，与朋友聊一晚上自己喜欢的内容仿佛阳光下在公园散步。看了候麦的电影发现，人类的复杂的情绪以及人和人之间复杂的关系真的很有意思。", "source": "微博", "tags": ["他人", "身体", "身体与活着", "成为自己"]}, {"time": "Thu Jun 12 00:34:41 +0800 2025", "text": "谁能与我共鸣", "source": "微博", "tags": ["他人"]}, {"time": "Wed Jun 11 18:03:49 +0800 2025", "text": "在意义这个词汇被创造出来之后，因为各种原因【比如资本主义需要（例如秋天的第一杯奶茶）】导致我们对意义的需求越来越强烈，我们越来越频繁的去寻找每件事物的意义，以致于都要开始思考人生的意义，但我觉得这其实只是作茧自缚。意义只是事物的一个与其他属性无异的属性，所以我们在想不到有什么意义的时候完全不必如此的执着的去找寻意义。", "source": "微博", "tags": ["被抛", "他人", "无意义与意义", "身体与活着"]}, {"time": "Wed Jun 11 10:30:07 +0800 2025", "text": "太有用了这个", "source": "微博", "tags": ["杂多"]}, {"time": "Wed Jun 11 01:44:45 +0800 2025", "text": "今天居然会下意识的想要把他人批判成形式主义，还好忍住了，为自己的武断道歉。", "source": "微博", "tags": ["他人", "成为自己"]}, {"time": "Wed Jun 11 01:42:37 +0800 2025", "text": "表达确实会让自己的想法变得比较局限 所以还是要谨慎地表达", "source": "微博", "tags": ["表达与语言", "成为自己"]}, {"time": "Wed Jun 11 01:28:30 +0800 2025", "text": "我应当规训一下自己了，我不应该随意对他人的行为进行不好的评价的。", "source": "微博", "tags": ["他人", "成为自己"]}, {"time": "Mon Jun 09 08:06:24 +0800 2025", "text": "人类是攀附在自己创造的意义之网上的动物，意义既然是人类自己所创造的，就应该为自己所用哇。再需要的时候赋予一些事物意义，而在不需要的时候就根本不必执着于去找寻一个意义。不要被词汇局限了自己的思维，将意义这个词和人生绑定。没有意义并不是一件可怕的事情，在意义这个词汇创造出来之前大家也不一定会如此执着的去找寻意义吧。", "source": "微博", "tags": ["被抛", "他人", "无意义与意义", "身体与活着", "成为自己"]}, {"time": "Mon Jun 09 00:54:35 +0800 2025", "text": "语言是有局限性的 但思想并没有 那么在我把所想的东西外化成语言的过程中也是赋予了思想一种局限性呢", "source": "微博", "tags": ["表达与语言"]}, {"time": "Sun Jun 08 14:25:57 +0800 2025", "text": "责备他人犹如身陷流沙，绝非疗愈女性的良方。常怀责备之心可能会使人作茧自缚，沉溺于受害者的角色，无法自我负责。", "source": "微博", "tags": ["被抛", "他人", "女人与他者", "成为自己"]}, {"time": "Sun Jun 08 13:26:47 +0800 2025", "text": "越读人类学越觉得人类学能够发展成如此地步真的是一部史诗级的科幻小说", "source": "微博", "tags": ["他人", "自由", "表达与语言"]}, {"time": "Sun Jun 08 13:10:27 +0800 2025", "text": "它们没有普遍性的意义；它们“有意义”是因为它们出现在特定的文化和历史背景下，而在这特定的背景下，与它们相关的意义对于生活在其中的人们来说是不言自明的。", "source": "微博", "tags": ["他人", "无意义与意义", "表达与语言", "身体与活着"]}, {"time": "Sun Jun 08 12:17:09 +0800 2025", "text": "真的想要发表言论的时候就去看书", "source": "微博", "tags": ["表达与语言"]}, {"time": "Sun Jun 08 12:04:56 +0800 2025", "text": "我将把做沉默的大多数刻烟吸肺", "source": "微博", "tags": ["表达与语言"]}, {"time": "Sat Jun 07 23:14:57 +0800 2025", "text": "百感交集 听到了有好感的女生说的很难过的故事 不知道到底是因为故事难过还是感觉没可能了难过 什么时候能走出这种容易泄气的状态 什么时候才能不做一个矛盾的人", "source": "微博", "tags": ["畏", "他人", "荒谬与反抗", "身体", "表达与语言"]}, {"time": "Sat Jun 07 23:00:44 +0800 2025", "text": "一定要文笔好才能表达自己的想法吗，文化没有高低贵贱，也没有对错，想法也应当是这样的。就算看起来俗气，但只要是经过自己的思考表达的东西就值得被人认可。（但这跟理不理解是另一回事）我是这么认为的，至少现在是。 喜欢敢于表达自己思想的人。", "source": "微博", "tags": ["被抛", "他人", "表达与语言", "成为自己"]}, {"time": "Sat Jun 07 03:16:41 +0800 2025", "text": "走出了一段痛苦的时段，期末考试的成绩是怎么样我也已经懒得去想。希望以后可以越来越开心吧", "source": "微博", "tags": ["自由", "荒谬与反抗", "自由与束缚"]}, {"time": "Fri Jun 06 02:28:39 +0800 2025", "text": "我真的有资格对他人做出评价吗？", "source": "微博", "tags": ["他人"]}, {"time": "Fri May 30 14:31:12 +0800 2025", "text": "人类一思考，痛苦就开始萌芽。", "source": "微博", "tags": ["他人", "荒谬与反抗"]}, {"time": "Fri May 30 11:27:25 +0800 2025", "text": "In choosing myself, I choose man?", "source": "微博", "tags": ["杂多"]}, {"time": "Sat May 17 12:47:21 +0800 2025", "text": "时常感觉自己不像活着", "source": "微博", "tags": ["身体", "身体与活着", "成为自己"]}, {"time": "Mon May 05 21:01:44 +0800 2025", "text": "只有聊天我才真正存在", "source": "微博", "tags": ["自由", "表达与语言"]}, {"time": "Tue Apr 01 14:49:27 +0800 2025", "te  ["畏"]}, {"time": "Thu Jul 30 02:29:24 +0800 2020", "text": "我可以的我可以的我可以的 我一定可以的可以的 要天天开心！", "source": "微博", "tags": ["自由"]}, {"time": "Thu Jul 30 02:28:25 +0800 2020", "text": "不快乐 很难过", "source": "微博", "tags": ["畏", "荒谬与反抗"]}, {"time": "Wed Jul 15 01:15:06 +0800 2020", "text": "今天真的好烦", "source": "微博", "tags": ["杂多"]}, {"time": "Thu Jun 25 01:12:44 +0800 2020", "text": "我拍照为什么那么难看啊", "source": "微博", "tags": ["被抛", "荒谬与反抗"]}, {"time": "Thu Jun 25 01:05:40 +0800 2020", "text": "我的脾气 为什么 越来越差了啊", "source": "微博", "tags": ["被抛"]}, {"time": "Thu Jun 25 01:04:57 +0800 2020", "text": "找不到 发泄的方式", "source": "微博", "tags": ["杂多"]}, {"time": "Thu Jun 25 01:03:38 +0800 2020", "text": "我真的真的真的真的要烦爆了 为什么那么傻逼啊", "source": "微博", "tags": ["被抛"]}, {"time": "Thu Jun 25 01:03:17 +0800 2020", "text": "不知道不知道不知道要跟谁说 我好烦啊", "source": "微博", "tags": ["表达与语言"]}, {"time": "Thu Jun 25 01:03:03 +0800 2020", "text": "我真的觉得自己每天要干好多好多事 学不下去看 我是个废物吧", "source": "微博", "tags": ["成为自己"]}, {"time": "Thu Jun 25 01:02:45 +0800 2020", "text": "反复的看和学姐的聊天记录 反复的烦 学习也好难 聊天也好难 什么都好难", "source": "微博", "tags": ["荒谬与反抗", "表达与语言", "自由与束缚"]}, {"time": "Wed May 20 22:49:24 +0800 2020", "text": "好想有個人能讓我說說我有多煩", "source": "微博", "tags": ["他人"]}, {"time": "Wed May 20 22:48:46 +0800 2020", "text": "從下午白一鶴招惹我我就煩到了現在 我覺得c真他媽就是在玩我吧 無語了 朋友是這樣的。？", "source": "微博", "tags": ["他人"]}, {"time": "Wed May 20 22:47:34 +0800 2020", "text": "我要煩爆了 也沒有人說 我真的吐了 為什麼會在生日的晚上那麼慘 我不想吃藥 也不想煩", "source": "微博", "tags": ["他人", "自由"]}, {"time": "Wed May 20 22:46:44 +0800 2020", "text": "我真的好煩啊", "source": "微博", "tags": ["杂多"]}, {"time": "Sun May 10 23:19:06 +0800 2020", "text": "明天要开学了 希望可以遇到学姐 一定要 努努力...", "source": "微博", "tags": ["自由", "向死而生"]}, {"time": "Mon Mar 09 17:03:05 +0800 2020", "text": "喔 烦透了 不知道能跟谁说", "source": "微博", "tags": ["表达与语言"]}, {"time": "Fri Mar 06 20:33:56 +0800 2020", "text": "疾病真的是很好的借口。 因为患抑郁症，可以「坦然」地说：并不是我不够好，是疾病害了我。不是我不想上进，是疾病使我做不到。 我跟所有人说，重度患者的每一天都可能是最后一天，所以我活得好赖都无所谓。 直到有人问我：要在最后一天也做个垃圾吗？ 我不甘心。", "source": "微博", "tags": ["他人", "自由", "身体", "表达与语言"]}, {"time": "Fri Mar 06 02:11:29 +0800 2020", "text": "想要约学姐拍照", "source": "微博", "tags": ["杂多"]}, {"time": "Fri Mar 06 02:11:10 +0800 2020", "text": "想要和学姐考上同一所大学", "source": "微博", "tags": ["杂多"]}, {"time": "Sat Nov 16 08:14:17 +0800 2019", "text": "很烦 什么事也做不好 我想死了", "source": "微博", "tags": ["自由", "向死而生"]}, {"time": "Sun Sep 08 22:15:59 +0800 2019", "text": "多亲密的人也不能说", "source": "微博", "tags": ["他人", "表达与语言"]}, {"time": "Sun Sep 08 22:14:15 +0800 2019", "text": "没有人会愿意听你的负情绪 要把什么事憋在心里 像以前那样 要记牢", "source": "微博", "tags": ["他人", "身体"]}, {"time": "Sun Sep 08 22:10:37 +0800 2019", "text": "不开心的事还是放在心里最好 以后不要跟别人说自己的烦心事了 要记牢", "source": "微博", "tags": ["他人", "身体", "表达与语言", "成为自己"]}, {"time": "Mon Sep 02 23:17:14 +0800 2019", "text": "生活什么时候才能把我弄死", "source": "微博", "tags": ["向死而生", "身体与活着"]}, {"time": "Mon Sep 02 23:16:39 +0800 2019", "text": "什么时候开心才能来找我", "source": "微博", "tags": ["杂多"]}, {"time": "Mon Sep 02 22:54:06 +0800 2019", "text": "为什么说话这么难听 真的很让人生气", "source": "微博", "tags": ["被抛", "他人", "荒谬与反抗", "表达与语言", "身体与活着"]}, {"time": "Mon Sep 02 22:53:51 +0800 2019", "text": "好累 父母总是把自己的想法强加在孩子身上 真的是很可怕的控制欲 他们根本不会想孩子委不委屈", "source": "微博", "tags": ["畏", "他人", "成为自己"]}, {"time": "Fri Aug 30 19:13:50 +0800 2019", "text": "不想跟没有礼貌的人做朋友 嗯嗯", "source": "微博", "tags": ["他人"]}, {"time": "Fri Aug 30 16:44:48 +0800 2019", "text": "新的学期希望能好好学习", "source": "微博", "tags": ["自由与束缚"]}, {"time": "Fri Aug 30 16:43:16 +0800 2019", "text": "最近越来越容易生气了 脾气越来越暴.. 很烦 我有时候也不想生气 滑板也没有心情滑了 为什么总是半途而废 我真的不喜欢我自己 我真的变了很多 希望脾气以后能变好一点 每天都能开心一点 我一点也不想不开心", "source": "微博", "tags": ["被抛", "他人", "身体", "成为自己"]}, {"time": "Fri Aug 30 16:40:57 +0800 2019", "text": "我想考个导游证", "source": "微博", "tags": ["自由"]}, {"time": "Sun Aug 25 03:29:39 +0800 2019", "text": "我真的真的要坚持不住啦 谁能救救我 我好难", "source": "微博", "tags": ["荒谬与反抗"]}, {"time": "Sun Aug 25 03:29:11 +0800 2019", "text": "我很难过 很不好受", "source": "微博", "tags": ["畏", "荒谬与反抗"]}, {"time": "Sun Jul 07 21:43:12 +0800 2019", "text": "我的确是一个喜欢逃避的人", "source": "微博", "tags": ["他人"]}, {"time": "Sun Jul 07 21:42:56 +0800 2019", "text": "感觉很不舒服 我不想学习了", "source": "微博", "tags": ["身体", "自由与束缚"]}, {"time": "Sun Jul 07 21:42:35 +0800 2019", "text": "期末的成绩发了 选的那三科都考得很不理想 地理复习的时候感觉根本无从下手 生物我也不知道为什么会考的这么差...我本来以为应该挺好的...我不知道到底该选哪科了 最近滑板摔了很多次 招也练不好 很烦", "source": "微博", "tags": ["被抛", "身体"]}, {"time": "Sun Jul 07 21:39:09 +0800 2019", "text": "我也想要开心", "source": "微博", "tags": ["杂多"]}, {"time": "Wed Jul 03 01:19:15 +0800 2019", "text": "昨天白加我来骂我了 挺无语的 真的对她很失望 跟她掰是真的有点难过 毕竟也是两年的朋友了 无语了。", "source": "微博", "tags": ["畏", "他人", "荒谬与反抗", "向死而生"]}, {"time": "Wed Jul 03 01:16:17 +0800 2019", "text": "现在是二零一九年七月三号的一点零一分 我觉得我明天可能考不好了 后天也是 我不该在一开始就对自己报那么大的期望的 我本来就不是一个聪明的小孩\n我不想转去新学校 不想交新的朋友了 我应该交不到了 如果真的要去一个新学校 希望不会遇到初中的同学 其实有时候一个人挺好的\n我最近似乎做什么都不如意 很遗憾辜负了爸妈以及忙里抽空为我补课的老师的期望 没有考好物理 没能考上重点班\n不知道是什么原因 记忆力越来越差了 很多东西都记不住 可能是因为熬夜吧 可是就是克制不住自己 无语了 我快要什么东西都记不住了\n我忘记我刚才想写什么了...\n希望以后这些话我能对别人说 而不是自己一个人在这逼逼也不知道逼些啥", "source": "微博", "tags": ["日记", "他人", "向死而生", "表达与语言", "自由与束缚", "成为自己"]}, {"time": "", "text": "", "source": "俳句", "tags": ["俳句"]}, {"time": "今天凌晨", "text": "哲学的东西 感觉拿出来跟人大张旗鼓地讨论就没什么意思了", "source": "豆瓣", "tags": ["他人", "身体"]}, {"time": "昨天", "text": "When we talk about ielts…what we talk about…", "source": "豆瓣", "tags": ["杂多"]}, {"time": "10月24日", "text": "大家都是孩子", "source": "豆瓣", "tags": ["他人"]}, {"time": "10月23日", "text": "cos i need you more than you need me！", "source": "豆瓣", "tags": ["杂多"]}, {"time": "10月22日", "text": "不想学雅思", "source": "豆瓣", "tags": ["杂多"]}, {"time": "10月21日", "text": "世界都变通透了", "source": "豆瓣", "tags": ["被抛", "身体与活着"]}, {"time": "10月21日", "text": "I thought of Miss Stein and Sherwood Anderson and egotism and mental laziness versus discipline and I thought who is calling who a lost generation?", "source": "豆瓣", "tags": ["杂多"]}, {"time": "2025年12月4日", "text": "sylvan 说：\n            \n            \n              嘴巴并不是表达人类感情的唯一工具\n            \n            \n            最近因为s的事情郁郁寡欢，但也正因为如此看到了身边朋友的好。\nlzr在我发一些负面情绪的时候通常不会说什么，我很能理解，但我时不时还是会觉得有点难过，这无可避免呀。不过她会在出去玩的时候给我买手链，给我买纪念品，我觉得好感动。\nx也会在我不开心的时候坐在我身边，听我叨叨絮絮的说一些...（全文）", "source": "豆瓣", "tags": ["日记", "畏", "他人", "荒谬与反抗", "身体", "表达与语言"]}, {"time": "10月21日", "text": "生活蹂躏我可是我是一只狸猫我只会喊救命", "source": "豆瓣", "tags": ["他人", "身体与活着"]}, {"time": "10月20日", "text": "看得越多做的越少", "source": "豆瓣", "tags": ["杂多"]}, {"time": "10月20日", "text": "我不知道我不知道我不知道", "source": "豆瓣", "tags": ["杂多"]}, {"time": "10月20日", "text": "要如何在心里创造一个世界", "source": "豆瓣", "tags": ["被抛", "身体", "身体与活着"]}, {"time": "10月20日", "text": "忐忑不安的星球\n四季无序的轮换\n未来模糊不定\n想法混乱不堪\n唯有抓住表达，学会承受", "source": "豆瓣", "tags": ["畏", "荒谬与反抗", "向死而生", "表达与语言"]}, {"time": "10月20日", "text": "要如何才能拥有一种对生活的狂热但又能够平淡的坦然的生活？", "source": "豆瓣", "tags": ["自由", "身体与活着"]}, {"time": "10月20日", "text": "不应当成为一个毫无根据的空想家，应该通过不断地阅读，实践和观看让自己的思想落到实处。", "source": "豆瓣", "tags": ["他人", "表达与语言", "成为自己"]}, {"time": "10月20日", "text": "学会爱人的第一步是不是接受对方不爱自己", "source": "豆瓣", "tags": ["他人", "荒谬与反抗", "成为自己"]}, {"time": "10月20日", "text": "拥抱是人类最最伟大的语言", "source": "豆瓣", "tags": ["他人", "表达与语言"]}, {"time": "10月19日", "text": "你必须在废墟中一次又一次的重建你的人生", "source": "豆瓣", "tags": ["他人", "身体与活着"]}, {"time": "10月19日", "text": "爱不是了解爱 不是描述爱 爱是学会爱是决定爱", "source": "豆瓣", "tags": ["他人"]}, {"time": "10月19日", "text": "走一步又摔一步～～\n      \n      \n        \n          无数次漫长的等待\n反复的难捱\n无数次看朦胧的未来\n虚妄的明天\n我永远无法真正的只有现在\n总是感到失望\n对自己或是对其他\n悲哀的心情总是周而复始\n责怪自己的坏习惯还是改不了\n想要做的事情\n真的有完成的那天吗\n这么多伟大的梦想\n真的可以实现吗\n问题还有很多很多\n可是生活还是在一步一步向前走", "source": "豆瓣", "tags": ["被抛", "他人", "自由", "荒谬与反抗", "向死而生", "身体", "身体与活着", "成为自己"]}, {"time": "10月19日", "text": "10.19\n      \n      \n        \n          思绪是一团混乱的毛线，我每天都在里面穿梭又穿梭", "source": "豆瓣", "tags": ["日记"]}, {"time": "10月18日", "text": "怎能停滞不前？", "source": "豆瓣", "tags": ["杂多"]}, {"time": "10月13日", "text": "彩色的毛线团里\n我流向你", "source": "豆瓣", "tags": ["他人"]}, {"time": "10月13日", "text": "世界是混沌的团\n我是流向的河\n将永远死在明天", "source": "豆瓣", "tags": ["被抛", "向死而生", "身体与活着"]}, {"time": "10月13日", "text": "不变的氧气\n扬起的灰尘停滞在半空\n狭窄的河道霎时变得宽了\n更大的石块被天空降下\n马寂寥从耳朵飞出\n外头是沉重的黑暗、掠过千万只飞蝗\n不再有树叶飘落\n时间却在此绵延不绝", "source": "豆瓣", "tags": ["被抛", "向死而生"]}, {"time": "10月11日", "text": "康德你把我害惨了", "source": "豆瓣", "tags": ["他人"]}, {"time": "10月10日", "text": "如果完美的爱应当是感性的，不能被理性入侵的。\n两人相爱，产生链接，必定要将爱说出口。因为你不可能想象两个人在没说过我爱你那句话之后就在一起。但语言就是一个理性的载体。\n那这爱若是切实存在的而非形而上的，它在被说出口的那一刻就已经开始走向破灭了。", "source": "豆瓣", "tags": ["被抛", "他人", "自由", "表达与语言"]}, {"time": "10月10日", "text": "文学为这个不确定的，偶然的世界提供了某种确定性。我想这或许就是我爱看的原因", "source": "豆瓣", "tags": ["被抛", "他人", "自由", "身体与活着"]}, {"time": "10月10日", "text": "网络发展是否导致现时代个人特质被放的有点太大了", "source": "豆瓣", "tags": ["被抛", "他人"]}, {"time": "10月10日", "text": "顽强的生命力是创世神给人类降下的诅咒", "source": "豆瓣", "tags": ["他人", "向死而生"]}, {"time": "10月10日", "text": "嘴里念叨着存在主义的那些话", "source": "豆瓣", "tags": ["自由"]}, {"time": "10月9日", "text": "如果阅读纯粹理性批判需要的是足够的理性的话，那就得需要足够的理性才能够摒弃僭越的理性？这也太荒唐了。", "source": "豆瓣", "tags": ["自由", "表达与语言"]}, {"time": "10月9日", "text": "全世界都在沉默", "source": "豆瓣", "tags": ["被抛", "表达与语言", "身体与活着"]}, {"time": "10月9日", "text": "趁时间没发觉让我带着你离开", "source": "豆瓣", "tags": ["他人", "向死而生"]}, {"time": "10月8日", "text": "怎么读都还不够", "source": "豆瓣", "tags": ["杂多"]}, {"time": "10月8日", "text": "地球如此难以忍受 那我们排队去看世界末日吧!", "source": "豆瓣", "tags": ["被抛", "荒谬与反抗", "身体与活着"]}, {"time": "10月8日", "text": "全年代日本动画Top500口碑排行榜\n        \n        \n            539部作品\n            ·\n            24873人关注\n        \n        【转载自B站feadk】请有B站账号的朋友去原贴点赞投币收藏  http://...", "source": "豆瓣", "tags": ["他人"]}, {"time": "10月8日", "text": "“大人”只是理念 “成长”才是可以切实做到的", "source": "豆瓣", "tags": ["他人", "自由"]}, {"time": "10月7日", "text": "如果只是一直使用而不思考和创造，则永远不可能成为创造者。这是一个be or not be的问题。而创造，什么时候开始都不算晚。", "source": "豆瓣", "tags": ["荒谬与反抗", "向死而生"]}, {"time": "10月7日", "text": "读懂小说作品是否应当感受先行，分析在后？\n      \n      \n        \n            当我说我想要看懂一个作家写的故事，我是在说想要看懂她的什么？\n  这有点类似于我想要看懂她想表达的东西。其中含括她想讲述的故事，故事中所包含的她的精神和思想。（若是有）\n  1.首先我想在这里先做出一个分野，即先讨论是否每一个故事都含括一个所谓来自作者的，并“可被获取”思想。\n  ...（全文）", "source": "豆瓣", "tags": ["日记", "被抛", "他人", "自由", "表达与语言"]}, {"time": "10月5日", "text": "认 长久之计", "source": "豆瓣", "tags": ["杂多"]}, {"time": "9月16日", "text": "每日生活无期待 类浑浑噩噩", "source": "豆瓣", "tags": ["荒谬与反抗", "身体与活着"]}, {"time": "9月16日", "text": "去年秋天我怎么也在搞这些", "source": "豆瓣", "tags": ["向死而生"]}, {"time": "9月14日", "text": "为什么会这样", "source": "豆瓣", "tags": ["被抛"]}, {"time": "8月30日", "text": "发乎情止乎礼", "source": "豆瓣", "tags": ["杂多"]}, {"time": "8月26日", "text": "做了噩梦\n奶奶为了想要保留体面的去世想要出走 在我临走前一直想她一直想邀请我吃个饭 我却一直没同意 网卡没听到 也一直没同意\n醒来才在奶奶的红包里发现奶奶写的遗书\n梦里我一直在哭醒来也泪流满面了", "source": "豆瓣", "tags": ["畏", "他人", "身体", "表达与语言"]}, {"time": "8月22日", "text": "我不理解到底是有什么毛病", "source": "豆瓣", "tags": ["他人"]}, {"time": "8月10日", "text": "我想我还是不说话了", "source": "豆瓣", "tags": ["自由", "表达与语言"]}, {"time": "8月20日", "text": "第79届戛纳电影节获奖名单\n            \n            \n                27部作品\n                ·\n              1710人关注", "source": "豆瓣", "tags": ["他人"]}, {"time": "8月18日", "text": "他人即地狱", "source": "豆瓣", "tags": ["他人"]}, {"time": "8月4日", "text": "怎样才能做到了无遗憾", "source": "豆瓣", "tags": ["自由"]}, {"time": "7月31日", "text": "情绪失控如同一台坏掉的机器", "source": "豆瓣", "tags": ["身体"]}, {"time": "7月28日", "text": "BBC评选21世纪100部佳片\n            \n            \n                99部作品\n                ·\n              62658人关注", "source": "豆瓣", "tags": ["他人"]}, {"time": "7月27日", "text": "女吊 (2026)\n              \n              \n      \n      吴越丧葬民俗双人恐怖游戏《女吊》概念PV首曝\n\n以双人合作解谜为核心玩法的民俗...\n      \n        \n            类别：游戏 / 冒险\n            平台：PC", "source": "豆瓣", "tags": ["他人"]}, {"time": "7月23日", "text": "我的痛苦到底源自何处", "source": "豆瓣", "tags": ["荒谬与反抗"]}, {"time": "7月23日", "text": "完全无法控制自己的想法和自己的行为", "source": "豆瓣", "tags": ["被抛", "成为自己"]}, {"time": "7月21日", "text": "但是是为什么", "source": "豆瓣", "tags": ["被抛"]}, {"time": "7月20日", "text": "时间不会永远停在哪一天、永远会有新的一天", "source": "豆瓣", "tags": ["向死而生"]}, {"time": "7月20日", "text": "沉溺于过去没有用", "source": "豆瓣", "tags": ["向死而生"]}, {"time": "7月13日", "text": "做梦梦到想要留着做晚餐的巧克力馅小面包放在冰箱里找不到了 妈妈一脸严肃的说被她丢了，味道太大了 连说了两次。然后我就哭了 但其实后来找到了巧克力馅的小面包，妈妈丢的是另一个面包，但我还是哭了 不知道这是怎么了", "source": "豆瓣", "tags": ["被抛", "畏", "他人", "身体", "表达与语言"]}, {"time": "7月11日", "text": "滚吧别害我了", "source": "豆瓣", "tags": ["杂多"]}, {"time": "7月10日", "text": "也许我以后会想明白", "source": "豆瓣", "tags": ["杂多"]}, {"time": "7月9日", "text": "接下来的三天会很难熬 加油陈思颖", "source": "豆瓣", "tags": ["荒谬与反抗"]}, {"time": "7月9日", "text": "无数次我都觉得自己要完蛋了 但其实生活没有那么容易就完蛋", "source": "豆瓣", "tags": ["身体与活着", "成为自己"]}, {"time": "7月8日", "text": "为什么这么难接受", "source": "豆瓣", "tags": ["被抛", "荒谬与反抗"]}, {"time": "7月7日", "text": "我不接受很多事情，但我不接受不能够改变任何事情", "source": "豆瓣", "tags": ["自由", "荒谬与反抗"]}, {"time": "7月7日", "text": "人怎么样才算是在活着 人很容易活着 但我想问的是 要怎么样人才算是真正的在活着？\n有时候我觉得我仅仅是在维持我的呼吸，因为没有多余的脑子去思考如何改变生活，便一直按照一条看似有规律的行动路径来捱过一些时日。\n我有时候不知道怎样才算是在思考，按理说，人的逻辑系统是一直在运转着的。但...（全文）", "source": "豆瓣", "tags": ["他人", "自由", "表达与语言", "身体与活着"]}, {"time": "7月6日", "text": "离开那段回忆越远 就越经常幻想出一些与她相隔甚远的事情", "source": "豆瓣", "tags": ["他人"]}, {"time": "7月5日", "text": "一个多月过去了 情绪还是反反复复 逃避的行为越来越严重以及离谱，完全无法控制。\n各种方法都试过了，都是徒劳。我不知道该怎么做，也许是我太不了解自己", "source": "豆瓣", "tags": ["被抛", "向死而生", "身体", "成为自己"]}, {"time": "7月4日", "text": "世界上能不能有个人放过我", "source": "豆瓣", "tags": ["被抛", "他人", "身体与活着"]}, {"time": "7月2日", "text": "是不能还是我不愿意", "source": "豆瓣", "tags": ["杂多"]}, {"time": "6月29日", "text": "每个人都有自己的故事\n        \n        \n            232部作品\n            ·\n            435人关注", "source": "豆瓣", "tags": ["他人", "成为自己"]}, {"time": "6月28日", "text": "以后的乐观到底要怎样去承担？", "source": "豆瓣", "tags": ["杂多"]}, {"time": "6月28日", "text": "就感受到的事物进行思考，以及对未知提出疑问。人类能做到的仅此而已", "source": "豆瓣", "tags": ["他人", "自由"]}, {"time": "6月25日", "text": "我罪不可赦么", "source": "豆瓣", "tags": ["杂多"]}, {"time": "6月19日", "text": "人生就是如此了", "source": "豆瓣", "tags": ["他人", "身体与活着"]}, {"time": "6月16日", "text": "即不要用理论去替我们承载无意义的重量，我们需要用勇气去反抗荒谬。", "source": "豆瓣", "tags": ["荒谬与反抗", "无意义与意义"]}, {"time": "6月10日", "text": "有些事情确实是无法挽回的", "source": "豆瓣", "tags": ["被抛"]}, {"time": "6月7日", "text": "理解不存在", "source": "豆瓣", "tags": ["他人", "自由"]}, {"time": "6月7日", "text": "「忽然很想看爱情片」\n        \n        \n            174部作品\n            ·\n            356人关注", "source": "豆瓣", "tags": ["他人"]}, {"time": "6月6日", "text": "梦到雪糕失踪 起来时听到房间还有声响还好还好", "source": "豆瓣", "tags": ["他人"]}, {"time": "6月5日", "text": "滨口龙介我去你的", "source": "豆瓣", "tags": ["他人"]}, {"time": "6月5日", "text": "人类就是仅此而已", "source": "豆瓣", "tags": ["他人"]}, {"time": "6月5日", "text": "不会说话就少说话吧", "source": "豆瓣", "tags": ["表达与语言"]}, {"time": "6月4日", "text": "一眼望不到尽头了", "source": "豆瓣", "tags": ["杂多"]}, {"time": "6月4日", "text": "病痛将我拉回现实", "source": "豆瓣", "tags": ["杂多"]}, {"time": "6月4日", "text": "我需要扛住多大的压力？", "source": "豆瓣", "tags": ["畏"]}, {"time": "6月1日", "text": "世界我给你跪下了", "source": "豆瓣", "tags": ["被抛", "他人", "身体与活着"]}, {"time": "5月29日", "text": "你可不可以一直开 只要别停 去哪里都行", "source": "豆瓣", "tags": ["他人", "自由"]}, {"time": "5月28日", "text": "终于可以开始难过", "source": "豆瓣", "tags": ["畏", "自由", "荒谬与反抗"]}, {"time": "5月28日", "text": "但你表达的时候，不要思考", "source": "豆瓣", "tags": ["他人", "表达与语言"]}, {"time": "5月26日", "text": "为什么这么倒霉", "source": "豆瓣", "tags": ["被抛"]}, {"time": "5月24日", "text": "语言竟然这样无力", "source": "豆瓣", "tags": ["表达与语言"]}, {"time": "5月24日", "text": "没有人真正了解我", "source": "豆瓣", "tags": ["他人"]}, {"time": "5月24日", "text": "我在意的都在伤害我", "source": "豆瓣", "tags": ["他人"]}, {"time": "5月23日", "text": "到底要怎样你才甘心 chensi", "source": "豆瓣", "tags": ["他人"]}, {"time": "5月23日", "text": "大家都在帮我可是我还是一直哭", "source": "豆瓣", "tags": ["畏", "他人", "身体"]}, {"time": "5月23日", "text": "怎么我又哭了呢？", "source": "豆瓣", "tags": ["畏", "身体"]}, {"time": "5月22日", "text": "人只要还在与其他人接触，就会被社会所影响。所以    社会风气低迷浮躁，人的性子也会随着改变。我很难断定一个人的行为有多少成分是因社会影响，有多少成分是因为她们本就这样，这些都混在一起了。所以根本不能够根据一个人以前的行为去判断她的现在，人每时每刻都会在改变。时代变化太快了。\n请...（全文）", "source": "豆瓣", "tags": ["被抛", "他人", "自由", "荒谬与反抗", "身体与活着", "成为自己"]}, {"time": "5月21日", "text": "人是可以通过关系被定义的？", "source": "豆瓣", "tags": ["被抛", "他人", "自由"]}, {"time": "5月19日", "text": "叹息又叹息", "source": "豆瓣", "tags": ["杂多"]}, {"time": "5月18日", "text": "我好像一个绝望的文盲", "source": "豆瓣", "tags": ["杂多"]}, {"time": "5月18日", "text": "既然未来还有无尽烦恼  就少一点为现在的烦恼感到苦恼", "source": "豆瓣", "tags": ["向死而生"]}, {"time": "5月17日", "text": "每天晚上都是抱着明天会更好的憧憬入睡，但明天是否会更好其实也不是那么重要。我总要去明天", "source": "豆瓣", "tags": ["向死而生"]}, {"time": "5月17日", "text": "见识到了很多无聊的人 听他们说话感觉人生被浪费", "source": "豆瓣", "tags": ["被抛", "他人", "身体", "表达与语言", "身体与活着"]}, {"time": "5月17日", "text": "我为什么要承受这么多的不愉快", "source": "豆瓣", "tags": ["被抛", "荒谬与反抗"]}, {"time": "5月16日", "text": "这个世界就他妈的应该放过我我说真的", "source": "豆瓣", "tags": ["被抛", "他人", "表达与语言", "身体与活着"]}, {"time": "5月15日", "text": "再跟男人解释女权我惩罚自己吃一盒泡面", "source": "豆瓣", "tags": ["他人", "成为自己"]}, {"time": "5月15日", "text": "陈思颖 不要不要", "source": "豆瓣", "tags": ["杂多"]}, {"time": "5月13日", "text": "总要学会接受", "source": "豆瓣", "tags": ["荒谬与反抗"]}, {"time": "5月12日", "text": "从头到尾 没有人跟我说清楚", "source": "豆瓣", "tags": ["他人", "表达与语言"]}, {"time": "5月11日", "text": "我有时候觉得跟lzr在某些时候是作为一个整体去探索这个世界的", "source": "豆瓣", "tags": ["被抛", "身体与活着"]}, {"time": "5月10日", "text": "妈妈 你一定要表达\n你要跟我争吵", "source": "豆瓣", "tags": ["他人", "表达与语言"]}, {"time": "5月9日", "text": "荒草丛生处有没有松茸在生长？", "source": "豆瓣", "tags": ["杂多"]}, {"time": "5月9日", "text": "做多错多 说多错多", "source": "豆瓣", "tags": ["表达与语言"]}, {"time": "5月8日", "text": "好想酣畅淋漓的悲伤一场", "source": "豆瓣", "tags": ["杂多"]}, {"time": "5月8日", "text": "你看清自己的模样了吗 sylvan", "source": "豆瓣", "tags": ["他人", "成为自己"]}, {"time": "5月8日", "text": "嘈杂的公车\n模糊的街灯\n雨 雨的痕迹 雨的气息\n此处是否仅有一个我？\n四周的声音是否都是有一个共同体所发出？\n世上是否仅有我们两个？\n我们是敌人吗？你在试图与我通话吗;-)\n我们语言不通！\n耳机分给你一只，我们一起去喝酒吧！", "source": "豆瓣", "tags": ["他人", "表达与语言"]}, {"time": "5月8日", "text": "我只能抓住眼前那一步", "source": "豆瓣", "tags": ["杂多"]}, {"time": "5月8日", "text": "陈思颖 你可以觉得自己厉害 但不能觉得自己很厉害！", "source": "豆瓣", "tags": ["他人", "自由", "成为自己"]}, {"time": "5月8日", "text": "你要为自己做 不要为别人做", "source": "豆瓣", "tags": ["他人", "成为自己"]}, {"time": "5月8日", "text": "不要想要得不到的东西", "source": "豆瓣", "tags": ["杂多"]}, {"time": "5月7日", "text": "原来真的有低精力人群", "source": "豆瓣", "tags": ["他人"]}, {"time": "5月6日", "text": "一次不行试两次两次不行就三次 试到我脱敏", "source": "豆瓣", "tags": ["杂多"]}, {"time": "5月6日", "text": "你怎么总这样", "source": "豆瓣", "tags": ["他人"]}, {"time": "5月6日", "text": "陈思颖你到底是谁", "source": "豆瓣", "tags": ["他人"]}, {"time": "5月5日", "text": "Sylvan，你总在幻想另一种日子，\n没有这满地泥泞、平展展铺在阳光下的。\n可是天正下雨，你怎可能不被淋湿。\n不要再用明日的露水来解今日的渴了，Sylvan，\n你不要背过身去。\n你不需要总回头看了\n往日虽不可追，\n但你难道不是已经将她们佩在身上了吗？\n时间永远向前，世间一切也终将循环往复...（全文）", "source": "豆瓣", "tags": ["被抛", "他人", "荒谬与反抗", "向死而生", "身体与活着"]}, {"time": "5月4日", "text": "困难越是重重，你就越不要去期盼另一种生活。否定当下何尝不是对自我存在进行否定？\n  你是存在着的，拿塔纳埃勒，即使是推着石头的西西弗斯，你至少存在着。你不要过分执着回忆想象中的幸福、追求远方的快乐，你要看见现况，你要看见你经历着的苦难。无论如何，至少要先看见，接着你便能够找到出路。", "source": "豆瓣", "tags": ["他人", "自由", "荒谬与反抗", "身体与活着", "成为自己"]}, {"time": "5月3日", "text": "我太急了 所以总是容易做错事 说错话", "source": "豆瓣", "tags": ["荒谬与反抗", "表达与语言"]}, {"time": "5月3日", "text": "要是我的世界仅有我一人，那我便是独一无二。", "source": "豆瓣", "tags": ["被抛", "他人", "身体与活着"]}, {"time": "5月2日", "text": "我同她的思想生长于两套截然不同的体系，从看的书到喜欢的东西都有所不同，自然也会走上两道不同的人生道路。不必执着，应当走好自己的路", "source": "豆瓣", "tags": ["他人", "身体与活着", "成为自己"]}, {"time": "5月2日", "text": "感情并非仅能以文字作为载体", "source": "豆瓣", "tags": ["表达与语言"]}, {"time": "5月2日", "text": "要从杉田老师身上学习执着", "source": "豆瓣", "tags": ["自由与束缚"]}, {"time": "5月2日", "text": "你永远不会理解我了", "source": "豆瓣", "tags": ["他人", "向死而生"]}, {"time": "4月29日", "text": "不知为何难过", "source": "豆瓣", "tags": ["畏", "荒谬与反抗"]}, {"time": "4月29日", "text": "陈思颖 你真的是这样吗？", "source": "豆瓣", "tags": ["他人"]}, {"time": "4月29日", "text": "如何在保持自我的同时跟他人恋爱？\n      \n      \n        \n            我想在被困扰的当下就是思考这个问题的最好时机。需要确定的是我要做的并非是当下尊严放低姿态去迎合对方的需求。而是在理解对方的同时又能够达到自洽。\n  我在情绪价值上应当做到自给自足，不应当过分依赖对方给我些什么。对于任何人也许都要随时保持一种边界感，并非一定需要依赖某一个特定的...（全文）", "source": "豆瓣", "tags": ["被抛", "他人", "自由", "荒谬与反抗", "身体", "无意义与意义", "成为自己"]}, {"time": "4月27日", "text": "有些事情做出来都想扇自己两巴掌", "source": "豆瓣", "tags": ["成为自己"]}, {"time": "4月27日", "text": "全世界都要pua我？我要靠逻辑建立一套稳固不被推倒的价值体系。", "source": "豆瓣", "tags": ["被抛", "自由", "无意义与意义", "身体与活着"]}, {"time": "4月25日", "text": "真的是把我逼急了我啥都干得出来", "source": "豆瓣", "tags": ["杂多"]}, {"time": "4月21日", "text": "女女\n        \n        \n            165部作品\n            ·\n            2205人关注", "source": "豆瓣", "tags": ["他人"]}, {"time": "4月21日", "text": "其实真挺好", "source": "豆瓣", "tags": ["杂多"]}, {"time": "4月15日", "text": "一时间的想法不代表永远的想法", "source": "豆瓣", "tags": ["向死而生"]}, {"time": "4月14日", "text": "我要学会从容…", "source": "豆瓣", "tags": ["自由"]}, {"time": "4月14日", "text": "是否是因为我的生活太平静 所以任何一点波澜我都想要抓住", "source": "豆瓣", "tags": ["身体与活着"]}, {"time": "4月14日", "text": "朋友看完绿皮书之后很郑重其事地在朋友圈发了读后感", "source": "豆瓣", "tags": ["他人"]}, {"time": "4月13日", "text": "真得到我的极限了", "source": "豆瓣", "tags": ["杂多"]}, {"time": "4月12日", "text": "我想我就做得到", "source": "豆瓣", "tags": ["自由"]}, {"time": "4月12日", "text": "晚上看不进书 可以听课", "source": "豆瓣", "tags": ["自由"]}, {"time": "4月12日", "text": "事情太多 思绪混乱 所以情绪不稳定\n首先要做的是不是要花时间理清思绪", "source": "豆瓣", "tags": ["向死而生", "身体"]}, {"time": "4月12日", "text": "思绪混乱的时候我在想些什么？", "source": "豆瓣", "tags": ["杂多"]}, {"time": "4月9日", "text": "话不投机半句多", "source": "豆瓣", "tags": ["杂多"]}, {"time": "4月8日", "text": "开始做就做得到", "source": "豆瓣", "tags": ["杂多"]}, {"time": "4月3日", "text": "天津4.2\n      \n      \n        \n          天津的春天是光秃秃的树和好看的花，时不时的冷空气和加绒的卫衣。\n天津有很多女性从事体力活动，街上也可以看到很多老奶奶爷爷出来溜圈，给对方拍照，大家似乎都很有活力。\n去到五大道，海棠花很好看，但有特别多的人，交通路况不太好，带来了些许心烦。踩车到人民公园，零零散散的也有几颗会开...（全文）", "source": "豆瓣", "tags": ["他人", "自由", "女人与他者", "身体与活着"]}, {"time": "3月26日", "text": "还能见多少面？", "source": "豆瓣", "tags": ["杂多"]}, {"time": "3月26日", "text": "少意气用事 情绪激动的时候就不要说话！", "source": "豆瓣", "tags": ["身体", "表达与语言"]}, {"time": "3月26日", "text": "你用什么作为爱的证明？", "source": "豆瓣", "tags": ["他人"]}, {"time": "3月26日", "text": "有病吧这个世界？", "source": "豆瓣", "tags": ["被抛", "身体与活着"]}, {"time": "3月26日", "text": "如果相处充满不快乐和顾虑 确是没必要继续下去", "source": "豆瓣", "tags": ["荒谬与反抗"]}, {"time": "3月26日", "text": "一期一会 如此如此 甚至没在我的本子上留下一个名字 不知道算是好事还是坏事。", "source": "豆瓣", "tags": ["杂多"]}, {"time": "3月25日", "text": "凡事别把后果想的太严重", "source": "豆瓣", "tags": ["杂多"]}, {"time": "3月25日", "text": "很烦了很困了", "source": "豆瓣", "tags": ["杂多"]}, {"time": "3月24日", "text": "陈思颖你的嘴能不能不要这么贱", "source": "豆瓣", "tags": ["他人"]}, {"time": "3月23日", "text": "一片混沌的生活怎么自己找解法 究竟要我做什么", "source": "豆瓣", "tags": ["身体与活着", "成为自己"]}, {"time": "3月23日", "text": "考完你的考你的 考完你的考你的", "source": "豆瓣", "tags": ["他人"]}, {"time": "3月23日", "text": "不如意不可控的事情太多 我只能一再叹气。", "source": "豆瓣", "tags": ["杂多"]}, {"time": "3月23日", "text": "为什么一直不停的在写写写", "source": "豆瓣", "tags": ["被抛", "表达与语言"]}, {"time": "3月23日", "text": "我没有义无反顾冲向爱情的勇气\n没有为自己辩解的能力", "source": "豆瓣", "tags": ["他人", "自由", "成为自己"]}, {"time": "3月21日", "text": "利益之中夹杂着多少友谊？", "source": "豆瓣", "tags": ["杂多"]}, {"time": "3月21日", "text": "面对无法改变的 社会结构带来的不公 应该怎么做\n      \n      \n        \n          等会写", "source": "豆瓣", "tags": ["被抛", "自由", "表达与语言"]}, {"time": "3月21日", "text": "什么算好，什么算差。也许是因为我并没有参与到他们的话语体系里，我无法理解何为学习天赋。再者，成长环境不一，能力参差不齐这很正常吧。世界是不会出现每个人并列第一的现象的，但是不成为第一也不是天大的事情。条条大路通罗马", "source": "豆瓣", "tags": ["被抛", "他人", "自由", "自由与束缚", "身体与活着"]}, {"time": "3月21日", "text": "无能为力的事太多 我还不够强大 知识面还不够深", "source": "豆瓣", "tags": ["杂多"]}, {"time": "3月19日", "text": "念念不忘必有回响！", "source": "豆瓣", "tags": ["杂多"]}, {"time": "3月18日", "text": "万幸我有成长", "source": "豆瓣", "tags": ["自由"]}, {"time": "3月18日", "text": "我还真是碰不得安坏", "source": "豆瓣", "tags": ["杂多"]}, {"time": "3月17日", "text": "我想要怎样的生活？", "source": "豆瓣", "tags": ["自由", "身体与活着"]}, {"time": "3月17日", "text": "进入了看书的瓶颈期！", "source": "豆瓣", "tags": ["表达与语言"]}, {"time": "3月15日", "text": "尚好的青春\n      \n      \n        \n          前几年少听孙燕姿 前段时间迷上了 把克卜勒这张专反反复复的听。某天收拾抽屉看到前妻姐给我写的信，抄了一整段孙燕姿的歌词。正好是尚好的青春我常哼唱的那段", "source": "豆瓣", "tags": ["向死而生", "表达与语言"]}, {"time": "3月15日", "text": "小小divorce in china 看我把你一举拿下", "source": "豆瓣", "tags": ["他人"]}, {"time": "3月15日", "text": "我就不信我做不到了。", "source": "豆瓣", "tags": ["自由"]}, {"time": "3月15日", "text": "胡思乱想何时能够停止", "source": "豆瓣", "tags": ["自由"]}, {"time": "3月14日", "text": "我想我首先要解决的是自己的问题", "source": "豆瓣", "tags": ["自由", "荒谬与反抗", "成为自己"]}, {"time": "3月12日", "text": "这个状态有问题 收拾收拾跑路罢", "source": "豆瓣", "tags": ["荒谬与反抗"]}, {"time": "3月8日", "text": "好累！作业多到写不完！想要倾诉，但倾诉有用么", "source": "豆瓣", "tags": ["畏", "表达与语言"]}, {"time": "3月6日", "text": "今天早上梦到雪糕死掉了 带着眼泪醒来摸了摸发现雪糕睡在我的枕头上 真好", "source": "豆瓣", "tags": ["他人", "向死而生"]}, {"time": "2月27日", "text": "我要怎么样才能说服自己让自己觉得“我很厉害”，什么才算是厉害 我到底怎么定义厉害", "source": "豆瓣", "tags": ["自由", "表达与语言", "成为自己"]}, {"time": "2月27日", "text": "我不是随便的花朵\n            \n            8.0\n      \n      \n      从春到……秋   我们终于再次迎来了她生命里花开不败的第四个春天\n中国最具个性女...\n      \n      \n              \n                  表演者:姜昕\n\n              流派:摇滚\n              发行时间:2007-12", "source": "豆瓣", "tags": ["日记", "他人", "向死而生"]}, {"time": "2月20日", "text": "讨好自己\n            \n            9.1\n      \n      \n      1994年的她还叫作“王靖雯”，这张专辑较为完整的体现了她的“另类”作风，同时又...\n      \n      \n              \n                  表演者:王菲\n\n              流派:流行\n              发行时间:1994", "source": "豆瓣", "tags": ["他人", "向死而生", "身体与活着", "成为自己"]}, {"time": "2月18日", "text": "年二十八回到来就听说伯婆老年痴呆中期了，好像第二天下午六七点才见到。整个人瘦了一大圈，但是还是记得我，我说我想考研究生，她还叫我加油。她之前总是会在一楼呆着跟爷爷奶奶聊天和看电视，这次回到来她话都少了很多。背着手就在屋子外面瞎走，也不会走远，绕着房子一个人慢吞吞地走。爷爷奶...（全文）", "source": "豆瓣", "tags": ["他人", "自由", "表达与语言"]}, {"time": "2月17日", "text": "凡事不要想得太绝对 凡事不要说得太绝对", "source": "豆瓣", "tags": ["表达与语言"]}, {"time": "2月16日", "text": "有困难我就接受困难 遭遇苦难我便享受苦难", "source": "豆瓣", "tags": ["荒谬与反抗"]}, {"time": "2月14日", "text": "不断与人告别 日子就这么缓缓流过", "source": "豆瓣", "tags": ["他人", "身体与活着"]}, {"time": "2月11日", "text": "利用片断的事实和有限的知识进行过度的思考与表达将会导致阶段性的有失偏颇的结论。", "source": "豆瓣", "tags": ["表达与语言"]}, {"time": "2月11日", "text": "XXXIII\n            \n            6.9\n      \n      \n      華語樂壇最強女饒舌女王、第一位以饒舌專輯拿下金曲新人獎等等的稱號，都不足以描...\n      \n      \n              \n                  表演者:葛仲珊 Miss Ko\n\n              流派:说唱\n              发行时间:2014-12-31", "source": "豆瓣", "tags": ["日记", "他人", "向死而生", "表达与语言"]}, {"time": "2月11日", "text": "葛屁\n            \n            7.6\n      \n      \n      MISS KO 葛仲珊 首張專輯 葛屁 Knock Out\n華語饒舌史上最強女流饒舌歌手誕生！\n當...\n      \n      \n              \n                  表演者:葛仲珊/MISS KO\n\n              流派:说唱\n              发行时间:2012-08-15", "source": "豆瓣", "tags": ["日记", "向死而生", "表达与语言"]}, {"time": "2月10日", "text": "'EX' All Time Favourites\n            \n            9.5\n      \n      \n      可能很多人甚至不知道这么一张专辑的存在，但这张专辑的水准却是丝毫不逊于张国荣...\n      \n      \n              \n                  表演者:关淑怡\n\n              流派:流行\n              发行时间:1995", "source": "豆瓣", "tags": ["日记", "他人", "自由", "向死而生"]}, {"time": "2月9日", "text": "2.9\n      \n      \n        \n          我真的是有点好奇到底为什么这种感觉又回来了？是什么东西在作祟？还是课堂给我带来的焦虑在加持？\n当下要紧的事情是把s从我的脑子里赶出去，我真的是一点也受不了了。我是不是疯子来的。为什么改变不了，爹的，真想给自己一巴掌。整得我好烦躁。\n别给她发信息了，实在不行就逃避一段时间吧。我觉...（全文）", "source": "豆瓣", "tags": ["日记", "被抛", "畏", "他人", "自由", "向死而生", "身体", "成为自己"]}, {"time": "2月9日", "text": "真是靠靠的靠", "source": "豆瓣", "tags": ["杂多"]}, {"time": "2月8日", "text": "郑州\n      \n      \n        \n            从河南博物馆的出口出来，猝不及防的看到了郑州的雪。也许是因为根本没有预想到会看到这场雪，所以我愣在原地好几分钟，甚至有点不知所措，然后才回过神来拍视频记录。\n  打开天气预报看着上面显示郑州“小雪”，但由于我是一个二十二年没有看过雪的南方孩子，这是我人生中看过最大的雪。从这个...（全文）", "source": "豆瓣", "tags": ["他人", "身体与活着"]}, {"time": "2月8日", "text": "我喜欢跟萍姐聊天 感觉什么都可以跟她说", "source": "豆瓣", "tags": ["他人", "自由", "身体", "表达与语言"]}, {"time": "2月8日", "text": "久久久违的想要写在豆瓣 其实是因为小本子忘记带了\n我真的是不清楚不理解 为什么我的情感总是能够出乎我的意料？\n好吧 循规蹈矩就不是感情了", "source": "豆瓣", "tags": ["被抛", "他人", "自由", "表达与语言"]}, {"time": "2月8日", "text": "我为什么如此害怕情绪波动", "source": "豆瓣", "tags": ["被抛", "畏", "身体"]}, {"time": "2月8日", "text": "好大好棒的勇气 才愿意把做的饭分享给人吃", "source": "豆瓣", "tags": ["他人"]}, {"time": "2月6日", "text": "生活给我太多压力以至于每天都只能缓慢的挪动", "source": "豆瓣", "tags": ["畏", "身体与活着"]}, {"time": "2月2日", "text": "为什么感觉每日的情绪都具有很强的独立性", "source": "豆瓣", "tags": ["被抛", "身体"]}, {"time": "1月28日", "text": "朱凤娟\n            \n            7.7\n      \n      \n      《朱凤娟》起源于日常的抓拍，后来演变成长达8年的对当代女性的亲密叙事。每一幅画...\n      \n      \n              作者:戴建勇", "source": "豆瓣", "tags": ["自由", "女人与他者", "身体与活着"]}, {"time": "1月28日", "text": "梦到蛇蛇了 怎么她开心和生气的形象在我梦里这么鲜活 仿若昨日", "source": "豆瓣", "tags": ["他人"]}, {"time": "1月27日", "text": "之前总是喜欢念叨“我想要说的前人们都说过了”\n但现在突然觉得，即使我的思想是众多前人们思想的总和。但无数个“部分的前人们的思想”汇集成了独一无二的“我的思想”\n即使世界上也许真的有人与我相同，但我没见到便视为这人不存在", "source": "豆瓣", "tags": ["被抛", "他人", "自由", "表达与语言", "身体与活着"]}, {"time": "1月23日", "text": "心情跌宕起伏 生活还是稳步向前 匆忙得遗忘了提笔写日记\n想要一直努力到底 想要成功", "source": "豆瓣", "tags": ["自由", "身体", "表达与语言", "身体与活着"]}, {"time": "1月20日", "text": "好想赢一次啊！", "source": "豆瓣", "tags": ["杂多"]}, {"time": "1月19日", "text": "想要牢牢记住每一个放声大哭的瞬间", "source": "豆瓣", "tags": ["畏", "身体"]}, {"time": "1月15日", "text": "看到阳光洒满大地 让我更不想被困在任何一个小盒子里", "source": "豆瓣", "tags": ["被抛", "身体与活着"]}, {"time": "1月15日", "text": "是要忘掉一些事物\n褪去一些珍贵的东西\n才能获得成长吗", "source": "豆瓣", "tags": ["自由"]}, {"time": "1月15日", "text": "梦到/半梦半醒想到\n小时候妈妈带我出去玩，带我参加活动\n工作人员问妈妈来干嘛的 妈妈开玩笑似的说加班\n莫名其妙就哭了\n能不能把妈妈的青春还给妈妈 不想时间走", "source": "豆瓣", "tags": ["畏", "他人", "向死而生", "身体", "表达与语言"]}, {"time": "1月14日", "text": "我要改变世界改变自己～\n      \n      \n        \n          1.13/1.14 2026\n考完试之后明显松懈了下来 但备考给我遗留下了一丝看书的习惯 最近学习上瘾 也许是因为能够切实的感受到知识的积累。\n今天看了法律人类学，感觉还是蛮有意思，也许能成为我以后的研究方向呢？把自主看完之后看合同法和金翼，接着也许是法律的概念？或者是婚姻继承法相关的，或许婚姻继承应该放在自主后面看呢，毕竟好像概念有相关的地方。反正也不长的", "source": "豆瓣", "tags": ["日记", "被抛", "畏", "他人", "自由", "身体", "表达与语言", "自由与束缚", "身体与活着", "成为自己"]}, {"time": "1月11日", "text": "最近总是莫名其妙哭", "source": "豆瓣", "tags": ["畏", "身体"]}, {"time": "1月8日", "text": "能抱拥便抱拥", "source": "豆瓣", "tags": ["杂多"]}, {"time": "1月8日", "text": "徽章我来了", "source": "豆瓣", "tags": ["杂多"]}, {"time": "1月4日", "text": "逃避一下 明天再想起", "source": "豆瓣", "tags": ["向死而生"]}, {"time": "1月4日", "text": "严重像情侣说分手", "source": "豆瓣", "tags": ["表达与语言"]}, {"time": "1月2日", "text": "我的眼泪呢", "source": "豆瓣", "tags": ["杂多"]}, {"time": "2025年12月31日", "text": "410在玩游戏 说：\n        \n          今年年末就不写总结了，做期...\n        \n        今年年末就不写总结了，做期翻译视频给大家乐呵乐呵吧：https://www.bilibili.com/video/BV1WpiTB7EKZ/\n游戏翻译这几年可谓是神人辈出，前有震撼我妈一整年，后有睡觉的符文石和及八奏甜熔...", "source": "豆瓣", "tags": ["他人", "向死而生", "表达与语言"]}, {"time": "2025年12月31日", "text": "12.31\n      \n      \n        \n          带着茫然提笔想要总结这一年，看着日期翻相册才发现这么多事原来都发生在今年，还以为是好久以前了。还记得得知死亡搁浅和怪奇物语在2025发布的时候，我还觉得2025是一个好遥远的年份，现在认真想起来的时候，发现2025原来都已经要过完了。24年的我对25年发布的怪奇物语和死亡搁浅充满了期待，结果...（全文）", "source": "豆瓣", "tags": ["日记", "被抛", "荒谬与反抗", "向死而生"]}, {"time": "2025年12月28日", "text": "写作最重要的不是辞藻而是思想", "source": "豆瓣", "tags": ["表达与语言"]}, {"time": "2025年12月25日", "text": "如果后悔和愧疚能解决问题的话那人都不会有啥烦恼了", "source": "豆瓣", "tags": ["畏", "他人", "荒谬与反抗"]}, {"time": "2025年12月25日", "text": "是不是降低自己的表达欲才能更好的同人交流", "source": "豆瓣", "tags": ["他人", "表达与语言", "成为自己"]}, {"time": "2025年12月25日", "text": "我为什么不能拥有极端的情绪？\n      \n      \n        \n          塑造完外面的我我要慢慢开始建立里面的我", "source": "豆瓣", "tags": ["被抛", "自由", "向死而生", "身体"]}, {"time": "2025年12月21日", "text": "滚滚滚滚滚滚滚滚滚滚滚滚滚滚滚滚滚滚滚滚滚滚滚", "source": "豆瓣", "tags": ["杂多"]}, {"time": "2025年12月21日", "text": "焦虑是常态\n忍耐是常态\n不开心是常态", "source": "豆瓣", "tags": ["畏"]}, {"time": "2025年12月21日", "text": "常态常态常", "source": "豆瓣", "tags": ["杂多"]}, {"time": "2025年12月20日", "text": "为什么总是做不到我想做到", "source": "豆瓣", "tags": ["被抛", "自由"]}, {"time": "2025年12月18日", "text": "你想要听我说什么 我便都说了", "source": "豆瓣", "tags": ["他人", "表达与语言"]}, {"time": "2025年12月14日", "text": "是小孩来的", "source": "豆瓣", "tags": ["杂多"]}, {"time": "2025年12月13日", "text": "跨年看什么电影好….", "source": "豆瓣", "tags": ["杂多"]}, {"time": "2025年12月12日", "text": "好没劲..", "source": "豆瓣", "tags": ["杂多"]}, {"time": "2025年12月12日", "text": "疑惑\n      \n      \n        \n          真的不知道我在你心里到底算得上是什么。\n好似做什么都不用顾及我的心情。", "source": "豆瓣", "tags": ["他人", "身体"]}, {"time": "2025年12月12日", "text": "人可以形式主义，但也不能太过于形式主义的", "source": "豆瓣", "tags": ["他人", "自由"]}, {"time": "2025年12月11日", "text": "现代人类为何如此渴望爱？\n      \n      \n        \n          今晚写", "source": "豆瓣", "tags": ["他人", "表达与语言"]}, {"time": "2025年12月9日", "text": "我会一直看一直写一直看一直写直到我的文笔得到提升。", "source": "豆瓣", "tags": ["表达与语言"]}, {"time": "2025年12月8日", "text": "不要过于依赖以至于滥用美好", "source": "豆瓣", "tags": ["杂多"]}, {"time": "2025年12月8日", "text": "减少决策前的思考时间可以坚定信念", "source": "豆瓣", "tags": ["自由", "向死而生"]}, {"time": "12月8日", "text": "适应生活节奏的任何变化 允许自己偷懒是在偷懒后迅速进入学习状态的大前提\n\n2025年", "source": "豆瓣", "tags": ["自由与束缚", "身体与活着", "成为自己"]}, {"time": "12月7日", "text": "流感头疼欲裂感觉几近五感净失 反而莫名其妙想象力发达思路变得清晰了不少 做的梦特别有意思感受又特别接近现实 看书也更容易理解作者书中所想 这太神奇了 为什么？\n\n2025年", "source": "豆瓣", "tags": ["被抛", "他人", "身体", "表达与语言"]}, {"time": "2025年12月7日", "text": "不要啊..", "source": "豆瓣", "tags": ["杂多"]}, {"time": "12月7日", "text": "每一个人是一个自足的生理单位，他的神经系统总是及肤而止；他能感觉得到的只是这个单位，对于别人是痛痒不关的。一个人永远不能直接感觉到别人的痛痒，了解会意从何说起？\n\n2025年", "source": "豆瓣", "tags": ["他人", "向死而生", "身体", "表达与语言"]}, {"time": "2025年12月7日", "text": "日子充实幸福得无时间抬笔记录 梦一般美好", "source": "豆瓣", "tags": ["向死而生", "身体与活着"]}, {"time": "2025年12月6日", "text": "朋友是无用的", "source": "豆瓣", "tags": ["他人"]}, {"time": "2025年12月6日", "text": "经历的每一刻都在造就我", "source": "豆瓣", "tags": ["杂多"]}, {"time": "2025年12月5日", "text": "内心除了狗屎只有泥土是怎么样都种不出花来的。", "source": "豆瓣", "tags": ["杂多"]}, {"time": "2025年12月5日", "text": "人和人沟通怎么会这么费劲？", "source": "豆瓣", "tags": ["他人", "表达与语言"]}, {"time": "2025年12月4日", "text": "尊重是理解的前提", "source": "豆瓣", "tags": ["他人"]}, {"time": "2025年12月4日", "text": "将说不出口的话记录下来总会有用武之地", "source": "豆瓣", "tags": ["表达与语言"]}, {"time": "12月4日", "text": "12.3\n结果今天还是没看完刑诉法的书，还差个一点，但还好心情不错。\n把微信通知关了，发现这是一个减少分心的大好方法。被迫的打开微信总让我有一种被支配感。\n明天环境法课把柏拉图的会饮篇看完看看能不能开始写经济法论文了。晚上的音乐鉴赏课把鉴赏的小作文写了，回去的大巴上也还能看书。\n我要不断看书看书看书和进步进步进步！\n\n2025年", "source": "豆瓣", "tags": ["日记", "被抛", "自由", "向死而生", "身体", "表达与语言", "自由与束缚"]}, {"time": "2025年12月3日", "text": "在相对可控的范围内订立目标\n      \n      \n        \n          我在这里把可控定义我可以支配自己去做且知道自己完成了\n比如我看完了一本书，写完了一篇论文，少吃一个面包，这些都是我可以即时知道结果的事实行为，如果单单将其从日常生活中提取出看的话这似乎并不难完成。\n那么阻扰我的是什么呢，是在其背后我急于求成想要达成的一个不能即时看到结果的大成...（全文）", "source": "豆瓣", "tags": ["自由", "荒谬与反抗", "表达与语言", "自由与束缚", "身体与活着", "成为自己"]}, {"time": "2025年12月3日", "text": "以年为单位订立目标…", "source": "豆瓣", "tags": ["杂多"]}, {"time": "2025年12月2日", "text": "没有负责任的义务！", "source": "豆瓣", "tags": ["杂多"]}, {"time": "2025年12月2日", "text": "12.1/2\n      \n      \n        \n          十二月快乐 虽然有数不尽的考试\n经济法ddl在下周..我怎么才发现？看了看题目发现之前自己学的知识可以派上用场，应该不难写。感觉如果我不怕的话什么都能做得到。最近感觉自己信心勇气倍增，不知道什么原因导致", "source": "豆瓣", "tags": ["日记", "自由", "荒谬与反抗", "身体", "表达与语言", "自由与束缚", "成为自己"]}, {"time": "2025年12月1日", "text": "怎么肆无忌惮", "source": "豆瓣", "tags": ["杂多"]}, {"time": "12月1日", "text": "从“别人这么做了，我也可以这么做”到“我为什么不能这么做？”是我最大的改变\n\n2025年", "source": "豆瓣", "tags": ["被抛", "他人", "自由"]}, {"time": "2025年12月1日", "text": "11.30\n      \n      \n        \n          今晚本来打算先去和44逛公园什么的，再和小洪去小疯鸟复习，结果莫名其妙又心烦意乱起来。跟qb聊了聊，我发现我自己无法接受我在讨厌一个人某一个点的同时又愿意跟她聊天。\nqb说这很正常，真的吗。有时候会跟朋友说另一个朋友的不是，但是还是会在她下一次求助我的时候回她的消息，或者时不时也想...（全文）", "source": "豆瓣", "tags": ["日记", "被抛", "他人", "荒谬与反抗", "表达与语言", "成为自己"]}, {"time": "2025年11月29日", "text": "自由对我来说太重要", "source": "豆瓣", "tags": ["自由", "表达与语言"]}, {"time": "2025年11月29日", "text": "理解是宝物\n      \n      \n        \n          最近时常会觉得自己的一些表达，一些做法会被别人误解，然后就为此感到些许的烦躁和焦虑。回想起来这种焦虑毫无意义。\n无论怎么样，我没办法去控制别人的思想，没办法去改变别人看待我的方式，外界的东西我终归是没有能力去掌控的。每个人都是根据自己内心独有的判断标准去评判他人，这有什么错。...（全文）", "source": "豆瓣", "tags": ["被抛", "畏", "他人", "自由", "荒谬与反抗", "无意义与意义", "表达与语言", "成为自己"]}, {"time": "2025年11月29日", "text": "真有点累了", "source": "豆瓣", "tags": ["畏"]}, {"time": "2025年11月28日", "text": "大家都选择平和之道是需要外部强制约束力干涉的", "source": "豆瓣", "tags": ["他人", "自由"]}, {"time": "2025年11月27日", "text": "怎么每次思考这件事都像被架在火上烤", "source": "豆瓣", "tags": ["被抛"]}, {"time": "11月27日", "text": "我是流水，\n是任植被生长的山坡，\n是携带万千生物吹拂的微风。\n我亦可以成为落在森林里的雨水，\n照向大地的太阳，\n潮湿的土壤。\n\n2025年", "source": "豆瓣", "tags": ["被抛", "自由", "身体与活着"]}, {"time": "2025年11月26日", "text": "11.26\n学习紧迫胡思乱想，控制情绪，不要焦虑", "source": "豆瓣", "tags": ["日记", "畏", "身体", "自由与束缚"]}, {"time": "2025年11月25日", "text": "我发现对任何东西都不能情绪太满", "source": "豆瓣", "tags": ["身体"]}, {"time": "2025年11月25日", "text": "我发现了朋友要换着见", "source": "豆瓣", "tags": ["他人"]}, {"time": "2025年11月25日", "text": "如何避免独处过度导致闭门造车？", "source": "豆瓣", "tags": ["杂多"]}, {"time": "11月24日", "text": "转变这个形容词给我一种很有目的性的感觉，好像十分的有效率。相比起“想法转变”，我更觉得是我从一种想法踱步到另一种想法。\n\n2025年", "source": "豆瓣", "tags": ["身体", "无意义与意义"]}, {"time": "2025年11月24日", "text": "遇到事情要慢慢的想 不要快快的想", "source": "豆瓣", "tags": ["向死而生"]}, {"time": "2025年11月22日", "text": "人只有在独处的时候不会被误解", "source": "豆瓣", "tags": ["被抛", "他人"]}, {"time": "2025年11月20日", "text": "我就是要这样活", "source": "豆瓣", "tags": ["杂多"]}, {"time": "2025年11月20日", "text": "11.20\n      \n      \n        \n          时间过得好快 我想我需要不断的提醒自己抓紧时间摄取知识 搭积木搭积木搭积木搭上去吧 开始做的时候不要想目标", "source": "豆瓣", "tags": ["日记", "自由", "向死而生", "成为自己"]}, {"time": "11月18日", "text": "闭上眼睛\n我可以看到烟火绽放，看到夜空繁星闪烁\n看到雨后黄叶飘落，看到鹅毛大雪盖满大地。\n看见树，看见海，看见太阳东升西落\n看见光，看见风，看见紫外羽色\n我的世界五彩斑斓\n\n2025年", "source": "豆瓣", "tags": ["被抛", "自由", "身体与活着"]}, {"time": "2025年11月17日", "text": "我不能飘飘然的活着\n      \n      \n        \n          从未在此谈论过未来，但突然感觉应该为它写点什么。\n我对自己的未来一直没有一个明确的设想，我的成长历程总像一头无头苍蝇一样乱撞，一个学期感觉自己不停在学但回头看好似又并无成效。\n但我又不是很想让自己写出这样的文字，我似乎没有十足的底气大胆的说我的积累终归会导致进步，只是它现在还...（全文）", "source": "豆瓣", "tags": ["畏", "自由", "向死而生", "身体", "表达与语言", "身体与活着", "成为自己"]}, {"time": "2025年11月17日", "text": "11.17\n      \n      \n        \n          时间原来过的这么快，怎么就到十一月中旬了。\n这个周末跟她们在一起过的很开心，大家一起喝醉了唱歌，一起有一搭没一搭的聊天，我感觉我们很合拍。看那天晚上的视频的时候都会觉得很开心。好久没遇到这样的情绪了。\n但一觉醒来过后又觉得这段情谊好虚无，摇摇欲坠。不知是我的想法太过于悲观还是...（全文）", "source": "豆瓣", "tags": ["日记", "他人", "向死而生", "身体", "表达与语言"]}, {"time": "11月17日", "text": "不知道t是否有点想要在大家面前表露自己的想法 也许在探寻得到答案之后把她推到大家面前看看呢\n\n2025年", "source": "豆瓣", "tags": ["他人", "成为自己"]}, {"time": "2025年11月17日", "text": "存在先于本质\n      \n      \n        \n          如此急切的想要去定义每一段关系\n关系是因为交流而存在，又不是因为定义而存在，何必非要给一段关系贴上标签。突然感觉好朋友和朋友的分级又是一种很虚妄的东西，“她是我的好朋友所以我可以为她做这件事”这种逻辑思维真的正确吗？且不说好朋友这个词的界限在我心中本就模糊，我做任何事情难道不...（全文）", "source": "豆瓣", "tags": ["他人", "自由", "荒谬与反抗", "身体", "表达与语言"]}, {"time": "2025年11月16日", "text": "人多嘈杂的时候想闭着眼睛听歌走路", "source": "豆瓣", "tags": ["他人"]}, {"time": "2025年11月16日", "text": "九日 Nine Sols (2024)\n              \n              8.4\n      \n      《九日》是一款结合道教科幻与上古神话的 2D 平台动作冒险游戏。强调格挡机制和节...\n      \n        \n            类别：游戏 / 横版过关 / 冒险 / 动作\n            平台：PC / Mac / PS5 / XSX / Nintendo Switch / PS4 / Xbox One", "source": "豆瓣", "tags": ["日记"]}, {"time": "11月15日", "text": "不同年龄阶层的女性都有着自己心中不同的女性主义，但归根结底我认为还是女性要以自己的意愿活。\n\n2025年", "source": "豆瓣", "tags": ["女人与他者", "成为自己"]}, {"time": "2025年11月15日", "text": "深耕于感受反而能体会到词语中存在的细微差别", "source": "豆瓣", "tags": ["自由"]}, {"time": "2025年11月15日", "text": "我干嘛要对冷漠这个词有偏见！\n      \n      \n        \n          她说她是冷漠的，那我便用冷漠形容她，为何要自以为是的反驳她？不要成为自大狂。", "source": "豆瓣", "tags": ["被抛", "他人", "表达与语言"]}, {"time": "2025年11月15日", "text": "感情这种东西 何必分等级", "source": "豆瓣", "tags": ["杂多"]}, {"time": "2025年11月15日", "text": "活在当下就好了 何必过度思虑未来", "source": "豆瓣", "tags": ["向死而生"]}, {"time": "11月14日", "text": "拿塔纳埃勒，你若想要爱她，就不能想要从她身上得到什么，甚至是爱。你应该去接受，而不是去要求。爱是给予爱，而不是获得爱。\n\n2025年", "source": "豆瓣", "tags": ["他人", "荒谬与反抗"]}, {"time": "2025年11月14日", "text": "每日，琐事如过堂风般穿透我，我又怎能一成不变？", "source": "豆瓣", "tags": ["身体与活着"]}, {"time": "11月14日", "text": "情绪不能简单被划分为喜和悲 同理 那同样根据感觉定义的人与人之间的关系岂不是也不能被简单划分为朋友家人同恋人？\n\n2025年", "source": "豆瓣", "tags": ["被抛", "他人", "身体"]}, {"time": "11月14日", "text": "在不影响到别人的前提下 想做什么就去做 过度思虑反而阻碍行动 比如看书，比如学习\n\n2025年", "source": "豆瓣", "tags": ["他人", "表达与语言", "自由与束缚"]}, {"time": "2025年11月14日", "text": "不开心干嘛要找原因？", "source": "豆瓣", "tags": ["杂多"]}, {"time": "2025年11月13日", "text": "想要拥有享受悲伤的能力", "source": "豆瓣", "tags": ["自由"]}, {"time": "2025年11月13日", "text": "我心中青春太多，尚无法谈论死亡。", "source": "豆瓣", "tags": ["被抛", "向死而生"]}, {"time": "2025年11月13日", "text": "人贵在有自制力。", "source": "豆瓣", "tags": ["他人"]}, {"time": "11月13日", "text": "我真不知道我是哪句话没说明白还是你哪根筋抽了，一而再再而三的在我心情好些的时候来烦我，我真的是没招了。\n\n2025年", "source": "豆瓣", "tags": ["他人", "身体", "表达与语言"]}, {"time": "2025年11月13日", "text": "找到目标\n      \n      \n        \n          我觉得有些时候还是得知道自己不想要什么，想要什么，才能让我不要一昧的顺从别人以至于丢失自己。就比如现在，我想要学，我想要进步，玩只是放松。", "source": "豆瓣", "tags": ["他人", "自由", "成为自己"]}, {"time": "2025年11月13日", "text": "不要忘了独处。不要忘了独处。", "source": "豆瓣", "tags": ["杂多"]}, {"time": "2025年11月12日", "text": "有什么是做不到？", "source": "豆瓣", "tags": ["自由"]}, {"time": "2025年11月12日", "text": "不要着急给想法套一个框 不要给“我”下定义", "source": "豆瓣", "tags": ["杂多"]}, {"time": "2025年11月11日", "text": "万物更新 我也更新", "source": "豆瓣", "tags": ["杂多"]}, {"time": "2025年11月11日", "text": "逃飛行\n            \n            \n      \n      \n      MIGHTY CROWN、RED SPIDERも、その実力を認めるスーパーシンガー“Rickie-G”待望...\n      \n      \n              \n                  表演者:Ｒｉｃｋｉｅ－Ｇ\n\n              发行时间:2007年07月11日", "source": "豆瓣", "tags": ["向死而生"]}, {"time": "2025年11月11日", "text": "オールトの雲\n            \n            8.8\n      \n      \n      3歳のころからピアノを始め、塩谷哲のピアノ演奏に感動したことをきっかけにミュー...\n      \n      \n              \n                  表演者:柴田淳\n\n              流派:民谣\n              发行时间:2002-03-20", "source": "豆瓣", "tags": ["日记", "向死而生"]}, {"time": "2025年11月11日", "text": "Under The Sun\n            \n            7.3\n      \n      \n      梁雨恩(Cathy)是2007年度东亚唱片旗下的重点新人，在新专辑中有一身型女的造型。她...\n      \n      \n              \n                  表演者:梁雨恩\n\n              流派:流行\n              发行时间:2007-09-03", "source": "豆瓣", "tags": ["日记", "他人", "向死而生"]}, {"time": "11月11日", "text": "新认识的三个小女孩像三个小朋友 都特别的真诚特别的萌 跟她们交朋友有点害怕又有点幸福\n\n2025年", "source": "豆瓣", "tags": ["畏", "他人"]}, {"time": "2025年11月11日", "text": "明天看完爱的艺术", "source": "豆瓣", "tags": ["他人", "向死而生"]}, {"time": "2025年11月10日", "text": "11.10\n      \n      \n        \n          似乎从不好的情绪中爬出来了一点，不知道哪个瞬间突然茅塞顿开，心情通畅了一些。\n感觉自己过得更加的小心翼翼，防止自己将思考投入一些无意义的内耗方向中，在有一些苗头的时候就及时将其切断了，这是好的。\n深度思考是一个好习惯，但我不应该把它投入到会影响我情绪的问题里。每时每刻不断的思...（全文）", "source": "豆瓣", "tags": ["日记", "荒谬与反抗", "身体", "无意义与意义", "成为自己"]}, {"time": "2025年11月9日", "text": "我没有义务去跟随别人的想法\n      \n      \n        \n          突然意识我的讨好型人格不会已经达到觉得别人怎么想我就一定要怎么想的状态了吧。\n我一直搞不清我对z和她们一众人的态度，其实也有点受z影响。z表现出来的好像把大家当做很好的朋友的态度让我有点不知所措，甚至心中油然而生一种毫无缘由的亏欠感。我心里的小人好像就在听到她说这句话的时候立马站...（全文）", "source": "豆瓣", "tags": ["他人", "身体", "表达与语言"]}, {"time": "2025年11月9日", "text": "hi7姐\n      \n      \n        \n          你荼毒我荼毒的太深了！", "source": "豆瓣", "tags": ["他人"]}, {"time": "2025年11月8日", "text": "11.8\n      \n      \n        \n          我到底为什么总是不开心？我感觉我真的是尽力了。最近脑子里想的东西总是乱七八糟，搞不懂自己的情绪到底出了什么问题，清醒着的时候思想就好像掉进了一个很深很深的海里。其实刚刚就有在想我会不会是被那些事情影响了情绪，但我现在又觉得不是了。\n也有可能是我的身体本身就在不断的生产一些负面...（全文）", "source": "豆瓣", "tags": ["日记", "被抛", "荒谬与反抗", "身体", "成为自己"]}, {"time": "2025年11月8日", "text": "被误会不好受", "source": "豆瓣", "tags": ["被抛"]}, {"time": "2025年11月8日", "text": "想成为世界的旁观者", "source": "豆瓣", "tags": ["被抛", "身体与活着"]}, {"time": "2025年11月6日", "text": "11.6/11.5\n      \n      \n        \n          昨日跟lzr在车上讨论社交问题，她要跟我们去吃鸡煲，我在群里问大家会不会尴尬。44和hong都说了不会，t没有发话。我问lzr是不是应该私聊去问问t，她说了一句“你好敏感”。\n我当下的第一反应是想到正好昨天早上在微博看到的“练习回嘴的勇气”，即是当对方说自己“太敏感了”的时候回应“是你太粗...（全文）", "source": "豆瓣", "tags": ["日记", "他人", "荒谬与反抗", "向死而生", "表达与语言", "成为自己"]}, {"time": "2025年11月6日", "text": "人在自己不愿意的时候是不会被改变的\n      \n      \n        \n          真的吗，人在被改变的时候真的会意识到自己在变化中吗？观点还是不能太绝对，应当注重个体化差异。我在被改变的时候其实是无意识居多，改变完成了才反应过来自己原来变了那么多。我认为我的个性以及想法都是跟着生活的进程不断的进行变化的，", "source": "豆瓣", "tags": ["被抛", "他人", "自由", "身体与活着", "成为自己"]}, {"time": "11月6日", "text": "双方都没有向对方索取任何利益的欲望的关系是否才是真正健康的关系？\n\n2025年", "source": "豆瓣", "tags": ["他人"]}, {"time": "2025年11月6日", "text": "不应当用二分法解决所有问题\n      \n      \n        \n          1", "source": "豆瓣", "tags": ["荒谬与反抗"]}, {"time": "2025年11月5日", "text": "随想\n      \n      \n        \n          突然发现her吧吸引我之处除了那个适宜阅读的位置还因为我在那没有认识的人。也即是说我可以做自己，这点真的是难能可贵。\n回想起来我也许还喜欢用一个完全旁观者的身份去观察那里形形色色的女性？\n跟那里的人建立了太多的联系之后那个地方似乎就失去了对我的吸引力，因为我现在身在其中了。哎我真...（全文）", "source": "豆瓣", "tags": ["他人", "自由", "荒谬与反抗", "表达与语言", "女人与他者", "成为自己"]}, {"time": "2025年11月5日", "text": "11.5想到就写了\n      \n      \n        \n          昨晚睡的很好，今早起来又听了《跟着感觉走》强制开机。\n最近几天过的很梦幻，一点作业没做，跟不熟悉的人见了两三天,感觉能量有点被消耗。昨天凌晨在her喝酒跟lzr一拍即合，白天我翘了两节课，晚上坐她的车回来了珠海。我俩去吃了深夜食堂，终于让她吃上了，我开心。\n罗马法老师居然听重塑雕像的权利？", "source": "豆瓣", "tags": ["日记", "被抛", "他人", "向死而生", "身体", "表达与语言"]}, {"time": "2025年11月3日", "text": "我到底在害怕什么\n      \n      \n        \n          为什么我现在跟t交流会带着一丝的慌乱，是因为我被她表现出来的冷漠吓到了吗？我在害怕什么？？害怕被她讨厌吗？但她与我生活并无交集呀，就算不联系我也不会失去什么？我感觉我也不是对她有任何超过朋友的好感吧..\n这情绪让我真有些烦了，我得想点办法切段跟她的交流", "source": "豆瓣", "tags": ["被抛", "畏", "他人", "荒谬与反抗", "身体", "身体与活着"]}, {"time": "2025年11月3日", "text": "约翰与洋子\n      \n      \n        \n          第一次听到这首歌好像是在认真上完急救科坐上巴士赶回广州和lzr吃鸡煲的途中。我穿着蓝色的牛仔长裤，那似乎也是一个秋。阳光从窗外洒进来，照的我有些睁不开眼睛。我坐在倒转的公交车座位上，看着路上放学的小孩和被太阳照的闪闪发光的海面。而耳边响起的歌唱着“几多俊俏的山岭，都攀过去”，众多...（全文）", "source": "豆瓣", "tags": ["被抛", "向死而生", "身体与活着"]}, {"time": "11月3日", "text": "做了个跟妈妈一起出去玩的梦，妈妈对我很好，好像带有一丝愧疚和讨好的意味。她带我去剪头发，想给我买衣服，然后我被一个男理发师剪了一个特丑的头发。然后我们一起玩小时候玩的那个用脚蹬的小车，我坐在前面操控方向。然后我醒了\n\n2025年", "source": "豆瓣", "tags": ["被抛", "他人"]}, {"time": "2025年11月2日", "text": "被动的观众\n            \n            8.3\n      \n      \n      将爱。止于被动\n让爱。始于互动\n华语乐坛 好久不见 戴佩妮\n2022全新创作专辑《被动...\n      \n      \n              \n                  表演者:戴佩妮\n\n              流派:流行\n              发行时间:2022-06-29", "source": "豆瓣", "tags": ["日记", "被抛", "他人", "向死而生"]}, {"time": "2025年11月2日", "text": "回家路上\n            \n            8.3\n      \n      \n      引领你通往心灵归属\n回家路上是一趟拥抱自己的旅程是一股勇敢去爱的力量\n2011年11...\n      \n      \n              \n                  表演者:戴佩妮\n\n              流派:流行\n              发行时间:2011-11-01", "source": "豆瓣", "tags": ["日记", "他人", "向死而生", "成为自己"]}, {"time": "2025年11月2日", "text": "打狗女郎\n            \n            8.3\n      \n      \n      何谓“有耳非文”，看到这个名字后的第一个想法就是“有耳朵可以去听，非文字所能...\n      \n      \n              \n                  表演者:有耳非文\n\n              流派:流行\n              发行时间:2001", "source": "豆瓣", "tags": ["自由", "向死而生", "表达与语言"]}, {"time": "2025年11月2日", "text": "11.1/2\n      \n      \n        \n          我觉得我在一个人面前需要在多大程度上的不做自己决定了这个人在我心里的分量和我对和她相处的喜爱程度。而我对“做自己”的定义是“最让我感到舒适的一种状态。”这么来说我其实是最喜欢独处，其次应该是和lzr相处。\nlzr和t不同之处在于我跟t交流我偏向于从她的人生经历学到点什么，一些被我下意...（全文）", "source": "豆瓣", "tags": ["日记", "被抛", "他人", "身体", "表达与语言", "身体与活着", "成为自己"]}, {"time": "2025年11月2日", "text": "她好像并无想象中有意思", "source": "豆瓣", "tags": ["他人"]}, {"time": "2025年10月29日", "text": "Feeling and Knowing\n            \n            \n      \n      \n      From one of the world's leading neuroscientists: a succinct, illuminating, wh...\n      \n      \n              作者:Antonio Damasio", "source": "豆瓣", "tags": ["杂多"]}, {"time": "2025年10月28日", "text": "休息一会再变强", "source": "豆瓣", "tags": ["杂多"]}, {"time": "2025年10月28日", "text": "朋友\n      \n      \n        \n          我发现朋友真的是一个很浪漫的词。\n友在字典上的意思是“ 关系密切、有交情的人”；在日常使用中，我们经常也把“一起做….事”的人称为友，就比如饭友，笔友。而“朋”为月月，如此一来，朋友就是一起“从一个月亮走向另一个月亮”的人\n希望能跟我的朋友们一起看上数不清次数的月升月落。", "source": "豆瓣", "tags": ["他人", "身体与活着"]}, {"time": "2025年10月28日", "text": "记录一下灵感", "source": "豆瓣", "tags": ["杂多"]}, {"time": "2025年10月27日", "text": "些许的焦虑感是我需要的", "source": "豆瓣", "tags": ["畏"]}, {"time": "10月27日", "text": "只要主动去定义了我对一个人的感觉，就不免会根据此定义调整自己的行为\n\n2025年", "source": "豆瓣", "tags": ["他人", "身体", "成为自己"]}, {"time": "10月27日", "text": "我不断反复反复翻阅她的信息，也许是想让自己在不清醒的状态下直面我一直竭力逃离的，过度麻痹的，她给我带来的难过的情绪，仿似通过这样的途径可以解决问题。会吗？会解决吗？\n明天还要继续\n希望不好的结局快点降临 不要让我再煎熬\n反复的情绪很不好受\n我想我需要一个理由让自己流眼泪\n想要购买悲伤情绪剂\n\n2025年", "source": "豆瓣", "tags": ["畏", "他人", "自由", "荒谬与反抗", "向死而生", "身体", "成为自己"]}, {"time": "2025年10月27日", "text": "看书\n      \n      \n        \n          我喜欢酒后看书，逐渐认识到看书其实不需要太多的理性。我不能在现实完完全全理解一个人的思想，那我又为何觉得能从文字中完全看透作者所表达的意思呢？未免过于自大。有些文字或许只需要看表象，过度思考会加深我阅读的困难", "source": "豆瓣", "tags": ["他人", "荒谬与反抗", "表达与语言"]}, {"time": "2025年10月26日", "text": "我是否过于自满？\n      \n      \n        \n          要寻找一个中间的道路，不要太极端。", "source": "豆瓣", "tags": ["杂多"]}, {"time": "2025年10月26日", "text": "今天虽然没有看完一本书 但是遇到了聊的很来的朋友 真好。", "source": "豆瓣", "tags": ["他人"]}, {"time": "2025年10月25日", "text": "嘴巴并不是表达人类感情的唯一工具\n      \n      \n        \n          最近因为s的事情郁郁寡欢，但也正因为如此看到了身边朋友的好。\nlzr在我发一些负面情绪的时候通常不会说什么，我很能理解，但我时不时还是会觉得有点难过，这无可避免呀。不过她会在出去玩的时候给我买手链，给我买纪念品，我觉得好感动。\nx也会在我不开心的时候坐在我身边，听我叨叨絮絮的说一些...（全文）", "source": "豆瓣", "tags": ["畏", "他人", "荒谬与反抗", "身体", "表达与语言"]}, {"time": "10月25日", "text": "真正的朋友不是你这样的 我想我都不需要你这样的朋友 纯粹浪费精力\n\n2025年", "source": "豆瓣", "tags": ["他人", "自由"]}, {"time": "10月25日", "text": "我的思想是我最宝贵的财富 思想不会消失 所以我应该对我的未来抱有无限的勇气\n\n2025年", "source": "豆瓣", "tags": ["向死而生"]}, {"time": "2025年10月24日", "text": "算了 也许她也是第一次遇到这样的状况", "source": "豆瓣", "tags": ["他人"]}, {"time": "2025年10月24日", "text": "无题\n      \n      \n        \n          我其实很自豪自己在极度情绪化的时候也下意识地做到了尊重她人的主体性，这个道理似乎也融入到了我的血液里。回过头来发现这件事，突然很开心。太好了，我做到了。\n最近学的课，看的书都让我更有相信自己的勇气。不受大众观念所裹挟，不被三夫之言所影响，不相信有我做做不到的事情，我希望我可以...（全文）", "source": "豆瓣", "tags": ["被抛", "他人", "自由", "身体", "成为自己"]}, {"time": "2025年10月24日", "text": "喜欢的人拼命想和我做朋友 想做朋友的拼命以为我喜欢她😂", "source": "豆瓣", "tags": ["他人"]}, {"time": "2025年10月24日", "text": "哎快从我的生活离开吧", "source": "豆瓣", "tags": ["身体与活着"]}, {"time": "2025年10月23日", "text": "终于无事一身轻", "source": "豆瓣", "tags": ["杂多"]}, {"time": "2025年10月23日", "text": "10.23\n      \n      \n        \n          我又失败了", "source": "豆瓣", "tags": ["日记"]}, {"time": "2025年10月23日", "text": "10.22\n      \n      \n        \n          今天课堂上的都不错，雅思作业也有在认真的完成几篇，晚上也有在上课。总体下来其实也算不错。\n晚上x说好喜欢我这个朋友，听到了好开心，我跟各种人炫耀。好感动。好感动，她跟我说的话让我有种“被看到了”的感觉。我想也许y也并没有那么烦人，是因为我最近的心情太过于糟糕，对与她的态度有点太...（全文）", "source": "豆瓣", "tags": ["日记", "被抛", "他人", "自由", "身体", "表达与语言"]}, {"time": "2025年10月23日", "text": "不跟s说话我可以得到\n      \n      \n        \n          不用再反反复复内耗\n不用再在意她是否回信息\n不用再拼命找话题聊天\n不用再想方设法维持社交\n不用在她找到对象的时候承受暴击\n无事一身轻。\n我做不到\n看到她去date无动于衷\n每天说服自己别再喜欢她\n维持现状 当朋友相处", "source": "豆瓣", "tags": ["他人", "自由", "荒谬与反抗", "表达与语言", "成为自己"]}, {"time": "2025年10月23日", "text": "若我不狠心～ 痛心的只有自己～～", "source": "豆瓣", "tags": ["成为自己"]}, {"time": "2025年10月23日", "text": "我想我和她不会再见了", "source": "豆瓣", "tags": ["他人", "自由"]}, {"time": "2025年10月23日", "text": "你与喜欢的人是怎么样聊天的呢", "source": "豆瓣", "tags": ["他人", "表达与语言"]}, {"time": "2025年10月22日", "text": "沉默是我无用的武器", "source": "豆瓣", "tags": ["表达与语言"]}, {"time": "2025年10月22日", "text": "这个朋友非做不可吗", "source": "豆瓣", "tags": ["他人"]}, {"time": "2025年10月21日", "text": "居然会觉得我闲\n      \n      \n        \n          不可思议…", "source": "豆瓣", "tags": ["杂多"]}, {"time": "2025年10月21日", "text": "19\n            \n            8.0\n      \n      \n      跨領域的再創作\n一場隨性聊天中乍現的靈感: 陳建騏歷年來累積的配樂作品這麼好聽, ...\n      \n      \n              \n                  表演者:19乐团\n\n              流派:流行\n              发行时间:2011-11-19", "source": "豆瓣", "tags": ["日记", "畏", "向死而生", "表达与语言"]}, {"time": "10月21日", "text": "一直说感觉没有什么事情自己是做不到的 那就一步一步开始做吧 我相信以往学习的看似无用的一切都会变成无形的驱动力 只要我开始努力。\n\n2025年", "source": "豆瓣", "tags": ["自由", "身体", "表达与语言", "自由与束缚", "成为自己"]}, {"time": "2025年10月20日", "text": "不要焦虑\n      \n      \n        \n          情绪最重要", "source": "豆瓣", "tags": ["畏", "身体"]}, {"time": "2025年10月20日", "text": "Short Stay 台北\n            \n            8.3\n      \n      \n      该版本为内地版。\nEP专辑更以“亲切感”、“紧张”、'下雨天\"、\"表情\"、\"陪伴\"、\"...\n      \n      \n              \n                  表演者:袁泉\n\n              流派:流行", "source": "豆瓣", "tags": ["畏"]}, {"time": "10月20日", "text": "我不想要去找到她做错了什么来为我的行为措辞借口 这似乎仅仅是因为我累了我想\n\n2025年", "source": "豆瓣", "tags": ["畏", "他人", "自由", "荒谬与反抗"]}, {"time": "2025年10月20日", "text": "要是这我都逃的了那我就无敌了", "source": "豆瓣", "tags": ["杂多"]}, {"time": "2025年10月20日", "text": "爱自己\n            \n            8.0\n      \n      \n      清爽亮丽的形象，带点淡淡的羞涩──新一代的梦幻“优质”女孩，这或许便是梁咏琪...\n      \n      \n              \n                  表演者:梁咏琪\n\n              流派:流行\n              发行时间:1996-11-11", "source": "豆瓣", "tags": ["他人", "向死而生", "成为自己"]}, {"time": "10月20日", "text": "话少一些，再少一些\n每天，我面对脑海中的你\n对着你说\n走吧，快走吧\n如同小时候在幼儿园门口同母亲告别\n或是过年后看着车窗外送别我们的外婆一般\n想要减少些无谓的幻想\n原谅我没有无畏的勇气\n\n2025年", "source": "豆瓣", "tags": ["他人", "表达与语言"]}, {"time": "10月20日", "text": "我的内心矛盾又纠结\n唯有一件事得到了确定\n早上走出家门呼吸到第一口秋天的空气时\n被带着凉意的风吹拂着时\n我突然想要同她见面\n\n2025年", "source": "豆瓣", "tags": ["被抛", "他人", "身体与活着"]}, {"time": "2025年10月20日", "text": "傻瓜\n            \n            8.0\n      \n      \n      总有一天，全天下只剩下一棵柠檬树\n树下有一只鸭子，还有一群傻瓜\n那简直就是天堂...\n      \n      \n              \n                  表演者:苏慧伦 Tarcy Su\n\n              流派:流行\n              发行时间:1997-08", "source": "豆瓣", "tags": ["日记", "向死而生"]}, {"time": "2025年10月20日", "text": "为什么\n      \n      \n        \n          我喜欢一个人，不喜欢一个人同你有什么大关系。我对喜欢的人有很多话说，有什么不对？你的脾气来自于什么地方？为什么总要把拿这些来跟我和你的友情进行比较然后随意给我灌上一个不把你当朋友的罪名？", "source": "豆瓣", "tags": ["被抛", "他人", "荒谬与反抗", "表达与语言"]}, {"time": "2025年10月20日", "text": "被反反复复反反复复波动的情绪 我累了。不想玩了", "source": "豆瓣", "tags": ["被抛", "畏", "身体"]}, {"time": "2025年10月20日", "text": "十月\n      \n      \n        \n          看完了喜爱的书\n酒气还在\n我骑上车，放了歌\n风从两侧吹过，扑面而来的是秋天的气息\n人们穿着长袖在夜晚穿梭\n路边烧烤摊火焰正翻涌\n仅仅是看着就感受到了一丝热气\n忙碌的店主夫妇边忙着手中的活边与客人交谈着\n年轻人们在旁喝着酒嬉笑\n叶子从我身旁落下\n被风吹动着在地上打滚\n我带着耳机\n思绪如升腾的白烟在空中飘着\n无解的问题似乎消失了\n郁结得到了片刻的歇息", "source": "豆瓣", "tags": ["日记", "被抛", "他人", "荒谬与反抗", "身体与活着"]}, {"time": "2025年10月19日", "text": "为什么你总是阴晴不定\n      \n      \n        \n          你在做什么呢？心里在想着什么呢。", "source": "豆瓣", "tags": ["被抛", "他人", "身体"]}, {"time": "2025年10月19日", "text": "摄影自学书籍\n        \n        \n            34部作品\n            ·\n            16人关注\n        \n        一本本介绍我读过的摄影书籍", "source": "豆瓣", "tags": ["他人"]}, {"time": "2025年10月14日", "text": "s\n      \n      \n        \n          有的时候我真的很希望你能想要了解我。我没有办法适应关系中这么快的转变，但我又没办法拒绝同你聊天。有时候我会觉得自己像一条在你身边随着时间缓慢流动的河流，等着你放下来什么、我全都当宝贝似的佩在身上。\n其实我有时候不知道怎么用你交谈，要如何在一字一句中，掩饰我对你几近疯狂的探索欲。我害怕透露出来一分一毫，越过朋友的边界。我渴望与你聊天，又害怕与你聊天。", "source": "豆瓣", "tags": ["日记", "被抛", "畏", "他人", "荒谬与反抗", "向死而生", "表达与语言", "成为自己"]}, {"time": "2025年10月19日", "text": "不要被语言限制了我的感情\n      \n      \n        \n          情绪复杂，多变\n它自然而然的产生，它先于语言存在，或许也先于思考存在。\n找不到形容的语言知识常态，语言具有局限性，它无法表达我无限的思绪。\n不要说话，不要思考，感受吧。", "source": "豆瓣", "tags": ["被抛", "自由", "身体", "表达与语言"]}, {"time": "2025年10月19日", "text": "我会在什么时候经历死亡？\n      \n      \n        \n          骑着电车听着喜欢的歌回家的路上？\n同知心朋友畅快交谈之后？\n看到她好友申请的那个瞬间？（这句要删掉了）\n感受到陌生人的善意的时候？\n亦或是通宵读完一本喜欢的书籍时？\n我会死在小时候吗？初中时，亦或者幼儿园时。\n死在被爸爸妈妈牵着手走过小区的隧道时，\n亦或者是高中瞒着老师和教导...（全文）", "source": "豆瓣", "tags": ["被抛", "他人", "向死而生"]}, {"time": "2025年10月18日", "text": "10.18\n      \n      \n        \n          好难度过的一星期 感觉全世界都在对我发泄情绪\n本来就因为想要说服自己同s做朋友，心情低落，又被y的许多负面情绪围绕，没办法解决。昨天🐻也开始给我发一些莫名其妙不知道怎么回的话。感觉不回她们在她们眼里我似乎就不配当他们的朋友，我不明白..我无力承受了，我感觉我好累了。\n我不明白s为...（全文）", "source": "豆瓣", "tags": ["日记", "被抛", "畏", "他人", "荒谬与反抗", "向死而生", "身体", "表达与语言", "身体与活着", "成为自己"]}, {"time": "2025年10月18日", "text": "我做错啥了\n      \n      \n        \n          我做错啥了", "source": "豆瓣", "tags": ["荒谬与反抗"]}, {"time": "2025年10月18日", "text": "再来找我发瘟全杀了\n      \n      \n        \n          再来找我发瘟全杀了", "source": "豆瓣", "tags": ["杂多"]}, {"time": "2025年10月17日", "text": "我是否应该不跟她说话\n      \n      \n        \n          一直幻想并不尊重人。\n我能否以情绪波动最小的方式让自己慢慢减少与她的联系？\n说多错多\n慢慢来", "source": "豆瓣", "tags": ["他人", "向死而生", "身体", "表达与语言", "成为自己"]}, {"time": "2025年10月17日", "text": "张玉华:小小幸福\n            \n            8.0\n      \n      \n      详细内容: 01 小小幸福02 圣诞节03 最坏品牌（后弦rap）04 再见我的宝贝     05 单...\n      \n      \n              \n                  表演者:张玉华", "source": "豆瓣", "tags": ["杂多"]}, {"time": "2025年10月17日", "text": "Psychocandy\n            \n            9.0\n      \n      \n      Shoegazing（自赏摇滚）的奠基者The Jesus and Mary Chain的首张专辑，一般也认为...\n      \n      \n              \n                  表演者:The Jesus And Mary Chain\n\n              流派:摇滚\n              发行时间:1985", "source": "豆瓣", "tags": ["日记", "向死而生"]}, {"time": "2025年10月17日", "text": "第一集\n            \n            8.5\n      \n      \n      QSR-002\nRecorded in Earth Tunes Studio\nMixed & Mastered by 11th Floor\nDesigne...\n      \n      \n              \n                  表演者:yourboyfriendsucks!/你男友係碌葛\n\n              流派:摇滚\n              发行时间:2016-05-14", "source": "豆瓣", "tags": ["日记", "他人", "向死而生"]}, {"time": "2025年10月17日", "text": "她的。發光搖擺\n            \n            8.8\n      \n      \n      何欣穗，这个自认为性格矛盾的女生并不漂亮，但她的音乐里电子和摇滚结合得十分漂...\n      \n      \n              \n                  表演者:何欣穗\n\n              流派:摇滚\n              发行时间:2002", "source": "豆瓣", "tags": ["他人", "向死而生", "身体与活着"]}, {"time": "2025年10月17日", "text": "属于自己\n            \n            8.2\n      \n      \n      来自新加坡的新人张玉华，是环球继许慧欣之后力捧的漂亮美眉。一百七十三公分、面...\n      \n      \n              \n                  表演者:张玉华\n\n              流派:流行\n              发行时间:2002", "source": "豆瓣", "tags": ["他人", "向死而生", "身体与活着", "成为自己"]}, {"time": "2025年10月17日", "text": "张玉华 同名专辑\n            \n            8.6\n      \n      \n      从FREE开始\n一个来自新加坡的女生--张玉华，开启华人流行音乐新视野。\n张玉华，一...\n      \n      \n              \n                  表演者:张玉华\n\n              流派:流行\n              发行时间:2002", "source": "豆瓣", "tags": ["日记", "他人", "向死而生"]}, {"time": "2025年10月17日", "text": "时间\n      \n      \n        \n          早些很喜欢q的时候一直在想，我什么时候会不喜欢她呢？我们什么时候才会不联系呢？我好像完全不相信这一天会到来，甚至无法想象出这一天到来的模样。         流派:流行\n              发行时间:2014-12-26", "source": "豆瓣", "tags": ["日记", "被抛", "向死而生"]}, {"time": "2025年9月11日", "text": "惊叹号\n            \n            6.5\n      \n      \n      靠自己创作跑道才是王道！\n20!!周杰伦第!!号作品【惊叹号】\n炫技玩乐出神入化满载...\n      \n      \n              \n                  表演者:周杰伦\n\n              流派:流行\n              发行时间:2011-11-11", "source": "豆瓣", "tags": ["日记", "向死而生", "成为自己"]}, {"time": "2025年9月11日", "text": "十二新作\n            \n            7.7\n      \n      \n      当时光敲第12响时，是该听周杰伦的时候了…\n周杰伦2012最新专辑 「十二新作」\n2012...\n      \n      \n              \n                  表演者:周杰伦\n\n              流派:流行\n              发行时间:2012-12-28", "source": "豆瓣", "tags": ["日记", "向死而生", "身体与活着"]}, {"time": "10月21日", "text": "sylvan 转发：\n\n我悟了。\n\nsylvan 说：\n\n生活蹂躏我可是我是一只狸猫我只会喊救命", "source": "豆瓣", "tags": ["他人", "表达与语言", "身体与活着"]}, {"time": "10月20日", "text": "sylvan 转发：\n\n所以还是学好雅思吧（x\n\nsylvan 说：\n\n忐忑不安的星球 四季无序的轮换 未来模糊不定 想法混乱不堪 唯有抓住表达，学会承受", "source": "豆瓣", "tags": ["畏", "荒谬与反抗", "向死而生", "表达与语言"]}, {"time": "10月20日", "text": "忐忑不安的星球 四季无序的轮换 未来模糊不定 想法混乱不堪 唯有抓住表达，学会承受", "source": "豆瓣", "tags": ["畏", "荒谬与反抗", "向死而生", "表达与语言"]}, {"time": "10月19日", "text": "走一步又摔一步～～\n\n无数次漫长的等待\n反复的难捱\n无数次看朦胧的未来\n虚妄的明天\n我永远无法真正的只有现在\n总是感到失望\n对自己或是对其他\n悲哀的心情总是周而复始\n责怪自己的坏习惯还是改不了\n想要做的事情\n真的有完成的那天吗\n这么多伟大的梦想\n真的可以实现吗\n问题还有很多很多\n可是生活还是在一步一步向前走", "source": "豆瓣", "tags": ["被抛", "他人", "自由", "荒谬与反抗", "向死而生", "身体", "身体与活着", "成为自己"]}, {"time": "10月19日", "text": "10.19\n\n思绪是一团混乱的毛线，我每天都在里面穿梭又穿梭", "source": "豆瓣", "tags": ["日记"]}, {"time": "10月7日", "text": "读懂小说作品是否应当感受先行，分析在后？\n\n当我说我想要看懂一个作家写的故事，我是在说想要看懂她的什么？\n这有点类似于我想要看懂她想表达的东西。其中含括她想讲述的故事，故事中所包含的她的精神和思想。（若是有）\n1.首先我想在这里先做出一个分野，即先讨论是否每一个故事都含括一个所谓来自作者的，并“可被获取”思想。\n...（全文）", "source": "豆瓣", "tags": ["被抛", "他人", "自由", "表达与语言"]}, {"time": "9月16日", "text": "去年秋天我怎么也在搞这些", "source": "豆瓣", "tags": ["向死而生"]}, {"time": "5月22日", "text": "人只要还在与其他人接触，就会被社会所影响。所以 社会风气低迷浮躁，人的性子也会随着改变。我很难断定一个人的行为有多少成分是因社会影响，有多少成分是因为她们本就这样，这些都混在一起了。所以根本不能够根据一个人以前的行为去判断她的现在，人每时每刻都会在改变。时代变化太快了。\n请...（全文）", "source": "豆瓣", "tags": ["被抛", "他人", "自由", "荒谬与反抗", "身体与活着", "成为自己"]}, {"time": "5月18日", "text": "既然未来还有无尽烦恼 就少一点为现在的烦恼感到苦恼", "source": "豆瓣", "tags": ["向死而生"]}, {"time": "4月29日", "text": "如何在保持自我的同时跟他人恋爱？\n\n我想在被困扰的当下就是思考这个问题的最好时机。需要确定的是我要做的并非是当下尊严放低姿态去迎合对方的需求。而是在理解对方的同时又能够达到自洽。\n我在情绪价值上应当做到自给自足，不应当过分依赖对方给我些什么。对于任何人也许都要随时保持一种边界感，并非一定需要依赖某一个特定的...（全文）", "source": "豆瓣", "tags": ["被抛", "他人", "自由", "荒谬与反抗", "身体", "无意义与意义", "成为自己"]}, {"time": "4月3日", "text": "天津4.2\n\n天津的春天是光秃秃的树和好看的花，时不时的冷空气和加绒的卫衣。\n天津有很多女性从事体力活动，街上也可以看到很多老奶奶爷爷出来溜圈，给对方拍照，大家似乎都很有活力。\n去到五大道，海棠花很好看，但有特别多的人，交通路况不太好，带来了些许心烦。踩车到人民公园，零零散散的也有几颗会开...（全文）", "source": "豆瓣", "tags": ["他人", "自由", "女人与他者", "身体与活着"]}, {"time": "3月21日", "text": "面对无法改变的 社会结构带来的不公 应该怎么做\n\n等会写", "source": "豆瓣", "tags": ["被抛", "自由", "表达与语言"]}, {"time": "3月15日", "text": "尚好的青春\n\n前几年少听孙燕姿 前段时间迷上了 把克卜勒这张专反反复复的听。某天收拾抽屉看到前妻姐给我写的信，抄了一整段孙燕姿的歌词。正好是尚好的青春我常哼唱的那段", "source": "豆瓣", "tags": ["向死而生", "表达与语言"]}, {"time": "2月9日", "text": "2.9\n\n我真的是有点好奇到底为什么这种感觉又回来了？是什么东西在作祟？还是课堂给我带来的焦虑在加持？\n当下要紧的事情是把s从我的脑子里赶出去，我真的是一点也受不了了。我是不是疯子来的。为什么改变不了，爹的，真想给自己一巴掌。整得我好烦躁。\n别给她发信息了，实在不行就逃避一段时间吧。我觉...（全文）", "source": "豆瓣", "tags": ["日记", "被抛", "畏", "他人", "自由", "向死而生", "身体", "成为自己"]}, {"time": "2月8日", "text": "郑州\n\n从河南博物馆的出口出来，猝不及防的看到了郑州的雪。也许是因为根本没有预想到会看到这场雪，所以我愣在原地好几分钟，甚至有点不知所措，然后才回过神来拍视频记录。\n打开天气预报看着上面显示郑州“小雪”，但由于我是一个二十二年没有看过雪的南方孩子，这是我人生中看过最大的雪。从这个...（全文）", "source": "豆瓣", "tags": ["他人", "身体与活着"]}, {"time": "1月14日", "text": "我要改变世界改变自己～\n\n1.13/1.14 2026\n考完试之后明显松懈了下来 但备考给我遗留下了一丝看书的习惯 最近学习上瘾 也许是因为能够切实的感受到知识的积累。\n今天看了法律人类学，感觉还是蛮有意思，也许能成为我以后的研究方向呢？把自主看完之后看合同法和金翼，接着也许是法律的概念？或者是婚姻继承法相关的，或许婚姻继承应该放在自主后面看呢，毕竟好像概念有相关的地方。反正也不长的", "source": "豆瓣", "tags": ["被抛", "畏", "他人", "自由", "身体", "表达与语言", "自由与束缚", "身体与活着", "成为自己"]}, {"time": "1月8日", "text": "能抱拥便抱拥", "source": "豆瓣", "tags": ["杂多"]}, {"time": "12月31日", "text": "12.31\n\n带着茫然提笔想要总结这一年，看着日期翻相册才发现这么多事原来都发生在今年，还以为是好久以前了。还记得得知死亡搁浅和怪奇物语在2025发布的时候，我还觉得2025是一个好遥远的年份，现在认真想起来的时候，发现2025原来都已经要过完了。24年的我对25年发布的怪奇物语和死亡搁浅充满了期待，结果...（全文）\n\n2025年", "source": "豆瓣", "tags": ["日记", "被抛", "荒谬与反抗", "向死而生"]}, {"time": "12月28日", "text": "写作最重要的不是辞藻而是思想\n\n2025年", "source": "豆瓣", "tags": ["表达与语言"]}, {"time": "12月25日", "text": "如果后悔和愧疚能解决问题的话那人都不会有啥烦恼了\n\n2025年", "source": "豆瓣", "tags": ["畏", "他人", "荒谬与反抗"]}, {"time": "12月25日", "text": "是不是降低自己的表达欲才能更好的同人交流\n\n2025年", "source": "豆瓣", "tags": ["他人", "表达与语言", "成为自己"]}, {"time": "12月25日", "text": "我为什么不能拥有极端的情绪？\n\n塑造完外面的我我要慢慢开始建立里面的我\n\n2025年", "source": "豆瓣", "tags": ["被抛", "自由", "向死而生", "身体"]}, {"time": "12月21日", "text": "滚滚滚滚滚滚滚滚滚滚滚滚滚滚滚滚滚滚滚滚滚滚滚\n\n2025年", "source": "豆瓣", "tags": ["杂多"]}, {"time": "12月21日", "text": "焦虑是常态\n忍耐是常态\n不开心是常态\n\n2025年", "source": "豆瓣", "tags": ["畏"]}, {"time": "12月21日", "text": "常态常态常\n\n2025年", "source": "豆瓣", "tags": ["杂多"]}, {"time": "12月20日", "text": "为什么总是做不到我想做到\n\n2025年", "source": "豆瓣", "tags": ["被抛", "自由"]}, {"time": "12月18日", "text": "你想要听我说什么 我便都说了\n\n2025年", "source": "豆瓣", "tags": ["他人", "表达与语言"]}, {"time": "12月14日", "text": "是小孩来的\n\n2025年", "source": "豆瓣", "tags": ["杂多"]}, {"time": "12月13日", "text": "跨年看什么电影好….\n\n2025年", "source": "豆瓣", "tags": ["杂多"]}, {"time": "12月12日", "text": "好没劲..\n\n2025年", "source": "豆瓣", "tags": ["杂多"]}, {"time": "12月12日", "text": "藏\n\n2025年", "source": "豆瓣", "tags": ["杂多"]}, {"time": "12月12日", "text": "疑惑\n\n真的不知道我在你心里到底算得上是什么。\n好似做什么都不用顾及我的心情。\n\n2025年", "source": "豆瓣", "tags": ["他人", "身体"]}, {"time": "12月12日", "text": "人可以形式主义，但也不能太过于形式主义的\n\n2025年", "source": "豆瓣", "tags": ["他人", "自由"]}, {"time": "12月11日", "text": "现代人类为何如此渴望爱？\n\n今晚写\n\n2025年", "source": "豆瓣", "tags": ["他人", "表达与语言"]}, {"time": "12月9日", "text": "我会一直看一直写一直看一直写直到我的文笔得到提升。\n\n2025年", "source": "豆瓣", "tags": ["表达与语言"]}, {"time": "12月8日", "text": "不要过于依赖以至于滥用美好\n\n2025年", "source": "豆瓣", "tags": ["杂多"]}, {"time": "12月8日", "text": "减少决策前的思考时间可以坚定信念\n\n2025年", "source": "豆瓣", "tags": ["自由", "向死而生"]}, {"time": "12月7日", "text": "不要啊..\n\n2025年", "source": "豆瓣", "tags": ["杂多"]}, {"time": "12月7日", "text": "日子充实幸福得无时间抬笔记录 梦一般美好\n\n2025年", "source": "豆瓣", "tags": ["向死而生", "身体与活着"]}, {"time": "12月6日", "text": "朋友是无用的\n\n2025年", "source": "豆瓣", "tags": ["他人"]}, {"time": "12月6日", "text": "经历的每一刻都在造就我\n\n2025年", "source": "豆瓣", "tags": ["杂多"]}, {"time": "12月5日", "text": "内心除了狗屎只有泥土是怎么样都种不出花来的。\n\n2025年", "source": "豆瓣", "tags": ["杂多"]}, {"time": "12月5日", "text": "人和人沟通怎么会这么费劲？\n\n2025年", "source": "豆瓣", "tags": ["他人", "表达与语言"]}, {"time": "12月4日", "text": "尊重是理解的前提\n\n2025年", "source": "豆瓣", "tags": ["他人"]}, {"time": "12月4日", "text": "将说不出口的话记录下来总会有用武之地\n\n2025年", "source": "豆瓣", "tags": ["表达与语言"]}, {"time": "12月4日", "text": "sylvan 收藏小组讨论到豆列 随笔\nsylvan 说：\n春雨里洗过的太阳\n\n歌曲好像总是能承载一部分的记忆，每次一听到这首歌就想到跟czq去长隆那天。那段时间刚跟hi7姐断了联系，也许是因为自己想玩，也许也有因为想要安慰我，czq答应了跟我一起去长隆。 我们起了个大清早，穿着厚厚的外套，带着雨衣和一点吃的，打车去景区。临上车前我去买了杯煮的咖啡，忘了最后有没有...（全文）\n\n2025年", "source": "豆瓣", "tags": ["向死而生", "表达与语言", "成为自己"]}, {"time": "12月4日", "text": "沉默是我无用的武器\n\n2025年", "source": "豆瓣", "tags": ["表达与语言"]}, {"time": "12月4日", "text": "朋友\n\n我发现朋友真的是一个很浪漫的词。 友在字典上的意思是“ 关系密切、有交情的人”；在日常使用中，我们经常也把“一起做….事”的人称为友，就比如饭友，笔友。而“朋”为月月，如此一来，朋友就是一起“从一个月亮走向另一个月亮”的人 希望能跟我的朋友们一起看上数不清次数的月升月落。\n\n2025年", "source": "豆瓣", "tags": ["他人", "身体与活着"]}, {"time": "12月4日", "text": "我是流水， 是任植被生长的山坡， 是携带万千生物吹拂的微风。 我亦可以成为落在森林里的雨水， 照向大地的太阳， 潮湿的土壤。\n\n2025年", "source": "豆瓣", "tags": ["被抛", "自由", "身体与活着"]}, {"time": "12月4日", "text": "闭上眼睛 我可以看到烟火绽放，看到夜空繁星闪烁 看到雨后黄叶飘落，看到鹅毛大雪盖满大地。 看见树，看见海，看见太阳东升西落 看见光，看见风，看见紫外羽色 我的世界五彩斑斓\n\n2025年", "source": "豆瓣", "tags": ["被抛", "自由", "身体与活着"]}, {"time": "12月4日", "text": "春雨里洗过的太阳\n\n歌曲好像总是能承载一部分的记忆，每次一听到这首歌就想到跟czq去长隆那天。那段时间刚跟hi7姐断了联系，也许是因为自己想玩，也许也有因为想要安慰我，czq答应了跟我一起去长隆。 我们起了个大清早，穿着厚厚的外套，带着雨衣和一点吃的，打车去景区。临上车前我去买了杯煮的咖啡，忘了最后有没有...（全文）\n\n2025年", "source": "豆瓣", "tags": ["向死而生", "成为自己"]}, {"time": "12月4日", "text": "我会在什么时候经历死亡？\n\n骑着电车听着喜欢的歌回家的路上？ 同知心朋友畅快交谈之后？ 看到她好友申请的那个瞬间？（这句要删掉了） 感受到陌生人的善意的时候？ 亦或是通宵读完一本喜欢的书籍时？ 我会死在小时候吗？初中时，亦或者幼儿园时。 死在被爸爸妈妈牵着手走过小区的隧道时， 亦或者是高中瞒着老师和教导...（全文）\n\n2025年", "source": "豆瓣", "tags": ["被抛", "他人", "向死而生"]}, {"time": "12月4日", "text": "回忆\n\n关于秋天的记忆好像多和成都有关，满地的黄叶，凉爽的秋风，耳机里方大同的歌，和朋友漫无目的的走，拿着相机随意的拍照，手上或是提着冰粉，或是捧着热乎乎的蛋烘糕，芝麻白糖味的、我们肆意的聊天。我仍记得那年秋在成都看到的下午的阳光，透过银杏撒在马路上；时不时也会照在经过的公交车的玻璃...（全文）\n\n2025年", "source": "豆瓣", "tags": ["畏", "他人", "无意义与意义", "表达与语言", "身体与活着"]}, {"time": "12月4日", "text": "sylvan 收藏小组讨论到豆列 思考\nsylvan 说：\n嘴巴并不是表达人类感情的唯一工具\n\n最近因为s的事情郁郁寡欢，但也正因为如此看到了身边朋友的好。 lzr在我发一些负面情绪的时候通常不会说什么，我很能理解，但我时不时还是会觉得有点难过，这无可避免呀。不过她会在出去玩的时候给我买手链，给我买纪念品，我觉得好感动。 x也会在我不开心的时候坐在我身边，听我叨叨絮絮的说一些...（全文）\n\n2025年", "source": "豆瓣", "tags": ["日记", "畏", "他人", "荒谬与反抗", "身体", "表达与语言"]}, {"time": "12月4日", "text": "存在先于本质\n\n如此急切的想要去定义每一段关系 关系是因为交流而存在，又不是因为定义而存在，何必非要给一段关系贴上标签。突然感觉好朋友和朋友的分级又是一种很虚妄的东西，“她是我的好朋友所以我可以为她做这件事”这种逻辑思维真的正确吗？且不说好朋友这个词的界限在我心中本就模糊，我做任何事情难道不...（全文）\n\n2025年", "source": "豆瓣", "tags": ["他人", "自由", "荒谬与反抗", "身体", "表达与语言"]}, {"time": "12月4日", "text": "嘴巴并不是表达人类感情的唯一工具\n\n最近因为s的事情郁郁寡欢，但也正因为如此看到了身边朋友的好。 lzr在我发一些负面情绪的时候通常不会说什么，我很能理解，但我时不时还是会觉得有点难过，这无可避免呀。不过她会在出去玩的时候给我买手链，给我买纪念品，我觉得好感动。 x也会在我不开心的时候坐在我身边，听我叨叨絮絮的说一些...（全文）\n\n2025年", "source": "豆瓣", "tags": ["畏", "他人", "荒谬与反抗", "身体", "表达与语言"]}, {"time": "12月4日", "text": "并不是所有的问题都有解决的办法\n\n我想这个结论我在上半学期经历外公和方大同去世就已经得出来了，但好像最近才开始慢慢的开始有了更深刻的理解。 我每日思绪万千，时常盼望奇迹会发生在我的身上，我期盼转折的发生，期盼自己一下变成厉害大人物，期盼s的态度发生转变。 不会的。 无论海浪如何在我内心翻涌，时间总是会有条不紊地...（全文）\n\n2025年", "source": "豆瓣", "tags": ["他人", "自由", "荒谬与反抗", "向死而生", "成为自己"]}, {"time": "12月4日", "text": "理解是宝物\n\n最近时常会觉得自己的一些表达，一些做法会被别人误解，然后就为此感到些许的烦躁和焦虑。回想起来这种焦虑毫无意义。 无论怎么样，我没办法去控制别人的思想，没办法去改变别人看待我的方式，外界的东西我终归是没有能力去掌控的。每个人都是根据自己内心独有的判断标准去评判他人，这有什么错。...（全文）\n\n2025年", "source": "豆瓣", "tags": ["被抛", "畏", "他人", "自由", "荒谬与反抗", "无意义与意义", "表达与语言", "成为自己"]}, {"time": "12月4日", "text": "我要在多大程度上改变自己以便跟人相处\n\n我本来是在思考这个问题，但我发现根本问题是我本来就不应该用同样的相处方式对待所有人，这本身是不是就是一种对他人个性的不尊重。 我一直想要做到的其实是在尊重他人的同时最大限度的做我自己，我是想要尊重他人的。如果我理所应当的认为别人不会对我这句话感到不适，那么也是在预设她的性格。...（全文）\n\n2025年", "source": "豆瓣", "tags": ["他人", "自由", "荒谬与反抗", "成为自己"]}, {"time": "12月4日", "text": "不要被语言限制了我的感情\n\n情绪复杂，多变 它自然而然的产生，它先于语言存在，或许也先于思考存在。 找不到形容的语言知识常态，语言具有局限性，它无法表达我无限的思绪。 不要说话，不要思考，感受吧。\n\n2025年", "source": "豆瓣", "tags": ["被抛", "自由", "身体", "表达与语言"]}, {"time": "12月4日", "text": "看书\n\n我喜欢酒后看书，逐渐认识到看书其实不需要太多的理性。我不能在现实完完全全理解一个人的思想，那我又为何觉得能从文字中完全看透作者所表达的意思呢？未免过于自大。有些文字或许只需要看表象，过度思考会加深我阅读的困难\n\n2025年", "source": "豆瓣", "tags": ["他人", "荒谬与反抗", "表达与语言"]}, {"time": "12月4日", "text": "找到目标\n\n我觉得有些时候还是得知道自己不想要什么，想要什么，才能让我不要一昧的顺从别人以至于丢失自己。就比如现在，我想要学，我想要进步，玩只是放松。\n\n2025年", "source": "豆瓣", "tags": ["他人", "自由", "成为自己"]}, {"time": "12月4日", "text": "在相对可控的范围内订立目标\n\n我在这里把可控定义我可以支配自己去做且知道自己完成了 比如我看完了一本书，写完了一篇论文，少吃一个面包，这些都是我可以即时知道结果的事实行为，如果单单将其从日常生活中提取出看的话这似乎并不难完成。 那么阻扰我的是什么呢，是在其背后我急于求成想要达成的一个不能即时看到结果的大成...（全文）\n\n2025年", "source": "豆瓣", "tags": ["自由", "荒谬与反抗", "表达与语言", "自由与束缚", "身体与活着", "成为自己"]}, {"time": "12月4日", "text": "sylvan 收藏小组讨论到豆列 日记\nsylvan 说：\n\n12.3 结果今天还是没看完刑诉法的书，还差个一点，但还好心情不错。 把微信通知关了，发现这是一个减少分心的大好方法。被迫的打开微信总让我有一种被支配感。 明天环境法课把柏拉图的会饮篇看完看看能不能开始写经济法论文了。晚上的音乐鉴赏课把鉴赏的小作文写了，回去的大巴上也还能看书。 我要不断看书看书看书和进步进步进步！\n\n2025年", "source": "豆瓣", "tags": ["被抛", "自由", "向死而生", "身体", "表达与语言", "自由与束缚"]}, {"time": "12月4日", "text": "12.3 结果今天还是没看完刑诉法的书，还差个一点，但还好心情不错。 把微信通知关了，发现这是一个减少分心的大好方法。被迫的打开微信总让我有一种被支配感。 明天环境法课把柏拉图的会饮篇看完看看能不能开始写经济法论文了。晚上的音乐鉴赏课把鉴赏的小作文写了，回去的大巴上也还能看书。 我要不断看书看书看书和进步进步进步！\n\n2025年", "source": "豆瓣", "tags": ["日记", "被抛", "自由", "向死而生", "身体", "表达与语言", "自由与束缚"]}, {"time": "12月3日", "text": "以年为单位订立目标…\n\n2025年", "source": "豆瓣", "tags": ["杂多"]}, {"time": "12月2日", "text": "没有负责任的义务！\n\n2025年", "source": "豆瓣", "tags": ["杂多"]}, {"time": "12月2日", "text": "10.8 晴\n\n最近生活有些丰富 到现在才想起提笔记录 国庆的晚上一直在跟lzr四处游荡，到了五六点骑着电瓶车去吃夜宵，或是买现炸的油条，然后慢悠悠的回家，一觉睡到中午，不为什么的消耗时间，这样的生活让我很舒适。 早上我会花时间看书，或是去听听b站上的那节课，学习知识的同时练习下英文，然后背...（全文）\n\n2025年", "source": "豆瓣", "tags": ["日记", "被抛", "他人", "向死而生", "表达与语言", "自由与束缚", "身体与活着"]}, {"time": "12月2日", "text": "10.23\n\n我又失败了\n\n2025年", "source": "豆瓣", "tags": ["日记"]}, {"time": "12月2日", "text": "11.10\n\n似乎从不好的情绪中爬出来了一点，不知道哪个瞬间突然茅塞顿开，心情通畅了一些。 感觉自己过得更加的小心翼翼，防止自己将思考投入一些无意义的内耗方向中，在有一些苗头的时候就及时将其切断了，这是好的。 深度思考是一个好习惯，但我不应该把它投入到会影响我情绪的问题里。每时每刻不断的思...（全文）\n\n2025年", "source": "豆瓣", "tags": ["日记", "荒谬与反抗", "身体", "无意义与意义", "成为自己"]}, {"time": "12月2日", "text": "11.20\n\n时间过得好快 我想我需要不断的提醒自己抓紧时间摄取知识 搭积木搭积木搭积木搭上去吧 开始做的时候不要想目标\n\n2025年", "source": "豆瓣", "tags": ["日记", "自由", "向死而生", "成为自己"]}, {"time": "12月2日", "text": "2025.9.25 阴\n\n一切似乎恢复原状，好快。 可能是因为睡眠有压力，昨晚一晚上没睡好，才睡了两个多小时，早上起来心情差，也什么也没吃。选了一天还是选回了一开始那把琴，我好容易纠结。上了一整天的课，今晚在学校听了一个多小时难听的音乐剧，结果走了才发现忘记签到，哎，不想细想。又扣好多分。 今晚...（全文）\n\n2025年", "source": "豆瓣", "tags": ["畏", "荒谬与反抗", "身体", "自由与束缚"]}, {"time": "昨天", "text": "2025.9.26 晴\n\n本来今天不想写了，想了想能坚持一天是一天，像练字一样。今天练了字也背了英语单词，也算是做了点正事。话说", "source": "豆瓣", "tags": ["荒谬与反抗", "表达与语言"]}, {"time": "12月2日", "text": "补10.1 晴\n\n早上去深圳找朋友玩，走了很多路，有点意思，但不算特别有意思。6块钱买了一本《文明与缺憾》和20块钱一张专辑，捡到便宜了！说真的我最感谢她给我带来了这么有意思的兴趣爱好。 今天看了《当我在一个仲夏清晨出走》。是一本特别厌女的书，但里面的比喻我感觉倒是有点意思。忍着恶心劲看完了。之后...（全文）\n\n2025年", "source": "豆瓣", "tags": ["他人", "身体", "表达与语言"]}, {"time": "12月2日", "text": "2025.9.24 雨\n\n突然觉得自己应该尝试每天用长段文字记录下自己的感受和每日心情。也许这样可以更好地帮助我梳理思绪。 今晚突然心情很亢奋，我描述不出来这种感觉，这不是一种快乐的亢奋，它似乎有点接近空虚。躺在床上打着游戏思来想去，是不是因为我缺少成就感？是不是因为我总是把目标定得太大而自己又...（全文）\n\n2025年", "source": "豆瓣", "tags": ["自由", "身体", "表达与语言", "成为自己"]}, {"time": "12月2日", "text": "12.1/2\n\n十二月快乐 虽然有数不尽的考试 经济法ddl在下周..我怎么才发现？看了看题目发现之前自己学的知识可以派上用场，应该不难写。感觉如果我不怕的话什么都能做得到。最近感觉自己信心勇气倍增，不知道什么原因导致\n\n2025年", "source": "豆瓣", "tags": ["日记", "自由", "荒谬与反抗", "身体", "表达与语言", "自由与束缚", "成为自己"]}, {"time": "12月2日", "text": "今天虽然没有看完一本书 但是遇到了聊的很来的朋友 真好。\n\n2025年", "source": "豆瓣", "tags": ["他人"]}, {"time": "12月2日", "text": "11.30\n\n今晚本来打算先去和44逛公园什么的，再和小洪去小疯鸟复习，结果莫名其妙又心烦意乱起来。跟qb聊了聊，我发现我自己无法接受我在讨厌一个人某一个点的同时又愿意跟她聊天。 qb说这很正常，真的吗。有时候会跟朋友说另一个朋友的不是，但是还是会在她下一次求助我的时候回她的消息，或者时不时也想...（全文）\n\n2025年", "source": "豆瓣", "tags": ["日记", "被抛", "他人", "荒谬与反抗", "表达与语言", "成为自己"]}, {"time": "12月2日", "text": "我把日记都写在这里好了\n\n无论长短都是当日心情的纪录\n\n2025年", "source": "豆瓣", "tags": ["身体", "表达与语言"]}, {"time": "12月2日", "text": "12.1/2\n\n十二月快乐 虽然有数不尽的考试\n经济法ddl在下周..我怎么才发现？看了看题目发现之前自己学的知识可以派上用场，应该不难写。感觉如果我不怕的话什么都能做得到。最近感觉自己信心勇气倍增，不知道什么原因导致\n\n2025年",
