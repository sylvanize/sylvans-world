我到底为什么总是不开心？我感觉我真的是尽力了。最近脑子里想的东西总是乱七八糟，搞不懂自己的情绪到底出了什么问题，清醒着的时候思想就好像掉进了一个很深很深的海里。其实刚刚就有在想我会不会是被那些事情影响了情绪，但我现在又觉得不是了。\n也有可能是我的身体本身就在不断的生产一些负面...（全文）\n\n2025年", "source": "豆瓣", "tags": ["日记", "被抛", "荒谬与反抗", "身体", "成为自己"]}, {"time": "11月8日", "text": "被误会不好受\n\n2025年", "source": "豆瓣", "tags": ["被抛"]}, {"time": "11月8日", "text": "想成为世界的旁观者\n\n2025年", "source": "豆瓣", "tags": ["被抛", "身体与活着"]}, {"time": "昨天", "text": "11.6/11.5\n\n昨日跟lzr在车上讨论社交问题，她要跟我们去吃鸡煲，我在群里问大家会不会尴尬。44和hong都说了不会，t没有发话。我问lzr是不是应该私聊去问问t，她说了一句“你好敏感”。\n我当下的第一反应是想到正好", "source": "豆瓣", "tags": ["日记", "他人", "荒谬与反抗", "表达与语言"]}, {"time": "11月6日", "text": "sylvan 转发：\n\n那我是不是应当练就一种即使有认识的人也能在意识层面当他们不存在的技能？\n\nsylvan 说：\n随想\n\n突然发现her吧吸引我之处除了那个适宜阅读的位置还因为我在那没有认识的人。也即是说我可以做自己，这点真的是难能可贵。 回想起来我也许还喜欢用一个完全旁观者的身份去观察那里形形色色的女性？ 跟那里的人建立了太多的联系之后那个地方似乎就失去了对我的吸引力，因为我现在身在其中了。哎我真...（全文）\n\n2025年", "source": "豆瓣", "tags": ["日记", "他人", "自由", "荒谬与反抗", "表达与语言", "女人与他者", "成为自己"]}, {"time": "11月6日", "text": "随想\n\n突然发现her吧吸引我之处除了那个适宜阅读的位置还因为我在那没有认识的人。也即是说我可以做自己，这点真的是难能可贵。 回想起来我也许还喜欢用一个完全旁观者的身份去观察那里形形色色的女性？ 跟那里的人建立了太多的联系之后那个地方似乎就失去了对我的吸引力，因为我现在身在其中了。哎我真...（全文）\n\n2025年", "source": "豆瓣", "tags": ["他人", "自由", "荒谬与反抗", "表达与语言", "女人与他者", "成为自己"]}, {"time": "11月6日", "text": "人在自己不愿意的时候是不会被改变的\n\n真的吗，人在被改变的时候真的会意识到自己在变化中吗？观点还是不能太绝对，应当注重个体化差异。我在被改变的时候其实是无意识居多，改变完成了才反应过来自己原来变了那么多。我认为我的个性以及想法都是跟着生活的进程不断的进行变化的，\n\n2025年", "source": "豆瓣", "tags": ["被抛", "他人", "自由", "身体与活着", "成为自己"]}, {"time": "11月6日", "text": "不应当用二分法解决所有问题\n\n1\n\n2025年", "source": "豆瓣", "tags": ["荒谬与反抗"]}, {"time": "昨天", "text": "11.5想到就写了\n\n昨晚睡的很好，今早起来又听了《跟着感觉走》强制开机。\n最近几天过的很梦幻，一点作业没做，跟不熟悉的人见了两三天,感觉能量有点被消耗。", "source": "豆瓣", "tags": ["日记", "被抛", "他人", "身体", "表达与语言"]}, {"time": "11月3日", "text": "我到底在害怕什么\n\n为什么我现在跟t交流会带着一丝的慌乱，是因为我被她表现出来的冷漠吓到了吗？我在害怕什么？？害怕被她讨厌吗？但她与我生活并无交集呀，就算不联系我也不会失去什么？我感觉我也不是对她有任何超过朋友的好感吧..\n这情绪让我真有些烦了，我得想点办法切段跟她的交流\n\n2025年", "source": "豆瓣", "tags": ["被抛", "畏", "他人", "荒谬与反抗", "身体", "身体与活着"]}, {"time": "11月3日", "text": "约翰与洋子\n\n第一次听到这首歌好像是在认真上完急救科坐上巴士赶回广州和lzr吃鸡煲的途中。我穿着蓝色的牛仔长裤，那似乎也是一个秋。阳光从窗外洒进来，照的我有些睁不开眼睛。我坐在倒转的公交车座位上，看着路上放学的小孩和被太阳照的闪闪发光的海面。而耳边响起的歌唱着“几多俊俏的山岭，都攀过去”，众多...（全文）\n\n2025年", "source": "豆瓣", "tags": ["被抛", "向死而生", "身体与活着"]}, {"time": "11月2日", "text": "11.1/2\n\n我觉得我在一个人面前需要在多大程度上的不做自己决定了这个人在我心里的分量和我对和她相处的喜爱程度。而我对“做自己”的定义是“最让我感到舒适的一种状态。”这么来说我其实是最喜欢独处，其次应该是和lzr相处。\nlzr和t不同之处在于我跟t交流我偏向于从她的人生经历学到点什么，一些被我下意...（全文）\n\n2025年", "source": "豆瓣", "tags": ["日记", "被抛", "他人", "身体", "表达与语言", "身体与活着", "成为自己"]}, {"time": "11月2日", "text": "她好像并无想象中有意思\n\n2025年", "source": "豆瓣", "tags": ["他人"]}, {"time": "10月28日", "text": "休息一会再变强\n\n2025年", "source": "豆瓣", "tags": ["杂多"]}, {"time": "10月28日", "text": "朋友\n\n我发现朋友真的是一个很浪漫的词。\n友在字典上的意思是“ 关系密切、有交情的人”；在日常使用中，我们经常也把“一起做….事”的人称为友，就比如饭友，笔友。而“朋”为月月，如此一来，朋友就是一起“从一个月亮走向另一个月亮”的人\n希望能跟我的朋友们一起看上数不清次数的月升月落。\n\n2025年", "source": "豆瓣", "tags": ["他人", "身体与活着"]}, {"time": "10月28日", "text": "记录一下灵感\n\n2025年", "source": "豆瓣", "tags": ["杂多"]}, {"time": "10月27日", "text": "些许的焦虑感是我需要的\n\n2025年", "source": "豆瓣", "tags": ["畏"]}, {"time": "10月26日", "text": "我是否过于自满？\n\n要寻找一个中间的道路，不要太极端。\n\n2025年", "source": "豆瓣", "tags": ["杂多"]}, {"time": "10月24日", "text": "算了 也许她也是第一次遇到这样的状况\n\n2025年", "source": "豆瓣", "tags": ["他人"]}, {"time": "10月24日", "text": "无题\n\n我其实很自豪自己在极度情绪化的时候也下意识地做到了尊重她人的主体性，这个道理似乎也融入到了我的血液里。回过头来发现这件事，突然很开心。太好了，我做到了。\n最近学的课，看的书都让我更有相信自己的勇气。不受大众观念所裹挟，不被三夫之言所影响，不相信有我做做不到的事情，我希望我可以...（全文）\n\n2025年", "source": "豆瓣", "tags": ["被抛", "他人", "自由", "身体", "成为自己"]}, {"time": "10月24日", "text": "喜欢的人拼命想和我做朋友 想做朋友的拼命以为我喜欢她😂\n\n2025年", "source": "豆瓣", "tags": ["他人"]}, {"time": "10月24日", "text": "哎快从我的生活离开吧\n\n2025年", "source": "豆瓣", "tags": ["身体与活着"]}, {"time": "10月23日", "text": "我操终于\n\n2025年", "source": "豆瓣", "tags": ["杂多"]}, {"time": "10月23日", "text": "终于无事一身轻\n\n2025年", "source": "豆瓣", "tags": ["杂多"]}, {"time": "10月23日", "text": "10.22\n\n今天课堂上的都不错，雅思作业也有在认真的完成几篇，晚上也有在上课。总体下来其实也算不错。\n晚上x说好喜欢我这个朋友，听到了好开心，我跟各种人炫耀。好感动。好感动，她跟我说的话让我有种“被看到了”的感觉。我想也许y也并没有那么烦人，是因为我最近的心情太过于糟糕，对与她的态度有点太...（全文）\n\n2025年", "source": "豆瓣", "tags": ["日记", "被抛", "他人", "自由", "身体", "表达与语言"]}, {"time": "10月23日", "text": "不跟s说话我可以得到\n\n不用再反反复复内耗\n不用再在意她是否回信息\n不用再拼命找话题聊天\n不用再想方设法维持社交\n不用在她找到对象的时候承受暴击\n无事一身轻。\n我做不到\n看到她去date无动于衷\n每天说服自己别再喜欢她\n维持现状 当朋友相处\n\n2025年", "source": "豆瓣", "tags": ["他人", "自由", "荒谬与反抗", "表达与语言", "成为自己"]}, {"time": "10月23日", "text": "若我不狠心～ 痛心的只有自己～～\n\n2025年", "source": "豆瓣", "tags": ["成为自己"]}, {"time": "10月23日", "text": "我想我和她不会再见了\n\n2025年", "source": "豆瓣", "tags": ["他人", "自由"]}, {"time": "10月23日", "text": "你与喜欢的人是怎么样聊天的呢\n\n2025年", "source": "豆瓣", "tags": ["他人", "表达与语言"]}, {"time": "10月23日", "text": "唉\n\n2025年", "source": "豆瓣", "tags": ["杂多"]}, {"time": "10月22日", "text": "这个朋友非做不可吗\n\n2025年", "source": "豆瓣", "tags": ["他人"]}, {"time": "10月21日", "text": "居然会觉得我闲\n\n不可思议…\n\n2025年", "source": "豆瓣", "tags": ["杂多"]}, {"time": "10月20日", "text": "10.22\n\n我其实没懂为什么今天的情绪会突然崩溃，脑子混乱没法思考，变得有些懒散，懒得学。心态和上星期发生了一点变化，但是单单因为那件事不太可能吧？为啥，我上个星期不也在好好学吗？\n没吃好？没睡好？这不应该啊。\n这样好像不止一次了 到底是哪里做错了什么事情 难道又要重新慢慢来？\n还是先不要...（全文）\n\n2025年", "source": "豆瓣", "tags": ["日记", "被抛", "畏", "荒谬与反抗", "向死而生", "身体"]}, {"time": "10月20日", "text": "不要焦虑\n\n情绪最重要\n\n2025年", "source": "豆瓣", "tags": ["畏", "身体"]}, {"time": "10月20日", "text": "要是这我都逃的了那我就无敌了\n\n2025年", "source": "豆瓣", "tags": ["杂多"]}, {"time": "10月20日", "text": "为什么\n\n我喜欢一个人，不喜欢一个人同你有什么大关系。我对喜欢的人有很多话说，有什么不对？你的脾气来自于什么地方？为什么总要把拿这些来跟我和你的友情进行比较然后随意给我灌上一个不把你当朋友的罪名？\n\n2025年", "source": "豆瓣", "tags": ["被抛", "他人", "荒谬与反抗", "表达与语言"]}, {"time": "10月20日", "text": "被反反复复反反复复波动的情绪 我累了。不想玩了\n\n2025年", "source": "豆瓣", "tags": ["被抛", "畏", "身体"]}, {"time": "10月20日", "text": "十月\n\n看完了喜爱的书\n酒气还在\n我骑上车，放了歌\n风从两侧吹过，扑面而来的是秋天的气息\n人们穿着长袖在夜晚穿梭\n路边烧烤摊火焰正翻涌\n仅仅是看着就感受到了一丝热气\n忙碌的店主夫妇边忙着手中的活边与客人交谈着\n年轻人们在旁喝着酒嬉笑\n叶子从我身旁落下\n被风吹动着在地上打滚\n我带着耳机\n思绪如升腾的白烟在空中飘着\n无解的问题似乎消失了\n郁结得到了片刻的歇息\n\n2025年", "source": "豆瓣", "tags": ["被抛", "他人", "荒谬与反抗", "身体与活着"]}, {"time": "10月19日", "text": "为什么你总是阴晴不定\n\n你在做什么呢？心里在想着什么呢。\n\n2025年", "source": "豆瓣", "tags": ["被抛", "他人", "身体"]}, {"time": "10月19日", "text": "s\n\n多跟我交流好吗 多了解我好吗\n你喜欢聊什么 不喜欢聊什么呢\n你说的话都是真的吗\n\n2025年", "source": "豆瓣", "tags": ["他人", "表达与语言"]}, {"time": "10月19日", "text": "不要被语言限制了我的感情\n\n情绪复杂，多变\n它自然而然的产生，它先于语言存在，或许也先于思考存在。\n找不到形容的语言知识常态，语言具有局限性，它无法表达我无限的思绪。\n不要说话，不要思考，感受吧。\n\n2025年", "source": "豆瓣", "tags": ["被抛", "自由", "身体", "表达与语言"]}, {"time": "昨天", "text": "10.18\n\n好难度过的一星期 感觉全世界都在对我发泄情绪\n本来就因为想要说服自己同s做朋友，心情低落，又被y的许多负面情绪围绕，没办法解决。", "source": "豆瓣", "tags": ["日记", "被抛", "他人", "荒谬与反抗", "身体", "表达与语言", "身体与活着", "成为自己"]}, {"time": "10月18日", "text": "我做错啥了\n\n我做错啥了\n\n2025年", "source": "豆瓣", "tags": ["荒谬与反抗"]}, {"time": "10月18日", "text": "再来找我发瘟全杀了\n\n再来找我发瘟全杀了\n\n2025年", "source": "豆瓣", "tags": ["杂多"]}, {"time": "10月17日", "text": "我是否应该不跟她说话\n\n一直幻想并不尊重人。\n我能否以情绪波动最小的方式让自己慢慢减少与她的联系？\n说多错多\n慢慢来\n\n2025年", "source": "豆瓣", "tags": ["他人", "向死而生", "身体", "表达与语言", "成为自己"]}, {"time": "10月17日", "text": "sylvan 收藏小组讨论到豆列 摄影\nsylvan 说：\n我把日记都写在这里好了\n\n无论长短都是当日心情的纪录\n\n2025年", "source": "豆瓣", "tags": ["身体", "表达与语言"]}, {"time": "10月17日", "text": "时间\n\n早些很喜欢q的时候一直在想，我什么时候会不喜欢她呢？我们什么时候才会不联系呢？我好像完全不相信这一天会到来，甚至无法想象出这一天到来的模样。想象不出来的事情，怎么可能存在于世呢？那时候的我为q做了很多，自愿的、不自愿的；也许是自我感动的，也许也会感动到她一点，我真的很喜欢她，无...（全文）\n\n2025年", "source": "豆瓣", "tags": ["被抛", "他人", "自由", "向死而生", "成为自己"]}, {"time": "10月15日", "text": "不正常。快把她删掉。\n\n2025年", "source": "豆瓣", "tags": ["他人"]}, {"time": "10月15日", "text": "少接触，少了解，少感情\n\n2025年", "source": "豆瓣", "tags": ["杂多"]}, {"time": "10月14日", "text": "我总是在夜晚喊着矛盾的愿望\n\n2025年", "source": "豆瓣", "tags": ["杂多"]}, {"time": "10月14日", "text": "我待你从未真心过\n\n这是一句很有意思的话\n扮作朋友，我待你从未真心过\n\n2025年", "source": "豆瓣", "tags": ["他人"]}, {"time": "10月14日", "text": "s\n\n有的时候我真的很希望你能想要了解我。我没有办法适应关系中这么快的转变，但我又没办法拒绝同你聊天。有时候我会觉得自己像一条在你身边随着时间缓慢流动的河流，等着你放下来什么、我全都当宝贝似的佩在身上。\n其实我有时候不知道怎么用你交谈，要如何在一字一句中，掩饰我对你几近疯狂的探索欲。我害怕透露出来一分一毫，越过朋友的边界。我渴望与你聊天，又害怕与你聊天。\n\n2025年", "source": "豆瓣", "tags": ["被抛", "畏", "他人", "荒谬与反抗", "向死而生", "表达与语言", "成为自己"]}, {"time": "10月14日", "text": "我该用怎么样的态度对待你\n\n我要用什么样的心情同你聊天？\n我该如何回复你的讯息？\n\n2025年", "source": "豆瓣", "tags": ["他人", "自由", "身体", "表达与语言"]}, {"time": "10月13日", "text": "q\n\n我完全没办法摸清楚你对于我来说是一种怎么样的存在..我相信我对你绝对是厌烦的，不想同你说话，但我为什么下不去手把你删了？我到底在顾虑什么？真是奇怪。\n\n2025年", "source": "豆瓣", "tags": ["被抛", "他人", "自由", "表达与语言"]}, {"time": "10月13日", "text": "s\n\n我总是会突然想到你，然后毫无缘由的开始思考一些奇怪的问题。\n也许成为你心里的不圆满会更容易让你记住我，不过我现在不是了。我不想再去过多的猜测你心里的想法，你话语的真假，这并无意义。\n我们之间的关系将会趋于平淡，至少从现在看来是这样的，也许到后面我对你的感情也是、但我想我会记得...（全文）\n\n2025年", "source": "豆瓣", "tags": ["被抛", "他人", "自由", "荒谬与反抗", "身体", "无意义与意义"]}, {"time": "10月11日", "text": "10.10或者10.11\n\n我累了 我好痛苦 虽然昨晚已经跟朋友宣泄过情绪 但是今早起来该发生的还是在发生\n我不明白小雨为什么要因为一句话，因为别人的一句话就觉得我没有把她放在“我跟她心里”同等位置，我相信虽然我现在语言组织能力虽然不好，但我能看得懂，是吧？\n我不知道是不是我把这件事情想得太严重了，它也许只...（全文）\n\n2025年", "source": "豆瓣", "tags": ["日记", "被抛", "畏", "他人", "自由", "荒谬与反抗", "身体", "表达与语言"]}, {"time": "10月10日", "text": "世界爆炸了\n\n2025年", "source": "豆瓣", "tags": ["被抛", "身体与活着"]}, {"time": "10月10日", "text": "我有表达情感羞耻症\n\n2025年", "source": "豆瓣", "tags": ["表达与语言"]}, {"time": "10月9日", "text": "一下子又觉得没有遗憾了，不管她看没看到。\n\n2025年", "source": "豆瓣", "tags": ["他人"]}, {"time": "10月9日", "text": "感谢你的出现..\n\n2025年", "source": "豆瓣", "tags": ["他人"]}, {"time": "10月9日", "text": "思念！常常思念不能见面～～\n\n2025年", "source": "豆瓣", "tags": ["杂多"]}, {"time": "10月8日", "text": "10.8 晴\n\n最近生活有些丰富 到现在才想起提笔记录\n国庆的晚上一直在跟lzr四处游荡，到了五六点骑着电瓶车去吃夜宵，或是买现炸的油条，然后慢悠悠的回家，一觉睡到中午，不为什么的消耗时间，这样的生活让我很舒适。\n早上我会花时间看书，或是去听听b站上的那节课，学习知识的同时练习下英文，然后背...（全文）\n\n2025年", "source": "豆瓣", "tags": ["日记", "被抛", "他人", "向死而生", "表达与语言", "自由与束缚", "身体与活着"]}, {"time": "10月6日", "text": "我每天的空虚感 无意义感也许是来自于感觉没有做实事\n\n2025年", "source": "豆瓣", "tags": ["荒谬与反抗", "身体", "无意义与意义"]}, {"time": "10月5日", "text": "有朋友真好 有朋友真好\n\n2025年", "source": "豆瓣", "tags": ["他人"]}, {"time": "昨天", "text": "10.3 补", "source": "豆瓣", "tags": ["日记"]}, {"time": "10月3日", "text": "2025.10.2 晴\n\n一夜未眠。今晚约了xyy出去lelavender，是个不错的小酒馆，就是有点远。我怪我自己嘴贱问了她为何跟前女友分开，触及了她的伤心事，本打算早早离开酒馆回家睡觉，结果硬是拖到了三号凌晨两三点才结束。\n她的情绪好复杂，也许夹杂着爱、不舍、委屈、不甘心、后悔、和恨意。她不断的喝着酒，一根接着...（全文）\n\n2025年", "source": "豆瓣", "tags": ["被抛", "畏", "他人", "身体", "成为自己"]}, {"time": "10月3日", "text": " } catch(e) {}

    source: '本子',

    isNew: true
  };
});

let view='think', cat=null;

function makeCats(el, list){
  el.innerHTML='';
  list.forEach(c=>{
    const n = data.filter(x=>x.tags.includes(c)).length;
    if(!n) return;
    const e = document.createElement('div');
    e.className='cat'+(cat===c?' active':'');
    e.textContent=c+' '+n;
    e.onclick=()=>{cat=cat===c?null:c;render()};
    el.appendChild(e);
  });
}
function render(){
  document.getElementById('thinkArea').style.display = view==='think'?'block':'none';
  document.getElementById('mineArea').style.display = view==='mine'?'block':'none';
  makeCats(document.getElementById('catsExist'), existCats);
  makeCats(document.getElementById('catsProp'), propCats);
  makeCats(document.getElementById('catsMine'), mineCats);
  let items;
  if(view==='frag'){
    items = data.filter(x=>x.tags.includes('碎片'));
    document.getElementById('list').innerHTML = items.map(x=>
      `<div class="frag">${x.text.replace(/</g,'&lt;')}${x.isNew?'<span class="new-badge">新</span>':''}</div>`
    ).join('');
    return;
  }
  items = cat ? data.filter(x=>x.tags.includes(cat) && !x.tags.includes('碎片')) : data.filter(x=>!x.tags.includes('碎片'));

  ).join('');
}
