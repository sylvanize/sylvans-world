<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sylvan's world</title>
  <!-- 标题字体（Playfair Display 衬线体，保持原来的观感） -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Press+Start+2P&display=swap" rel="stylesheet">
  <!-- 三个独立文件：样式 + 逻辑 全部外链，方便维护 -->
  <link rel="stylesheet" href="css/landing.css">
</head>
<body class="landing-page">
  <!--
    彩蛋设计说明：
    - 页面加载完默认有 1 只企鹅，自动播放"跺脚"帧动画
    - 点击企鹅 -> 新增一只（上限 6 只）；满员后再点 -> 所有企鹅愣住 3 秒
    - 点击页面空白处 -> 跳转 home.html（点击企鹅不会触发跳转）
    - 不显示任何提示文字 / 数量面板
  -->
  <div class="landing" id="landing">
    <h1 class="landing-title">SYLVAN'S WORLD</h1>
    <div class="penguin-queue" id="penguinQueue"></div>
  </div>

  <script src="js/landing.js"></script>
  <script src="js/cursor.js"></script>
  <!-- home 从后面透出来 -->
  <iframe id="homeFrame" src="home.html" style="position:fixed;inset:0;width:100%;height:100%;border:none;z-index:0;opacity:0;pointer-events:none;"></iframe>
  <!-- 地面透视线 -->
  <div id="ground" style="position:fixed;bottom:0;left:0;right:0;height:40vh;z-index:-1;
    background:linear-gradient(to top, #e8e8e8 0%, transparent 100%);
    transform-origin:bottom center;"></div>
  <!-- 像素风进度条 -->
  <div id="walkProgress" style="position:fixed;bottom:60px;left:50%;transform:translateX(-50%);z-index:100;display:none;">
    <div style="font-family:'Press Start 2P',monospace;font-size:24px;color:#1A1A1A;text-align:center;margin-bottom:16px;" id="progressText">0%</div>
    <div style="width:500px;height:32px;border:5px solid #1A1A1A;background:#fff;position:relative;">
      <div id="progressBar" style="height:100%;width:0%;background:#1A1A1A;transition:width 0.1s linear;"></div>
    </div>
  </div>
</body>
</html>
