<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="archive-manifest.json">
<title>archive · sylvan's world</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FFFFFF; --ink:#111111; --soft:#666666; --faint:#999999;
    --line:#DDDDDD; --field:#F5F5F5;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;}
  body{background:var(--paper);color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;
    -webkit-font-smoothing:antialiased;}
  ::selection{background:#161616;color:#fff;}

  .wrap{width:100%;max-width:800px;margin:0 auto;padding-left:20px;padding-right:20px;}

  /* ---------- 顶部 app bar ---------- */
  .appbar{position:sticky;top:0;z-index:50;
    background:rgba(255,255,255,.9);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    padding-top:calc(16px + env(safe-area-inset-top));}
  .bar-row{display:flex;justify-content:space-between;align-items:center;}
  .brand{font-size:12px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;}
  .brand-sub{font-size:10.5px;letter-spacing:.14em;color:var(--faint);text-transform:uppercase;}

  .search-box{display:flex;align-items:center;gap:8px;margin-top:14px;
    background:#fff;border:1px solid #ddd;border-radius:11px;padding:0 14px;height:42px;}
  .search-box .mag{font-size:13px;color:#999;flex-shrink:0;}
  .search-box input{flex:1;min-width:0;border:none;outline:none;background:transparent;
    font-family:inherit;font-size:14px;color:#000;height:100%;}
  .search-box input::placeholder{color:#999;}
  .clear-btn{flex-shrink:0;border:none;background:none;color:#999;
    font-size:13px;width:28px;height:28px;border-radius:50%;cursor:pointer;display:none;align-items:center;justify-content:center;}
  .clear-btn.show{display:flex;}

  .tabs{display:flex;gap:22px;overflow-x:auto;scrollbar-width:none;margin-top:16px;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{flex-shrink:0;background:none;border:none;cursor:pointer;font-family:inherit;
    font-size:14px;color:var(--soft);padding:4px 0 12px;position:relative;
    display:flex;gap:5px;align-items:baseline;}
  .tab .n{font-size:10px;color:#c4c3bf;font-variant-numeric:tabular-nums;}
  .tab.active{color:var(--ink);font-weight:600;}
  .tab.active::after{content:"";position:absolute;left:0;right:0;bottom:5px;height:1.5px;background:var(--ink);}
  .tab.active .n{color:var(--ink);}

  /* ---------- 思考筛选 ---------- */
  .filters{border-bottom:1px solid var(--line);}
  .filter-row{display:flex;gap:18px;overflow-x:auto;scrollbar-width:none;padding:14px 0;}
  .filter-row::-webkit-scrollbar{display:none;}
  .filter-row + .filter-row{border-top:1px solid var(--line);}
  .filter-label{flex-shrink:0;display:flex;align-items:center;font-size:10px;
    letter-spacing:.18em;text-transform:uppercase;color:var(--faint);padding-right:4px;}
  .fbtn{flex-shrink:0;background:none;border:none;cursor:pointer;font-family:inherit;
    font-size:13px;color:var(--soft);padding:5px 0;position:relative;min-height:32px;}
  .fbtn.active{color:var(--ink);font-weight:600;}
  .fbtn.active::after{content:"";position:absolute;left:0;right:0;bottom:0;height:1.5px;background:var(--ink);}

  /* ---------- 条目 ---------- */
  .content{padding-top:6px;padding-bottom:calc(48px + env(safe-area-inset-bottom));}
  .entry{padding:36px 0;border-bottom:1px solid var(--line);}
  .entry:last-child{border-bottom:none;}
  .entry .title{font-size:19px;font-weight:700;line-height:1.5;letter-spacing:-.01em;
    color:#111;margin-bottom:10px;}
  .entry .body{font-size:15px;font-weight:400;line-height:1.9;letter-spacing:.01em;
    color:#222;white-space:pre-wrap;word-break:break-word;}
  .entry .imgs{margin-top:16px;display:flex;flex-wrap:wrap;gap:10px;}
  .entry .entry-img{max-width:240px;max-height:240px;border-radius:2px;object-fit:cover;}
  .entry .meta{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:16px;
    font-size:10px;letter-spacing:.15em;color:var(--faint);text-transform:uppercase;}
  .entry .meta .flow{color:#999;}
  .entry .meta span:not(.flow):not(.edited-flag):not(.edit-btn){
    padding:3px 8px;border:1px solid var(--line);border-radius:3px;}
  .empty{padding:72px 0;text-align:center;font-size:13px;letter-spacing:.08em;color:var(--faint);line-height:1.9;}

  /* ---------- 编辑功能 ---------- */
  .edit-btn{background:none;border:none;cursor:pointer;font-family:inherit;
    color:var(--faint);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
    padding:6px 0;min-height:32px;}
  .reset-btn{background:none;border:none;cursor:pointer;font-family:inherit;
    color:var(--faint);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
    padding:8px 0;min-height:36px;}
  .edited-flag{color:var(--ink);}
  .editor-overlay{position:fixed;inset:0;z-index:100;background:var(--paper);
    display:flex;flex-direction:column;
    transform:translateY(100%);transition:transform .28s ease;
    padding-top:env(safe-area-inset-top);}
  .editor-overlay.open{transform:none;}
  .editor-overlay .ebar{display:flex;justify-content:space-between;align-items:center;
    padding:16px 20px;}
  .editor-overlay .ebar button{background:none;border:none;cursor:pointer;font-family:inherit;
    font-size:14px;color:var(--ink);padding:8px 10px;min-height:40px;}
  .editor-overlay .ebar .esave{font-weight:600;}
  .editor-overlay .ebar .edel{color:#c0392b;}
  .editor-overlay .ebody{flex:1;overflow-y:auto;padding:8px 20px 30px;}
  .editor-overlay textarea{width:100%;border:none;outline:none;resize:none;background:transparent;
    font-family:inherit;font-size:15px;line-height:1.85;color:var(--ink);min-height:60vh;}
  .editor-overlay .ehint{font-size:11px;color:var(--faint);letter-spacing:.06em;margin-top:16px;line-height:1.8;}
  .cat-btn{border:1px solid #ddd;background:#fff;border-radius:16px;padding:6px 14px;font-family:inherit;font-size:13px;color:#666;cursor:pointer;min-height:32px;}
  .cat-btn.on{background:#111;color:#fff;border-color:#111;}

  /* ---------- 桌面端微调 ---------- */
  @media(min-width:860px){
    .appbar{padding-top:22px;}
    .content{padding-top:10px;}
    .entry .txt{font-size:15.5px;}
  }
</style>
</head>
<body>

<header class="appbar">
  <div class="wrap">
    <div class="bar-row">
      <div class="brand">sylvan's world</div>
      <div style="display:flex;align-items:center;gap:16px;">
        <a href="haiku-app.html" style="font-size:10.5px;letter-spacing:.14em;color:var(--soft);text-decoration:none;text-transform:uppercase;">本子 ↗</a>
        <div class="brand-sub">archive</div>
      </div>
    </div>
    <div class="search-box">
      <span class="mag">⌕</span>
      <input type="search" id="search" placeholder="搜索当前视图…" autocomplete="off">
      <button class="clear-btn" id="clearBtn" aria-label="清除">✕</button>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </div>
</header>

<div class="filters wrap" id="filters"></div>

<div class="wrap" id="statsBar" style="padding:18px 0 4px;font-size:11px;color:var(--faint);letter-spacing:.06em;line-height:2;text-align:center;"></div>

<div class="wrap" id="searchInfo" style="display:none;padding-top:14px;font-size:11px;color:var(--faint);letter-spacing:.08em;"></div>

<main class="content wrap" id="entries"></main>

<div id="resetZone" class="wrap" style="display:none;text-align:center;padding:30px 0 10px;">
  <button id="resetAll" class="reset-btn">恢复全部本地改动</button>
</div>

<div class="editor-overlay" id="editOverlay">
  <div class="ebar">
    <button id="ecCancel">取消</button>
    <div style="display:flex;gap:4px;align-items:center;">
      <button class="edel" id="ecDelete">删除</button>
      <button id="ecRestore" style="display:none">恢复原文</button>
      <button class="esave" id="ecSave">保存</button>
    </div>
  </div>
  <div class="ebody wrap">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;">
      <span style="font-size:10px;letter-spacing:.15em;color:var(--faint);text-transform:uppercase;">日期</span>
      <input id="ecDate" type="date" style="border:1px solid #ddd;border-radius:6px;padding:6px 10px;font-family:inherit;font-size:13px;outline:none;">
    </div>
    <div style="margin-bottom:14px;">
      <div style="font-size:10px;letter-spacing:.15em;color:var(--faint);text-transform:uppercase;margin-bottom:8px;">分区</div>
      <div id="ecCats" style="display:flex;flex-wrap:wrap;gap:6px;"></div>
      <div id="ecSubs" style="display:none;margin-top:10px;">
        <div style="font-size:10px;letter-spacing:.12em;color:var(--faint);text-transform:uppercase;margin-bottom:6px;">主题</div>
        <div id="ecThemes" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;"></div>
        <div style="font-size:10px;letter-spacing:.12em;color:var(--faint);text-transform:uppercase;margin-bottom:6px;">抽屉</div>
        <div id="ecDrawers" style="display:flex;flex-wrap:wrap;gap:6px;"></div>
      </div>
    </div>
    <textarea id="ecArea" spellcheck="false"></textarea>
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <span id="ecCount" style="font-size:11px;color:var(--faint);letter-spacing:.08em;">0 字</span>
      <span class="ehint" style="margin:0;">改动只存在本机，可恢复</span>
    </div>
  </div>
</div>

<div class="editor-overlay" id="exportOverlay">
  <div class="ebar">
    <button id="exCancel">关闭</button>
    <button class="esave" id="exDownload">下载 PNG</button>
  </div>
  <div class="ebody" style="display:flex;flex-direction:column;align-items:center;gap:18px;">
    <div style="display:flex;gap:10px;align-items:center;">
      <span style="font-size:10px;letter-spacing:.15em;color:var(--faint);text-transform:uppercase;">配色</span>
      <button class="cat-btn theme-btn on" data-theme="bw" style="width:36px;height:36px;border-radius:50%;background:#fff;border:2px solid #111;"></button>
      <button class="cat-btn theme-btn" data-theme="paper" style="width:36px;height:36px;border-radius:50%;background:#f5f1e8;border:2px solid #ddd;"></button>
      <button class="cat-btn theme-btn" data-theme="night" style="width:36px;height:36px;border-radius:50%;background:#111;border:2px solid #333;"></button>
    </div>
    <canvas id="exCanvas" width="1080" height="1440" style="max-width:100%;height:auto;border:1px solid #eee;"></canvas>
  </div>
</div>

<script src="js/archive-data.js"></script>
<script src="js/synced-data.js"></script>
<script src="js/supabase-sync.js"></script>
<script>
(function(){
  var DATA=[];

  /* 自动归类规则（与本子同一套，纯函数） */
  function arcHas(t,kws){return kws.some(function(k){return t.indexOf(k)!==-1;});}
  function arcTheme(t){
    if(arcHas(t,['焦虑','情绪','失眠','哭','紧张','疲惫','累','心情','难过','害怕','恐惧','不安','疼','烦躁','烦','郁','痛苦','压力','迷茫','无助','悲伤','毛病','矛盾','后悔','恨','睡','梦','控制','裸奔','燥','抑郁','反复','发泄','身体','心跳','不愉快','想法']))return '身体';
    if(arcHas(t,['朋友','她','关系','喜欢','社交','别人','妈妈','爸爸','爱','想念','他人','相处','对方','好友','同学','聊','姐','跟','欢','相','话','喜','尊','猜','主体性','两人']))return '他人';
    if(arcHas(t,['活着','生活','人生','改变','存在','世界','重建','时光','死亡','生命','未来','日子','春天','热爱','声','期','物','苦','慢','世','着','义','废墟']))return '活着';
    return '做自己';
  }
  function arcDrawer(t,th){
    if(th==='身体')return '身体的感觉';
    if(th==='他人')return '和人有关的';
    if(arcHas(t,['不要','别','应当','必须','要学会','不能','应该','告诉自己','加油','要做','得学','要成为']))return '跟自己说的';
    return '还在想的事';
  }
  function arcAuto(t){
    if(arcHas(t,['去年','前年','前几年','记得','小时候','那年','曾经','回忆','记忆','从前','儿时']))return ['回忆'];
    var zh=(t.match(/[一-鿿]/g)||[]).length;
    var en=(t.match(/[a-zA-Z]/g)||[]).length;
    var repeated=/(.)\1\1/.test(t);
    if(t.length<14||(repeated&&t.length<40)||(en>zh&&t.length<45))return ['碎片'];
    if(arcHas(t,['?','？','为什么','是不是','应当','如何','该不该','能不能','要不要','我是否','思考'])){
      var th=arcTheme(t);return [th,arcDrawer(t,th)];
    }
    if(arcHas(t,['星球','毛线','意象','混沌','氧气','翅膀','季节','风','光','海','歌','诗']))return ['随笔'];
    return ['日记'];
  }

  /* 读取本子（localStorage）里的新内容，按正文去重后合并 */
  function loadNotebook(){
    var existing={};
    DATA.forEach(function(d){existing[d.text]=1;});
    var extra=[];
    function cdate(s){
      var m=(s||'').split('.');
      if(m.length!==3)return{iso:'',time:''};
      return{iso:m[0]+'-'+m[1]+'-'+m[2],
             time:m[0]+'年'+parseInt(m[1],10)+'月'+parseInt(m[2],10)+'日'};
    }
    function add(d){
      if(!d.text||existing[d.text])return;
      existing[d.text]=1;extra.push(d);
    }
    try{
      JSON.parse(localStorage.getItem('sylvan_haikus')||'[]').forEach(function(h){
        var d=cdate(h.date);
        add({date:d.iso,time:d.time,source:'本子',
             text:(h.lines||[]).join('\n'),tags:['俳句']});
      });
      JSON.parse(localStorage.getItem('sylvan_notes')||'[]').forEach(function(n){
        var d=cdate(n.date);
        var parts=[];if(n.title)parts.push(n.title);if(n.body)parts.push(n.body);
        var text=parts.join('\n');
        var tags=(n.arcTags&&n.arcTags.length)?n.arcTags.slice():['日记'];
        add({date:d.iso,time:d.time,source:'本子',text:text,tags:tags});
      });
    }catch(e){}
    return extra;
  }
  /* 读取本子同步数据（window.SYLVAN_SYNCED，由 synced-data.js 用 <script> 加载，
     file:// 双击和 http 下都能读，绕开 file:// 的 fetch 限制），按正文去重后合并 */
  function cdateFrom(s){
    var m=(s||'').split('.');
    if(m.length!==3)return{iso:'',time:''};
    return{iso:m[0]+'-'+m[1]+'-'+m[2],
           time:m[0]+'年'+parseInt(m[1],10)+'月'+parseInt(m[2],10)+'日'};
  }
  function loadSynced(){
    var synced=window.SYLVAN_SYNCED||{poems:[],notes:[]};
    var existing={};
    DATA.forEach(function(d){existing[d.text]=1;});
    var extra=[];
    function add(d){if(!d.text||existing[d.text])return;existing[d.text]=1;extra.push(d);}
    (Array.isArray(synced.poems)?synced.poems:[]).forEach(function(p){
      var d=cdateFrom(p.date);
      add({date:d.iso,time:d.time,source:'本子',text:(p.lines||[]).join('\n'),tags:['俳句']});
    });
    (Array.isArray(synced.notes)?synced.notes:[]).forEach(function(n){
      var d=cdateFrom(n.date);
      var parts=[];if(n.title)parts.push(n.title);if(n.body)parts.push(n.body);
      var text=parts.join('\n');
      var tags=(n.arcTags&&n.arcTags.length)?n.arcTags.slice():['日记'];
      add({date:d.iso,time:d.time,source:'本子',text:text,tags:tags});
    });
    return extra;
  }
  /* 本地数据作为降级和首次迁移用 */
  var LOCAL_DATA=(window.ARCHIVE_DATA||[]).slice().concat(loadSynced()).concat(loadNotebook());

  /* ===== 本地编辑系统：改动存 localStorage，不写原始数据 ===== */
  var EDIT_KEY='sylvan_archive_edits';
  function hashKey(s){
    var h=5381;
    for(var i=0;i<s.length;i++){h=((h<<5)+h+s.charCodeAt(i))>>>0;}
    return h.toString(36);
  }
  function getOverrides(){
    try{return JSON.parse(localStorage.getItem(EDIT_KEY)||'{}');}catch(e){return {};}
  }
  function saveOverrides(ov){localStorage.setItem(EDIT_KEY,JSON.stringify(ov));}
  // 原始快照（带稳定 key，不被修改）
  DATA.forEach(function(d){d._key=hashKey(d.text);});
  var RAW=DATA;
  function rebuild(){
    DATA=RAW.map(function(d){
      return {date:d.date,time:d.time,source:d.source,text:d.text,tags:d.tags.slice(),_key:d._key,_id:d._id,images:d.images||[],_createdAt:d._createdAt||''};
    });
    var ov=getOverrides();
    DATA.forEach(function(d){
      var e=ov[d._key];
      if(!e)return;
      if(e.deleted)d._deleted=true;
      if(e.text){d.text=e.text;d._edited=true;}
      if(e.date){d.date=e.date;}
      if(e.time){d.time=e.time;}
    });
  }
  rebuild();

  var SOLO=['碎片','随笔','回忆','日记','俳句'];
  var VIEWS=['日记','回忆','随笔','俳句','碎片','思考'];
  var THEMES=['做自己','身体','他人','活着'];
  var DRAWERS=['还在想的事','身体的感觉','跟自己说的','和人有关的'];
  var state={view:'日记',theme:null,drawer:null,q:''};
  // 管理员模式：URL 加 ?admin=你的密码 才能编辑删除
  var ADMIN_PASSWORD='sylvan2026'; // 改这里设你的密码
  var isAdmin=new URLSearchParams(location.search).get('admin')===ADMIN_PASSWORD;

  function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function isSolo(d){return d.tags.some(function(t){return SOLO.indexOf(t)!==-1;});}
  function viewItems(v){
    if(v==='思考')return DATA.filter(function(d){return !d._deleted&&!isSolo(d);});
    return DATA.filter(function(d){return !d._deleted&&d.tags.indexOf(v)!==-1;});
  }
  function sortDate(a){return a.slice().sort(function(x,y){
    if(!x.date&&!y.date)return 0;if(!x.date)return 1;if(!y.date)return -1;
    if(x.date!==y.date)return y.date.localeCompare(x.date);
    return (y._id||0)-(x._id||0);});}
  function currentItems(){
    var items;
    if(state.view==='思考'){
      items=viewItems('思考');
      if(state.theme)items=items.filter(function(d){return d.tags.indexOf(state.theme)!==-1;});
      if(state.drawer)items=items.filter(function(d){return d.tags.indexOf(state.drawer)!==-1;});
    }else{
      items=sortDate(viewItems(state.view));
    }
    if(state.q){
      var q=state.q;
      items=items.filter(function(d){
        return d.text.toLowerCase().indexOf(q)!==-1;
      });
    }
    return items;
  }

  /* ---- 视图 tab ---- */
  var tabsEl=document.getElementById('tabs');
  VIEWS.forEach(function(v){
    var b=document.createElement('button');
    b.className='tab'+(v===state.view?' active':'');
    b.dataset.view=v;
    b.innerHTML='<span>'+esc(v)+'</span><span class="n">'+viewItems(v).length+'</span>';
    b.onclick=function(){
      state.view=v;state.theme=null;state.drawer=null;state.q='';
      searchInput.value='';clearBtn.classList.remove('show');
      document.querySelectorAll('.tab').forEach(function(x){x.classList.toggle('active',x===b);});
      renderFilters();render();
    };
    tabsEl.appendChild(b);
  });
  function updateTabCounts(){
    document.querySelectorAll('.tab').forEach(function(t){
      t.querySelector('.n').textContent=viewItems(t.dataset.view).length;
    });
  }

  /* ---- 思考筛选 ---- */
  var filtersEl=document.getElementById('filters');
  function makeRow(label,order,key){
    var r=document.createElement('div');r.className='filter-row';
    var l=document.createElement('span');l.className='filter-label';l.textContent=label;r.appendChild(l);
    order.forEach(function(name){
      var b=document.createElement('button');
      b.className='fbtn'+(state[key]===name?' active':'');b.textContent=name;
      b.onclick=function(){
        state[key]=(state[key]===name)?null:name;renderFilters();render();
      };
      r.appendChild(b);
    });
    filtersEl.appendChild(r);
  }
  function renderFilters(){
    filtersEl.innerHTML='';
    if(state.view!=='思考'){filtersEl.style.display='none';return;}
    filtersEl.style.display='block';
    makeRow('主题',THEMES,'theme');
    makeRow('抽屉',DRAWERS,'drawer');
  }

  /* ---- 列表渲染 ---- */
  var entriesEl=document.getElementById('entries');

  var statsBar=document.getElementById('statsBar');
  var STOP=new Set(['的一','了我','是不','在他','这有','个们','上','来','到','时','大','地','为','子','中','说','去','会','着','看','好','自','己','这','那','和','就','不','人','都','一','个','上','也','很','还','但','与','或','把','被','让','从','向','于','等','着','过','吗','呢','吧','啊','呀','嘛','哦','嗯','嘛','之','其','以','及','而','且','然','则','若','如','因','为','所','以','于','至','关','于','对','关','通','过','关','于','现','在','曾','经','已','经','刚','才','正','在','将','要','想','要','应','该','可','以','能','够','必','须','得','须','需','要','喜','欢','觉','得','知','道','觉','得','发','现','认','为','以','为','看','来','听','说','据','说','比','如','例','如','例','如','比','较','相','比','相','对','绝','对','大','概','也','许','或','许','恐','怕','应','该','可','能','大','概','至','少','至','多','至','今','为','止','迄','今','为','止','总','之','综','上','所','述','换','言','之','换','句','说','换','句','话','也','就','是','说','也','即','是','说','换','句','说','也','就','是','说','也','即','是','说','我','你','他','她','它','我','们','你','们','他','们','她','们','它','们','自','己','别','人','大','家','人','家','谁','什','么','怎','么','为','什','么','为','何','如','何','怎','样','多','少','几','多','久','多','远','多','高','多','大','多','长','多','宽','哪','哪','里','哪','个','哪','些','这','里','那','里','这','个','那','个','这','些','那','些','这','么','那','么','这','样','那','样','这','种','那','种']);
  function topWords(text, n){
    var freq={};
    var chinese=text.match(/[一-鿿]/g)||[];
    for(var i=0;i<chinese.length-1;i++){
      var bigram=chinese[i]+chinese[i+1];
      if(STOP.has(bigram))continue;
      freq[bigram]=(freq[bigram]||0)+1;
    }
    var arr=Object.keys(freq).map(function(k){return [k,freq[k]];});
    arr.sort(function(a,b){return b[1]-a[1];});
    return arr.slice(0,n).map(function(x){return x[0];});
  }
  function computeStats(){
    var year=new Date().getFullYear();
    var chars=0, days={}, allText='';
    DATA.forEach(function(d){
      if(d._deleted)return;
      if(d.date&&d.date.indexOf(year)!==0)return;
      chars+=(d.text||'').replace(/\s/g,'').length;
      if(d.date)days[d.date]=1;
      allText+=(d.text||'');
    });
    var dayCount=Object.keys(days).length;
    var totalEntries=DATA.filter(function(d){return !d._deleted;}).length;
    var top=topWords(allText,3);
    statsBar.innerHTML='今年写了 <b style="color:var(--ink)">'+chars+'</b> 字 · <b style="color:var(--ink)">'+dayCount+'</b> 天 · 共 <b style="color:var(--ink)">'+totalEntries+'</b> 条'
      +'<br>最爱词：<b style="color:var(--ink)">'+top.join('</b> · <b style="color:var(--ink)">')+'</b>';
  }
  function render(){
    computeStats();
    updateTabCounts();
    var items=currentItems();
    // 搜索结果计数
    if(state.q){
      searchInfo.style.display='block';
      searchInfo.textContent='找到 '+items.length+' 条';
    }else{
      searchInfo.style.display='none';
    }
    // 有本地改动时才显示“恢复全部”
    resetZone.style.display=Object.keys(getOverrides()).length?'block':'none';
    if(!items.length){
      entriesEl.innerHTML='<div class="empty">'+(state.q?'没有找到包含“'+esc(searchInput.value)+'”的字':'这个方向暂时没有字')+'</div>';
      return;
    }
    entriesEl.innerHTML=items.map(function(d){
      var meta=[];
      if(d.time)meta.push('<span>'+esc(d.time)+'</span>');
      if(d._createdAt){
        var dt=new Date(d._createdAt);
        var hh=String(dt.getHours()).padStart(2,'0');
        var mm=String(dt.getMinutes()).padStart(2,'0');
        meta.push('<span>'+hh+':'+mm+'</span>');
      }
      meta.push('<span>'+esc(d.source)+'</span>');
      if(state.view==='思考')meta.push('<span class="flow">'+esc(d.tags.join(' · '))+'</span>');
      if(d._edited)meta.push('<span class="edited-flag">已改</span>');
      if(isAdmin)meta.push('<button class="edit-btn" data-key="'+d._key+'">编辑</button>');
      meta.push('<button class="edit-btn export-btn" data-key="'+d._key+'">导出</button>');
      // 除了碎片和俳句，其他都加粗第一行
      var lines=d.text.split('\n');
      var noBold=['碎片','俳句'];
      var hasTitle=!noBold.some(function(t){return d.tags.indexOf(t)!==-1;});
      var txt;
      if(hasTitle && lines[0]){
        txt='<div class="title">'+esc(lines[0])+'</div>';
        if(lines.length>1) txt+='<div class="body">'+esc(lines.slice(1).join('\n'))+'</div>';
      }else{
        txt='<div class="body">'+esc(d.text)+'</div>';
      }
      // 渲染图片
      var imgs=(d.images||[]).map(function(src){
        return '<img class="entry-img" src="'+esc(src)+'" loading="lazy">';
      }).join('');
      return '<div class="entry">'+txt+
             (imgs?'<div class="imgs">'+imgs+'</div>':'')+
             '<div class="meta">'+meta.join('')+'</div></div>';
    }).join('');
    entriesEl.querySelectorAll('.edit-btn').forEach(function(b){
      b.addEventListener('click',function(){openEditor(b.dataset.key);});
    });
    entriesEl.querySelectorAll('.export-btn').forEach(function(b){
      b.addEventListener('click',function(){openExport(b.dataset.key);});
    });
  }

  /* ---- 搜索 ---- */
  var searchInput=document.getElementById('search');
  var clearBtn=document.getElementById('clearBtn');
  searchInput.addEventListener('input',function(){
    state.q=this.value.trim().toLowerCase();
    clearBtn.classList.toggle('show',!!state.q);
    render();

  /* ---- 编辑器交互 ---- */
  var overlay=document.getElementById('editOverlay');
  var ecArea=document.getElementById('ecArea');
  var ecDate=document.getElementById('ecDate');
  var ecRestore=document.getElementById('ecRestore');
  var ecCount=document.getElementById('ecCount');
  var ecCats=document.getElementById('ecCats');
  var ecSubs=document.getElementById('ecSubs');
  var ecThemes=document.getElementById('ecThemes');
  var ecDrawers=document.getElementById('ecDrawers');
  var editingKey=null;

  var SOLO_CATS=['日记','回忆','随笔','俳句','碎片'];
  var curCat='日记', curTheme='做自己', curDrawer='还在想的事';

  function buildCatBtns(){
    ecCats.innerHTML='';
    SOLO_CATS.concat(['思考']).forEach(function(c){
      var b=document.createElement('button');
      b.className='cat-btn'+(curCat===c?' on':'');
      b.textContent=c;
      b.onclick=function(){
        curCat=c;
        buildCatBtns();
        ecSubs.style.display=(c==='思考')?'block':'none';
      };
      ecCats.appendChild(b);
    });
  }
  function buildSubBtns(container,arr,cur,setter){
    container.innerHTML='';
    arr.forEach(function(name){
      var b=document.createElement('button');
      b.className='cat-btn'+(cur===name?' on':'');
      b.textContent=name;
      b.onclick=function(){setter(name);buildSubBtns(container,arr,cur===name?null:name,setter);};
      container.appendChild(b);
    });
  }

  function currentEntry(key){
    for(var i=0;i<DATA.length;i++)if(DATA[i]._key===key)return DATA[i];
    return null;
  }
  function fmtDate(s){
    if(!s)return '';
    var m=String(s).match(/(\d{4})[年\-/.](\d{1,2})[月\-/.](\d{1,2})/);
    if(m)return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
    return '';
  }
  function fmtTime(iso){
    if(!iso)return '';
    var p=iso.split('-');
    if(p.length===3)return p[0]+'年'+parseInt(p[1],10)+'月'+parseInt(p[2],10)+'日';
    return '';
  }
  function openEditor(key){
    var d=currentEntry(key);
    if(!d)return;
    editingKey=key;
    ecArea.value=d.text;
    ecDate.value=fmtDate(d.date)||fmtDate(d.time);
    ecRestore.style.display=d._edited?'block':'none';
    // 读取当前分区
    var tags=d.tags||['日记'];
    var solo=tags.filter(function(t){return SOLO_CATS.indexOf(t)!==-1;});
    if(solo.length){
      curCat=solo[0];
      ecSubs.style.display='none';
    }else{
      curCat='思考';
      ecSubs.style.display='block';
      curTheme=tags.find(function(t){return THEMES.indexOf(t)!==-1;})||'做自己';
      curDrawer=tags.find(function(t){return DRAWERS.indexOf(t)!==-1;})||'还在想的事';
    }
    buildCatBtns();
    buildSubBtns(ecThemes,THEMES,curTheme,function(v){curTheme=v;});
    buildSubBtns(ecDrawers,DRAWERS,curDrawer,function(v){curDrawer=v;});
    overlay.classList.add('open');
    updateCount();
    setTimeout(function(){ecArea.focus();},250);
  }
  function closeEditor(){overlay.classList.remove('open');editingKey=null;}
  function updateCount(){
    if(ecCount)ecCount.textContent=ecArea.value.length+' 字';
  }
  ecArea.addEventListener('input',updateCount);

  document.getElementById('ecCancel').addEventListener('click',closeEditor);

  document.getElementById('ecSave').addEventListener('click',function(){
    var txt=ecArea.value;
    if(!txt.trim()){ecCount.textContent='写点什么吧';return;}
    var d=currentEntry(editingKey);
    var newDate=ecDate.value||'';
    var newTime=fmtTime(newDate);
    var newTags;
    if(curCat==='思考'){
      newTags=[curTheme,curDrawer];
    }else{
      newTags=[curCat];
    }
    if(d&&d._id){
      var patch={text:txt,tags:newTags};
      if(newDate){patch.date=newDate;patch.time=newTime;}
      window.SUPA.update(d._id,patch).then(function(){
        for(var i=0;i<RAW.length;i++){if(RAW[i]._id===d._id){RAW[i].text=txt;RAW[i].tags=newTags;if(newDate){RAW[i].date=newDate;RAW[i].time=newTime;}break;}}
        rebuild();render();closeEditor();
      }).catch(function(e){alert('保存失败：'+e.message);});
    }else{
      var ov=getOverrides();
      var prev=ov[editingKey]||{};
      ov[editingKey]={text:txt,deleted:!!prev.deleted,tags:newTags,date:newDate||prev.date,time:newTime||prev.time};
      saveOverrides(ov);
      rebuild();render();closeEditor();
    }
  });

  document.getElementById('ecDelete').addEventListener('click',function(){
    if(!window.confirm('确定删除这条吗？'))return;
    var d=currentEntry(editingKey);
    if(d&&d._id){
      window.SUPA.remove(d._id).then(function(){
        RAW=RAW.filter(function(x){return x._id!==d._id;});
        rebuild();render();closeEditor();
      }).catch(function(e){alert('删除失败：'+e.message);});
    }else{
      var ov=getOverrides();
      var prev=ov[editingKey]||{};
      ov[editingKey]={text:prev.text,deleted:true};
      saveOverrides(ov);
      rebuild();render();closeEditor();
    }
  });

  ecRestore.addEventListener('click',function(){
    var ov=getOverrides();
    delete ov[editingKey];
    saveOverrides(ov);
    rebuild();render();closeEditor();
  });

  document.getElementById('resetAll').addEventListener('click',function(){
    if(!window.confirm('确定恢复全部本地改动吗？所有编辑和删除都会撤销。'))return;
    localStorage.removeItem(EDIT_KEY);
    state.q='';state.theme=null;state.drawer=null;
    searchInput.value='';clearBtn.classList.remove('show');
    rebuild();renderFilters();render();
  });

  var penguinReady=false;
  penguinImg.onload=function(){penguinReady=true;if(exKey)drawExport();};

  var THEMES={
    bw:{bg:'#ffffff',ink:'#111111',soft:'#999999',wm:'#c8c8c8'},
    paper:{bg:'#f5f1e8',ink:'#2a2520',soft:'#a89f8f',wm:'#d8d0c0'},
    night:{bg:'#111111',ink:'#f5f1e8',soft:'#777777',wm:'#333333'}
  };

  function wrapText(ctx,text,maxW){
    var lines=[];
    text.split('\n').forEach(function(para){
      var cur='';
      for(var i=0;i<para.length;i++){
        var ch=para[i];
        if(ctx.measureText(cur+ch).width>maxW){lines.push(cur);cur=ch;}
        else cur+=ch;
      }
      if(cur)lines.push(cur);
    });
    return lines;
  }

  function drawExport(){
    var d=currentEntry(exKey);
    if(!d)return;
    var T=THEMES[exTheme];
    var W=1080,H=1440;
    exCtx.fillStyle=T.bg;exCtx.fillRect(0,0,W,H);
    exCtx.textAlign='left';
    exCtx.textBaseline='alphabetic';

    // watermark penguin centered
    if(penguinReady){
      exCtx.save();
      exCtx.globalAlpha=0.15;
      var pw=880,ph=880;
      exCtx.drawImage(penguinImg,W/2-pw/2,H/2-ph/2-60,pw,ph);
      exCtx.restore();
    }

    var M=60; // margin

    // top double rule
    exCtx.strokeStyle=T.ink;exCtx.lineWidth=2;
    exCtx.beginPath();exCtx.moveTo(M,70);exCtx.lineTo(W-M,70);exCtx.stroke();
    exCtx.lineWidth=1;
    exCtx.beginPath();exCtx.moveTo(M,76);exCtx.lineTo(W-M,76);exCtx.stroke();

    // masthead centered
    exCtx.fillStyle=T.ink;
    exCtx.font='bold 54px "Noto Serif SC","Songti SC",serif';
    var mast="SYLVAN'S WORLD";
    var mw=exCtx.measureText(mast).width;
    exCtx.textAlign='center';
    exCtx.fillText(mast,W/2,130);

    // date line under masthead
    exCtx.font='16px -apple-system,sans-serif';
    exCtx.fillStyle=T.soft;
    var dateStr=d.date?d.date.replace(/-/g,'.'):'';
    var sub="VOL. 2026  ·  "+(dateStr||'NO. 2026');
    exCtx.fillText(sub,W/2,160);

    // rule
    exCtx.strokeStyle=T.ink;exCtx.lineWidth=1;
    exCtx.beginPath();exCtx.moveTo(M,180);exCtx.lineTo(W-M,180);exCtx.stroke();

    // section tag left, "Page 1" right
    exCtx.font='15px -apple-system,sans-serif';
    exCtx.fillStyle=T.soft;
    var cat='日记';
    if(d.tags&&d.tags.length){
      var solo=d.tags.filter(function(t){return ['日记','回忆','随笔','俳句','碎片'].indexOf(t)!==-1;});
      cat=solo[0]||'思考';
    }
    exCtx.textAlign='left';
    exCtx.fillText(cat.toUpperCase()+'  ·  '+cat,M,210);
    exCtx.textAlign='right';
    exCtx.fillText('Page 1',W-M,210);

    // split title and body
    var allText=(d.text||'').split('\n');
    var title=allText[0]||'';
    var body=allText.slice(1).join('\n');

    // big headline (serif bold, left aligned)
    var y=270;
    exCtx.fillStyle=T.ink;
    var titleSize=64;
    exCtx.font='bold '+titleSize+'px "Noto Serif SC","Songti SC",serif';
    var titleLines=wrapText(exCtx,title,W-M*2);
    titleLines.forEach(function(l){
      exCtx.fillText(l,M,y);
      y+=titleSize*1.15;
    });

    // byline
    y+=10;
    exCtx.font='15px -apple-system,sans-serif';
    exCtx.fillStyle=T.soft;
    exCtx.textAlign='left';
    exCtx.fillText('REPORTED BY SYLVAN',M,y);
    y+=20;

    // rule
    exCtx.strokeStyle=T.ink;exCtx.lineWidth=1;
    exCtx.beginPath();exCtx.moveTo(M,y);exCtx.lineTo(W-M,y);exCtx.stroke();
    y+=36;

    // body in columns
    exCtx.font='20px "Noto Serif SC","Songti SC",serif';
    exCtx.fillStyle=T.ink;
    var colW=(W-M*2-30)/2;
    var bodyLines=wrapText(exCtx,body||'',colW);
    var useTwoCol=bodyLines.length>10;
    var lh=32;
    if(useTwoCol){
      var mid=Math.ceil(bodyLines.length/2);
      var col1=bodyLines.slice(0,mid);
      var col2=bodyLines.slice(mid);
      var y1=y;
      col1.forEach(function(l){exCtx.fillText(l,M,y1);y1+=lh;});
      var y2=y;
      col2.forEach(function(l){exCtx.fillText(l,M+colW+30,y2);y2+=lh;});
      // column divider
      var lineH=Math.min(y1,y2)-y-10;
      exCtx.strokeStyle=T.soft;exCtx.lineWidth=1;
      exCtx.beginPath();
      exCtx.moveTo(M+colW+15,y);
      exCtx.lineTo(M+colW+15,y+lineH);
      exCtx.stroke();
      y=Math.max(y1,y2)+20;
    }else{
      bodyLines.forEach(function(l){exCtx.fillText(l,M,y);y+=lh;});
      y+=20;
    }

    // images: FIG boxes in lower right
    var images=d.images||[];
    images.forEach(function(src,idx){
      if(y>H-380)return;
      var boxW=300,boxH=220;
      var boxX=W-M-boxW;
      var boxY=y;
      exCtx.fillStyle=T.bg;
      exCtx.fillRect(boxX,boxY,boxW,boxH);
      exCtx.strokeStyle=T.ink;exCtx.lineWidth=1;
      exCtx.strokeRect(boxX,boxY,boxW,boxH);
      // load image async
      (function(sx,sy,sw,sh,cap){
        var img=new Image();
        img.crossOrigin='anonymous';
        img.onload=function(){
          var ratio=Math.min((sw-20)/img.width,(sh-40)/img.height);
          var dw=img.width*ratio,dh=img.height*ratio;
          exCtx.drawImage(img,sx+(sw-dw)/2,sy+10+(sh-50-dh)/2,dw,dh);
          exCtx.font='13px -apple-system,sans-serif';
          exCtx.fillStyle=T.soft;
          exCtx.textAlign='left';
          exCtx.fillText(cap,sx+10,sy+sh-14);
        };
        img.src=sx;
      })(src,boxY,boxW,boxH,'FIG. '+(idx+1)+' — SYLVAN ARCHIVE');
      y+=boxH+20;
    });

    // footer rule
    exCtx.strokeStyle=T.ink;exCtx.lineWidth=1;
    exCtx.beginPath();exCtx.moveTo(M,H-80);exCtx.lineTo(W-M,H-80);exCtx.stroke();

    // small penguin + sylvan's world
    if(penguinReady){
      exCtx.drawImage(penguinImg,M,H-60,24,24);
    }
    exCtx.font='14px -apple-system,sans-serif';
    exCtx.fillStyle=T.soft;
    exCtx.textAlign='left';
    exCtx.fillText("sylvan's world",M+34,H-42);
  }

  function openExport(key){
    exKey=key;exOverlay.classList.add('open');
    var run=function(){drawExport();};
    if(document.fonts&&document.fonts.ready){
      Promise.all([
        document.fonts.load('700 64px "Noto Serif SC"'),
        document.fonts.load('400 20px "Noto Serif SC"'),
        document.fonts.load('700 54px "Noto Serif SC"')
      ]).then(run).catch(run);
    } else { setTimeout(run,300); }
  }
  document.getElementById('exCancel').addEventListener('click',function(){exOverlay.classList.remove('open');});
  document.getElementById('exDownload').addEventListener('click',function(){
    var a=document.createElement('a');
    a.download='sylvan-'+(exKey||'card')+'.png';
    a.href=exCanvas.toDataURL('image/png');
    a.click();
  });
  document.querySelectorAll('.theme-btn').forEach(function(b){
    b.addEventListener('click',function(){
      document.querySelectorAll('.theme-btn').forEach(function(x){x.classList.remove('on');});
      b.classList.add('on');
      exTheme=b.dataset.theme;
      drawExport();
    });
  });

  /* 从 Supabase 加载；空的话自动迁移本地数据 */
  window.SUPA.load().then(function(rows){
    if(!rows.length){
      return window.SUPA.bulkInsert(LOCAL_DATA).then(function(){
        return window.SUPA.load();
      });
    }
    return rows;
  }).then(function(rows){
    DATA = rows.map(function(r){
      return {date:r.date||'',time:r.time||'',source:r.source||'',text:r.text||'',tags:r.tags||['日记'],_id:r.id,images:r.images||[],_createdAt:r.created_at||''};
    });
    DATA.forEach(function(d){d._key=String(d._id||hashKey(d.text));});
    RAW=DATA.slice();
    rebuild();renderFilters();render();
  }).catch(function(e){
    alert('云端连接失败，使用本地数据：'+e.message);
    DATA=LOCAL_DATA.slice();
    DATA.forEach(function(d){d._key=hashKey(d.text);});
    RAW=DATA;
    rebuild();renderFilters();render();
  });
})();
</script>
</body>
</html>
