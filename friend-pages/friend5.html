<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小分队 · sylvan's world</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { background: #0a0a0a; }
    body { background: #0a0a0a; color: #e8e8e8; font-family: 'Inter', sans-serif; overflow-x: hidden; transition: background 0.4s ease, color 0.4s ease; }
    body.light { background: #f5f3ef; color: #1a1a1a; }
    .nav { position: fixed; top:0; left:0; right:0; z-index:100; display:flex; justify-content:space-between; align-items:center; padding:1.5rem 2rem; mix-blend-mode:difference; }
    .nav a { color:#fff; text-decoration:none; font-size:0.72rem; letter-spacing:0.2em; text-transform:uppercase; opacity:0.7; }
    .hero { min-height:100vh; display:flex; flex-direction:column; justify-content:flex-end; padding:0 5vw 6vh; }
    .hero-name { font-family:'Playfair Display',serif; font-style:italic; font-size:clamp(4rem,14vw,12rem); line-height:0.95; color:#fff; margin-bottom:2rem; }
    .hero-meta { font-size:0.7rem; letter-spacing:0.3em; text-transform:uppercase; color:#666; }
    .film-strip { padding:0 5vw; column-count:2; column-gap:2px; }
    .film-strip img, .film-strip video { width:100%; display:block; margin-bottom:2px; break-inside:avoid; filter:grayscale(100%) contrast(1.05); }
    .film-strip img:hover { filter:grayscale(0%) contrast(1); }
    .section-label { padding:12vh 5vw 3vh; font-size:0.65rem; letter-spacing:0.35em; text-transform:uppercase; color:#555; }
    footer { padding:12vh 5vw 8vh; display:flex; justify-content:space-between; font-size:0.7rem; color:#555; }
  </style>
</head>
<body>
  <nav class="nav"><a href="../home.html">sylvan</a><div style="display:flex;gap:2rem;"><a href="../photos.html">摄影</a><a href="../home.html#friends">朋友</a></div></nav>
  <section class="hero"><div class="hero-meta">some photos of</div><h1 class="hero-name">小分队</h1></section>
  <div class="section-label">together</div><div class="film-strip" id="together"></div>
  <div class="section-label">solo</div><div class="film-strip" id="solo"></div>
  <footer><span>小分队</span><a href="../home.html#friends">← back</a></footer>
  <script>
    const id = 'friend7';
    const t = document.getElementById('together');
    const s = document.getElementById('solo');
    const CDN = window.matchMedia('(max-width: 768px)').matches ? 'https://res.cloudinary.com/jwjttap0/image/upload/w_1000,q_auto,f_auto/' : 'https://res.cloudinary.com/jwjttap0/image/upload/q_auto,f_auto/';
    for (let i = 1; i <= 30; i++) {
      const num = String(i).padStart(2, '0');
      const img = document.createElement('img');
      img.src = CDN + `friends/${id}/together/photo-${num}.jpg`;
      img.loading = 'lazy';
      img.onerror = () => img.remove();
      t.appendChild(img);
    }
    const solo = document.createElement('img');
    solo.src = CDN + `friends/${id}/solo/avatar.jpg`;
    solo.loading = 'lazy';
    solo.onerror = () => solo.remove();
    s.appendChild(solo);
  </script>
  <script src="../js/cursor.js"></script>
  <script src="../js/music.js"></script>
</body>
</html>
