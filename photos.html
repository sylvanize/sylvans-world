<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>摄影 · sylvan's world</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@300;400;500;600;700;900&family=Noto+Sans+SC:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <!-- 防止深色模式闪白：一进来就读取上次的选择 -->
  <script>(function(){try{if(localStorage.getItem('sylvan-theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
  <link rel="stylesheet" href="css/swiper-bundle.min.css">
  <style>
    /* =====================================================================
       摄影总页 · 左右分栏版式（版式比例参考 grndwrk.studio）
       ---------------------------------------------------------------------
       ★ 想调整【字号】或【方位/尺寸】？改下面的 --ph-* 变量即可，全部集中在这里。
       ★ 想改【文字内容】？往下找 <script> 里的 PHOTOS_CONFIG（本页文案），
         照片集名称/地点/日期/介绍在 js/data.js 的 SITE.places 里改。
       ===================================================================== */

    :root {
      /* ---------- 主题色（深色模式看下方 data-theme 覆盖；Theme 按钮自动切换并记住） ---------- */
      --ph-bg: #FFFFFF;        /* 页面底色 */
      --ph-ink: #1A1A1A;       /* 大标题 / 名称等主文字 */
      --ph-sub: #8A8A8A;       /* 次级文字（副标题、标签、NEXT/PREV） */
      --ph-faint: #B5B5B5;     /* 更淡文字（REGION 标签、页码） */
      --ph-desc2: #6A6A6A;     /* 介绍段落文字 */
      --ph-card: #F2F2F0;      /* 照片占位底色 */
      --ph-shadow: rgba(0,0,0,0.08); /* 相册大图阴影 */

      /* ---------- 字号（改这里控制字体大小） ---------- */
      --ph-title: clamp(10rem, 42vw, 78vh);   /* 左侧大标题「摄影」，铺满约 3/4 画面 */
      --ph-label: 0.85rem;                    /* 第二行 DATE 小标签 */
      --ph-name: clamp(2.8rem, 5vw, 4.4rem);  /* 当前照片集名称（信息卡放大） */
      --ph-tags: 1.05rem;                     /* 地点 · 日期 */
      --ph-intro: 1.3rem;                     /* 一句话介绍（放大） */
      --ph-nav: 0.9rem;                       /* NEXT / PREV */
      --ph-count: 0.9rem;                     /* 页码计数 */

      /* ---------- 方位 / 尺寸（改这里调整位置和大小） ---------- */
      --ph-left-w: clamp(400px, 62vw, 1250px); /* 左栏宽度（文字区） */
      --ph-left-pad: 2.2rem;                /* 左栏文字离屏幕左边的距离 */
      --ph-top-pad: 3vh;                    /* 左栏文字离顶部的距离 */
      --ph-info-mt: 13vh;                   /* 信息卡距大标题下方的距离（≈把信息卡下移到约 1/2 屏处） */
      --ph-right-w: clamp(450px, 30vw, 640px); /* 右侧照片列宽度（调大照片就改这里） */
      --ph-gap: clamp(10px, 1.2vh, 16px);   /* 照片间距 */
      --ph-img-ratio: 3 / 2;                /* 照片框 宽/高 比例（越大越扁） */
      --ph-strip-pad: 12vh;                 /* 照片列上下留白（顶部加大=照片列整体下移） */
    }

    /* 深色主题：右上角 Theme 按钮切换，选择会被记住 */
    html[data-theme="dark"] {
      --ph-bg: #0E0E0E;
      --ph-ink: #F2F2F0;
      --ph-sub: #8F8F8F;
      --ph-faint: #5E5E5E;
      --ph-desc2: #9A9A9A;
      --ph-card: #1C1C1C;
      --ph-shadow: rgba(0,0,0,0.55);
      /* 同步全局变量：页面底色 / 文字 / 导航一起切换 */
      --bg: #0E0E0E;
      --text: #F2F2F0;
      --text-dim: #8F8F8F;
      --text-subtle: #9A9A9A;
      --surface: #1C1C1C;
      --surface-hover: #262626;
      --line: #2A2A2A;
    }

    /* 主题切换时文字/底色平滑过渡 */
    body { transition: background-color 0.4s ease, color 0.4s ease; }
    .pl-title, .pl-label, .pl-name, .pl-tags, .pl-intro,
    .pl-bottom, .pl-prev, .pl-next, .pr-count, .pr-item, .gallery-section,
    .gallery-track img, .back-btn, #gallery-title, #gallery-intro, .pl-enter,
    .nav-desc {
      transition: color 0.4s ease, background-color 0.4s ease, border-color 0.4s ease;
    }

    /* ---------- 顶部导航（grndwrk 风格：logo + 描述语 + 右侧导航 + 主题切换） ---------- */
    .nav {
      padding: 1.5rem 2.4rem;
    }

    .nav-desc {
      font-size: 0.7rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      opacity: 0.55;
      margin-left: 2rem;
      margin-right: auto;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .nav-links {
      flex-direction: column;  /* 右上角导航竖排 */
      align-items: flex-end;
      gap: 0.9rem;
    }

    /* 「摄影」左边的小黑方块（用白色+混合反色：浅色主题显示为黑块，深色主题跟随反色成白块，与导航文字一致） */
    .nav-links a:first-child {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
    }
    .nav-links a:first-child::before {
      content: '';
      width: 0.55rem;
      height: 0.55rem;
      background: #fff; /* 靠父级 mix-blend 反色成黑方块 */
      flex-shrink: 0;
    }

    .theme-btn {
      background: none;
      border: none;
      padding: 0;
      font-family: inherit;
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #fff; /* 与 .nav a 一致，靠 mix-blend 自动反色 */
      opacity: 0.7;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }
    .theme-btn:hover { opacity: 1; }

    /* 导航链接 hover 切换效果（参考 grndwrk：一条小方块从左滑入） */
    .nav-links a, .theme-btn {
      position: relative;
    }
    .nav-links a::after, .theme-btn::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: -0.35rem;
      width: 100%;
      height: 2px;
      background: currentColor;
      transform: scaleX(0);
      transform-origin: left center;
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .nav-links a:hover::after, .theme-btn:hover::after {
      transform: scaleX(1);
    }

    /* ---------- 全页文字统一用 sylvan's 同款字体（Anton 负责英文，中文自动用思源黑体 900） ---------- */
    .pl-label, .pl-name, .pl-tags, .pl-intro, .pl-enter,
    .pl-bottom, .pl-prev, .pl-next, .nav-logo, .nav-desc, .nav-links a, .theme-btn,
    .pr-name, .pr-count, .back-btn, #gallery-title, #gallery-intro {
      font-family: 'Anton', 'Noto Sans SC', 'Inter', sans-serif;
    }

    /* ---------- 左右分栏容器 ---------- */
    .photos-split {
      display: flex;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* ---------- 左栏：固定文字 ---------- */
    .photos-left {
      flex-shrink: 0;
      width: var(--ph-left-w);
      padding: var(--ph-top-pad) var(--ph-left-pad) 3rem;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      overflow: hidden;
    }

    .pl-title {
      font-family: 'Anton', 'Noto Sans SC', 'Inter', sans-serif;
      font-size: var(--ph-title);
      font-weight: 900;
      letter-spacing: -0.08em;
      line-height: 0.82;
      color: var(--ph-ink);
      white-space: nowrap;
    }

    /* 当前照片集信息（随右侧滚动联动更新） */
    .pl-current {
      margin-top: var(--ph-info-mt);
      width: 100%;
    }

    /* ---- 第一行：REGION 小标签 + 照片集名（同一行，标签高度=名字的 1/2，参考 grndwrk 的 CLIENT + THE MADRONA） ---- */
    .pl-row1 {
      display: flex;
      align-items: baseline;
      gap: 1.1rem;
    }

    .pl-label {
      font-size: calc(var(--ph-name) * 0.5); /* REGION 标签高度 = 照片集名字高的 1/2 */
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--ph-faint);
      transition: opacity 0.35s ease, transform 0.35s ease, color 0.4s ease;
    }

    .pl-name {
      font-family: 'Noto Sans SC', 'Inter', sans-serif;
      font-size: var(--ph-name);
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 1.02;
      color: var(--ph-ink);
      transition: opacity 0.35s ease, transform 0.35s ease, color 0.4s ease;
    }

    /* ---- 第二行：DATE 标签 + 中国 · 日期（参考 grndwrk 的 DELIVERABLES 行） ---- */
    .pl-row2 {
      display: flex;
      align-items: baseline;
      gap: 0.9rem;
      margin-top: 0.9rem;
    }
    .pl-row2 .pl-label {
      font-size: var(--ph-label); /* DATE 标签用标准小标签字号 */
    }

    .pl-tags {
      font-size: var(--ph-tags);
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--ph-sub);
      transition: opacity 0.35s ease, transform 0.35s ease, color 0.4s ease;
    }

    /* ---- 第三行：一句话介绍（灰色 · 无标签直接写内容 · 自动换行 · 预留约 30 字空档） ---- */
    .pl-intro {
      font-size: var(--ph-intro);
      font-weight: 400;
      line-height: 1.7;
      color: var(--ph-sub);      /* 灰色（想更淡改 --ph-faint） */
      margin-top: 1rem;
      max-width: 30em;           /* ≈ 30 个中文字宽，超过就自动换行 */
      min-height: 1.9em;         /* 预留约 30 字的空档（一行高），避免切换时文字长短不一引起跳动 */
      transition: opacity 0.35s ease, transform 0.35s ease, color 0.4s ease;
    }

    .pl-enter {
      display: inline-block;
      margin-top: 1.3rem;
      font-size: var(--ph-intro);
      font-weight: 500;
      border-bottom: 1px solid var(--ph-ink);
      padding-bottom: 0.25rem;
      cursor: pointer;
      transition: opacity 0.25s ease, border-color 0.4s ease;
    }
    .pl-enter:hover { opacity: 0.55; }

    /* 文字切换动画（参考 grndwrk：旧文字淡出上移，新文字淡入，交叉过渡）
       想改速度：改下面两个 0.3s；想改位移幅度：改 translateY 的 14px */
    .pl-current .swap-out {
      opacity: 0;
      transform: translateY(14px);
      transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* 左栏底部：NEXT / PREV */
    /* 左栏底部：NEXT / PREV（参考站样式：两行竖排，标签 + 相邻照片集名） */
    .pl-bottom {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.7rem;
      margin-top: auto;
      padding-top: 1.6rem;
      font-size: var(--ph-nav);
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .pl-prev,
    .pl-next {
      background: none;
      border: none;
      padding: 0;
      font: inherit;
      font-weight: 500;
      letter-spacing: inherit;
      text-transform: inherit;
      color: var(--ph-sub);
      cursor: pointer;
      white-space: nowrap;
      display: inline-flex;
      align-items: baseline;
      gap: 0.9rem;
      transition: color 0.2s ease;
    }
    .pl-prev:hover, .pl-next:hover { color: var(--ph-ink); }

    /* 标签（NEXT/PREV）淡一点，照片集名深色加粗（参考站深浅对比） */
    .pb-label { opacity: 0.55; }
    .pb-name { color: var(--ph-ink); font-weight: 700; transition: opacity 0.2s ease; }
    .pl-prev:hover .pb-name, .pl-next:hover .pb-name { opacity: 0.55; }

    /* ---------- 右栏：竖向滚动照片列（窄条，参考站比例） ---------- */
    .photos-right {
      flex: 0 0 auto;
      width: var(--ph-right-w);
      margin-left: clamp(1rem, 4vw, 4rem);
      position: relative;
      overflow: hidden;
      padding: var(--ph-strip-pad) 0;
    }

    .pr-track {
      display: flex;
      flex-direction: column;
      gap: var(--ph-gap);
      will-change: transform;
      /* 轨道底部留白：让滚动可以一直滑过末尾企鹅，下面没有相框，
         只有一段空白——滚动到企鹅后不会死死卡住 */
      padding-bottom: 55vh;
    }

    .pr-item {
      position: relative;
      flex-shrink: 0;
      aspect-ratio: var(--ph-img-ratio);
      /* 高度兜底：老浏览器不支持 aspect-ratio 时照片项会塌陷导致划不动，
         这里显式给高度（宽 × 7/8，与 8/7 比例等价）；支持 aspect-ratio 的浏览器会用它覆盖 */
      height: calc(var(--ph-right-w) * 0.875);
      overflow: hidden;
      cursor: pointer;
      background: var(--ph-card);
    }

    .pr-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: grayscale(100%);
      transition: filter 0.6s ease, transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      display: block;
    }

    .pr-item:hover img,
    .pr-item.active img {
      filter: grayscale(0%);
      transform: scale(1.03);
    }

    /* 图片左下角：照片集名称（常显） */
    .pr-item .pr-name {
      position: absolute;
      left: 1rem;
      bottom: 0.9rem;
      z-index: 2;
      font-size: 0.78rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #fff;
      text-shadow: 0 1px 12px rgba(0,0,0,0.55);
      pointer-events: none;
    }

    /* ---------- 彩蛋：企鹅相册（data.js 里 egg:true 的最后一条）----------
       它是一张真相册：左栏显示它的 REGION/日期/简介，页码也算它。
       但它的相框多叠了一张"举起相机"的图（photos/<id>/photo-01.png）：
       鼠标停留时淡入举起姿态，移走淡回放下姿态（cover.jpg）。 */
    .pr-item.pg-egg {
  background: transparent;      /* 去框：没有浅灰卡片底，企鹅直接显示 */
  cursor: pointer;
}
.pr-item.pg-egg .pr-name {
  display: none;                /* 去字：不显示底部"A NOSSA…"相册名标签 */
}
    .pr-item.pg-egg img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      image-rendering: pixelated;   /* 保持像素颗粒 */
      transition: opacity 0.25s ease; /* 举/放切换的淡入淡出 */
      pointer-events: none;
    }
    .pr-item.pg-egg .pg-up { opacity: 0; }                 /* 举起态默认隐藏 */
    .pr-item.pg-egg:hover .pg-up { opacity: 1; }           /* 悬停：举起图盖上来 */

    /* 页码计数：贴在照片列左边（对应参考站 02/12 的位置） */
    .pr-count {
      position: absolute;
      left: calc(var(--ph-left-w) + 1.2vw);
      top: 49%;
      transform: translateY(-50%);
      font-size: var(--ph-count);
      letter-spacing: 0.15em;
      color: var(--ph-faint);
      z-index: 5;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    .pr-count b { font-weight: 500; color: var(--ph-desc2); }

    /* ---------- 相册大图浏览（点击照片集后进入，沿用横向阻尼滑动） ---------- */
    /* ======== 相册大图视图：p-del 式全屏滑动（黑底） ======== */
    .gallery-section {
      position: fixed;
      inset: 0;
      z-index: 200; /* 必须高于顶部导航的 z-index:100，否则「← 返回」会被导航盖住点不到 */
      background: #000;                 /* 一律黑背景（背景色切换以后再做） */
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.45s ease;
    }
    .gallery-section.open {
      opacity: 1;
      pointer-events: auto;
    }
    .gallery-viewport {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
    /* 每张照片占一屏，图 3:2 比例 contain、上下留一点边框（不铺满） */
    .gallery-track {
      display: flex;
      height: 100vh;
      will-change: transform;
    }
    /* 每张照片一个满屏 slide：一屏 100vw，保证静止时画面只有一张图 */
    .gallery-track .gs {
      flex: 0 0 100vw;
      flex-shrink: 0;
      flex-grow: 0;
      width: 100vw;
      min-width: 100vw;
      max-width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .gallery-track img {
      aspect-ratio: 3 / 2;             /* 统一 3:2 比例 */
      height: 92vh;                    /* 图占屏近满，上下只留一点边框 */
      width: auto;
      max-width: 86vw;
      object-fit: contain;
      border-radius: 0;
      box-shadow: none;
      -webkit-user-drag: none;   /* 禁原生图片拖拽（会被浏览器拿去当"拖图"，抢走滑动） */
      user-select: none;
    }

    /* 角标：14px 白字（p-del 的字号颜色），左右垂直居中 */
    .back-btn {
      position: absolute;
      left: 28px; top: 28px;
      z-index: 210;
      background: none; border: none; padding: 0;
      font-size: 14px;
      letter-spacing: 0.02em;
      color: #fff; opacity: 0.85;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }
    .back-btn:hover { opacity: 1; }
    #gallery-title {
      position: absolute;
      left: 28px; top: 50%; transform: translateY(-50%);
      z-index: 210;
      font-family: Helvetica, Arial, 'Noto Sans SC', sans-serif;
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 0.02em;
      color: #fff;
    }
    .g-count { opacity: 0.55; margin-left: 10px; font-size: 13px; }
    #gallery-intro {
      position: absolute;
      left: 28px; bottom: 28px;
      z-index: 210;
      font-size: 14px;
      letter-spacing: 0.02em;
      color: #fff; opacity: 0.85;
      text-transform: none;
    }
    #gallery-date {
      position: absolute;
      right: 28px; top: 50%; transform: translateY(-50%);
      z-index: 210;
      font-size: 14px;
      letter-spacing: 0.02em;
      color: #fff; opacity: 0.6;
    }
    /* 角标文字不拦截点击；返回按钮保持可点 */
    #gallery-title, #gallery-intro, #gallery-date { pointer-events: none; }

    /* ---------- 中等屏幕：左栏变窄，右栏收窄 ---------- */
    @media (max-width: 1200px) {
      :root {
        --ph-left-w: clamp(320px, 45vw, 600px);
        --ph-right-w: clamp(300px, 40vw, 420px);
        --ph-left-pad: 1.5rem;
      }
      .nav-desc { display: none; }
    }

    /* ---------- 移动端：上下堆叠 ---------- */
    @media (max-width: 768px) {
      .nav { padding: 1rem !important; flex-wrap: wrap; }
      .nav-desc { display: none; }
      .nav-links { flex-direction: row !important; gap: 1rem !important; font-size: .65rem !important; }
      .nav-logo { font-size: .85rem !important; }

      .photos-split { flex-direction: column; height: auto; overflow: visible; }
      .photos-left {
        width: 100%;
        padding: 5rem 1.2rem 1.5rem;
        min-height: auto;
      }
      .pl-title { font-size: clamp(4rem, 20vw, 8rem) !important; }
      .pl-name { font-size: clamp(1.8rem, 7vw, 2.5rem) !important; }
      .pl-tags { font-size: .8rem !important; }
      .pl-intro { font-size: 1rem !important; }
      .pl-enter { font-size: 1rem !important; }
      .pl-current { margin-top: 1.8rem; }
      .pl-bottom { margin-top: 1.5rem; }
      .pl-prev, .pl-next { font-size: .75rem !important; }

      .photos-right {
        flex: none;
        width: 100%;
        margin-left: 0;
        padding: 0 1rem 2rem;
      }
      .pr-track { padding-bottom: 10vh !important; }
      .pr-item { height: auto !important; aspect-ratio: 3/2 !important; }
      .pr-count { display: none; }

      .gallery-track img { height: auto; max-height: 70vh; max-width: 92vw; }
      .back-btn, #gallery-title, #gallery-intro, #gallery-date { font-size: 12px !important; left: 16px !important; }
    }
  </style>
</head>
<body>
  <nav class="nav">
    <a href="home.html" class="nav-logo">sylvan</a>
    <p class="nav-desc" id="nav-desc"></p>
    <div class="nav-links">
      <a href="home.html#photos">摄影</a>
      <a href="home.html#friends">我的伙伴</a>
      <a href="another-me.html">另一种我</a>
      <button class="theme-btn" id="theme-toggle" aria-label="切换浅色/深色主题">Theme</button>
    </div>
  </nav>

  <!-- ==================== 左右分栏主视图 ==================== -->
  <main class="photos-split">
    <!-- 左栏：固定文字 -->
    <section class="photos-left">
      <h1 class="pl-title" id="pl-title">摄影</h1>

      <div class="pl-current" id="pl-current">
        <div class="pl-row1">
          <span class="pl-label" id="pl-label">REGION</span>
          <h2 class="pl-name" id="pl-name"></h2>
        </div>
        <div class="pl-row2">
          <span class="pl-label" id="pl-date-label">DATE</span>
          <span class="pl-tags" id="pl-tags"></span>
        </div>
        <p class="pl-intro" id="pl-intro"></p>
        <a class="pl-enter" id="pl-enter">进入相册 →</a>
      </div>

      <div class="pl-bottom">
        <button class="pl-next" id="pl-next"><span class="pb-label" id="pl-next-label">NEXT</span><span class="pb-name" id="pl-next-name"></span></button>
        <button class="pl-prev" id="pl-prev"><span class="pb-label" id="pl-prev-label">PREV</span><span class="pb-name" id="pl-prev-name"></span></button>
      </div>
    </section>

    <!-- 右栏：竖向滚动照片列 -->
    <section class="photos-right" id="photos-right">
      <div class="pr-track" id="photos-track"></div>
    </section>

    <!-- 页码计数 -->
    <div class="pr-count"><b id="pr-count-num">01</b> / <span id="pr-count-total">08</span></div>
  </main>

  <!-- ==================== 相册大图视图（点击照片集后显示） ==================== -->
  <section class="gallery-section" id="gallery-section">
    <button class="back-btn" id="back-to-regions">← 返回</button>
    <h2 id="gallery-title"><span id="gallery-name"></span><span class="g-count" id="gallery-count">01</span></h2>
    <p id="gallery-intro"></p>
    <p id="gallery-date"></p>
    <div class="gallery-viewport swiper-container" id="gallery-viewport">
      <div class="gallery-track swiper-wrapper" id="gallery-track"></div>
    </div>
  </section>

  <!-- =====================================================================
       ★★★ 文字内容配置 ★★★
       想改「摄影 / TAKE SOME PHOTO / 介绍段落 / REGION 标签 / 进入相册 / NEXT / PREV」
       就改下面这个 PHOTOS_CONFIG，别动其它代码。
       照片集名称、地点、日期、一句话介绍 → 在 js/data.js 的 SITE.places 里改。
       想加新照片集 → js/data.js 加一条 + 建 photos/新文件夹，页面自动出现。
       ===================================================================== -->
  <script>
    const PHOTOS_CONFIG = {
      title: "sylvan's",           // 左侧大标题（随便改文字，会自动缩放填满宽度）
      navDesc: "is a photo journal of places & moments", // 顶部导航里的描述语（可改成你自己的话）
      label: "REGION",             // 信息区顶部的小标签（和照片集名同一行）
      dateLabel: "DATE",           // 第二行的小标签（后面跟 国家 · 日期）
      enterLabel: "进入相册 →",    // 进入相册按钮文字
      nextLabel: "NEXT",           // 下一个（按钮标签，右边自动带上照片集名）
      prevLabel: "PREV",           // 上一个（按钮标签，右边自动带上照片集名）
    };
    document.getElementById('nav-desc').textContent = PHOTOS_CONFIG.navDesc;
  </script>

  <script src="js/data.js"></script>
  <script src="js/swiper-bundle.min.js"></script>
  <script src="js/photos.js?v=30"></script>

  <!-- 标题自动适配：无论把大标题改成什么文字，都自动缩放填满左栏宽度（不溢出） -->
  <script>
    (function () {
      function fitTitle() {
        var t = document.querySelector('.pl-title');
        var panel = document.querySelector('.photos-left');
        if (!t || !panel) return;
        var maxW = panel.clientWidth * 0.78; /* 标题占左栏宽度比例：0.78=稍小，0.94=撑满 */
        t.style.fontSize = ''; // 先还原 CSS 变量设置的字号
        var w = t.getBoundingClientRect().width;
        if (w > maxW) {
          var fs = parseFloat(getComputedStyle(t).fontSize);
          t.style.fontSize = (fs * maxW / w) + 'px';
        }
      }
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitTitle);
      window.addEventListener('load', fitTitle);
      window.addEventListener('resize', fitTitle);
      document.addEventListener('DOMContentLoaded', fitTitle);
      fitTitle();
    })();
  </script>

  <!-- 主题切换：右上角 Theme 按钮，选择会自动记住（localStorage） -->
  <script>
    (function () {
      var root = document.documentElement;
      var btn = document.getElementById('theme-toggle');
      if (!btn) return;
      btn.addEventListener('click', function () {
        var dark = root.getAttribute('data-theme') === 'dark';
        if (dark) {
          root.removeAttribute('data-theme');
          try { localStorage.setItem('sylvan-theme', 'light'); } catch (e) {}
        } else {
          root.setAttribute('data-theme', 'dark');
          try { localStorage.setItem('sylvan-theme', 'dark'); } catch (e) {}
        }
      });
    })();
  </script>
</body>
</html>
